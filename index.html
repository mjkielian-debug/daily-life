<script>

const DB_NAME="daily-life-local-v2";
const DB_VERSION=1;
const STORE="kv";
let __db;
function openDB(){
  if(__db) return Promise.resolve(__db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
    req.onsuccess=()=>{__db=req.result;resolve(__db)};
    req.onerror=()=>reject(req.error);
  });
}
async function dbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbSet(key,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbClear(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}

</script>

<script>

const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const ymd=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{const v=Number(n||0);return `${v<0?"-":""}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`};
const dl=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const blankState=()=>({
  version:9,createdAt:new Date().toISOString(),
  profile:{name:"",location:"Lincoln, Nebraska"},
  settings:{
    readers:["Me"],calTarget:2100,proteinTarget:100,appliedCloudEntryIds:[],bankTransactionReviews:{},
    recurringTasks:[
      {title:"Everyone reading",category:"family",days:[0,1,2,3,4,5,6],order:60,notes:"Reading / pages logged"}
    ],
    mealPatterns:[]
  },
  tasks:[],workShifts:[],waterLogs:[],stretchLogs:[],selfCare:[],foodLogs:[],readingLogs:[],chores:[],
  meals:[],shopping:[],homeLogs:[],outfits:[],tireLogs:[],accounts:[],bills:[],retirement:[],budget:{months:{},spending:[]}
});
let state=blankState(),view="today",installPrompt=null,weather=null;
const themes=[["Lavender Moon","#c9b0ff","#f3a9ff","#9fdcff"],["Rosewater Sky","#f3b6cf","#e9b7ff","#a9d8ff"],["Peach Stardust","#ffc7a8","#f5b7d3","#c7b7ff"],["Bluebell Twilight","#aaaef8","#cab5ff","#8ed9ea"],["Fairy Garden","#a9e8c2","#d3b8ff","#f2c8df"],["Strawberry Night","#f4a5bf","#d7adff","#ffc6a8"],["Cotton Candy Cosmos","#d4b5ff","#ffb8da","#a7e5f4"]];
async function save(){await dbSet("state",state);if(typeof cloudSchedulePush==="function")cloudSchedulePush()}
function theme(){const t=themes[Math.abs(Math.floor(Date.now()/86400000))%themes.length];document.documentElement.style.setProperty("--primary",t[1]);document.documentElement.style.setProperty("--secondary",t[2]);document.documentElement.style.setProperty("--accent",t[3]);return t[0]}
function moon(){const syn=29.530588853,e=Date.UTC(2000,0,6,18,14),age=((((Date.now()-e)/86400000)%syn)+syn)%syn,p=age/syn,il=(1-Math.cos(2*Math.PI*p))/2;if(p<.03||p>=.97)return["New Moon","🌑",age,il];if(p<.22)return["Waxing Crescent","🌒",age,il];if(p<.28)return["First Quarter","🌓",age,il];if(p<.47)return["Waxing Gibbous","🌔",age,il];if(p<.53)return["Full Moon","🌕",age,il];if(p<.72)return["Waning Gibbous","🌖",age,il];if(p<.78)return["Last Quarter","🌗",age,il];return["Waning Crescent","🌘",age,il]}
function weatherText(c){if(c===0)return"Clear";if([1,2].includes(c))return"Partly cloudy";if(c===3)return"Cloudy";if([45,48].includes(c))return"Foggy";if([51,53,55,56,57].includes(c))return"Drizzle";if([61,63,65,66,67,80,81,82].includes(c))return"Rain";if([71,73,75,77,85,86].includes(c))return"Snow";if([95,96,99].includes(c))return"Thunderstorms";return"Mixed conditions"}
async function getWeather(){async function go(lat,lon){try{const u=new URL("https://api.open-meteo.com/v1/forecast");u.searchParams.set("latitude",lat);u.searchParams.set("longitude",lon);u.searchParams.set("current","temperature_2m,apparent_temperature,weather_code,wind_speed_10m");u.searchParams.set("daily","temperature_2m_max,temperature_2m_min,precipitation_probability_max");u.searchParams.set("temperature_unit","fahrenheit");u.searchParams.set("wind_speed_unit","mph");u.searchParams.set("forecast_days","1");u.searchParams.set("timezone","auto");const j=await(await fetch(u)).json();weather={temp:Math.round(j.current.temperature_2m),feels:Math.round(j.current.apparent_temperature),code:j.current.weather_code,wind:Math.round(j.current.wind_speed_10m),high:Math.round(j.daily.temperature_2m_max[0]),low:Math.round(j.daily.temperature_2m_min[0]),rain:Math.round(j.daily.precipitation_probability_max[0]||0)};render()}catch(e){}}navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),()=>go(40.8136,-96.7026),{timeout:5000,maximumAge:900000}):go(40.8136,-96.7026)}
function ensureToday(){
  const date=ymd(),wd=new Date(date+"T12:00:00").getDay(),existing=new Set(state.tasks.filter(x=>x.date===date).map(x=>x.title));
  for(const t of state.settings.recurringTasks||[]){
    if((t.days||[]).includes(wd)&&!existing.has(t.title)){state.tasks.push({id:uid(),date,title:t.title,category:t.category||"life",notes:t.notes||"",done:false,order:t.order||100});existing.add(t.title)}
  }
  const ws=state.workShifts.find(x=>x.date===date);
  if(ws?.scheduled&&!existing.has("UPS shift"))state.tasks.push({id:uid(),date,title:"UPS shift",category:"work",notes:`Scheduled ${ws.scheduled}`,done:!!ws.end,order:10});
}

function migrateState(s){
  const b=blankState();
  s=s||b;
  s.version=Math.max(Number(s.version)||0,9);
  s.profile=s.profile||b.profile;
  s.settings={...b.settings,...(s.settings||{})};
  s.settings.readers=Array.isArray(s.settings.readers)?s.settings.readers:b.settings.readers;
  s.settings.recurringTasks=Array.isArray(s.settings.recurringTasks)?s.settings.recurringTasks:[];
  s.settings.mealPatterns=Array.isArray(s.settings.mealPatterns)?s.settings.mealPatterns:[];
  s.settings.appliedCloudEntryIds=Array.isArray(s.settings.appliedCloudEntryIds)?s.settings.appliedCloudEntryIds:[];
  if(!s.settings.bankTransactionReviews||typeof s.settings.bankTransactionReviews!=="object"||Array.isArray(s.settings.bankTransactionReviews))s.settings.bankTransactionReviews={};
  for(const key of ["tasks","workShifts","waterLogs","stretchLogs","selfCare","foodLogs","readingLogs","chores","meals","shopping","homeLogs","outfits","tireLogs","accounts","bills","retirement"]){
    if(!Array.isArray(s[key]))s[key]=[];
  }
  for(const bill of s.bills){
    if(bill.paymentAccountKey===undefined)bill.paymentAccountKey="";
    if(bill.paymentSetup===undefined)bill.paymentSetup="Unknown";
    if(bill.repeatMonths===undefined)bill.repeatMonths=0;
    if(bill.desiredAccountKey===undefined)bill.desiredAccountKey="";
    if(bill.amountType===undefined)bill.amountType="Fixed amount";
    if(bill.frequency===undefined)bill.frequency=Number(bill.repeatMonths)===1?"Monthly":Number(bill.repeatMonths)===12?"Annual":Number(bill.repeatMonths)>0?"Irregular":"One-time";
  }
  // Additive state migration: keep all existing records and unknown fields.
  if(!s.budget||typeof s.budget!=="object"||Array.isArray(s.budget))s.budget={};
  if(!s.budget.months||typeof s.budget.months!=="object"||Array.isArray(s.budget.months))s.budget.months={};
  if(!Array.isArray(s.budget.spending))s.budget.spending=[];
  return s;
}
function ensureMealPatterns(){
  const patterns=state.settings.mealPatterns||[];
  const today=new Date();
  for(let offset=-14;offset<=35;offset++){
    const d=new Date(today);d.setDate(today.getDate()+offset);
    const date=ymd(d),wd=d.getDay();
    for(const p of patterns){
      if(Number(p.weekday)!==wd)continue;
      if(state.meals.some(x=>x.date===date&&x.type==="dinner"))continue;
      state.meals.push({id:uid(),date,type:"dinner",dish:p.dish||"",method:p.method||"",assigned:p.assigned||"",status:"planned",notes:p.notes||"",pattern:true});
    }
  }
}
const todayTasks=()=>state.tasks.filter(x=>x.date===ymd()).sort((a,b)=>(a.order||0)-(b.order||0));
const water=()=>state.waterLogs.filter(x=>x.date===ymd()).reduce((s,x)=>s+Number(x.oz||0),0);
const stretch=()=>state.stretchLogs.filter(x=>x.date===ymd()).reduce((s,x)=>s+Number(x.minutes||0),0);
const food=()=>state.foodLogs.filter(x=>x.date===ymd());
const reads=()=>state.readingLogs.filter(x=>x.date===ymd());
const tire=()=>[...state.tireLogs].sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")))[0]||null;
const work=()=>state.workShifts.find(x=>x.date===ymd())||null;
function wh(w){if(!w?.start||!w?.end)return 0;const[sh,sm]=w.start.split(":").map(Number),[eh,em]=w.end.split(":").map(Number);let m=eh*60+em-(sh*60+sm);if(m<0)m+=1440;return m/60}
function totals(){const f=food();return{cal:f.reduce((s,x)=>s+Number(x.calories||0),0),protein:f.reduce((s,x)=>s+Number(x.protein||0),0),monsters:f.filter(x=>x.category==="monster").length}}

function monthlyReaderTickets(){
  const prefix=ymd().slice(0,7), readers=state.settings.readers||[];
  return readers.map(reader=>{
    const daily={};
    for(const r of state.readingLogs.filter(x=>x.reader===reader&&x.date.startsWith(prefix)))daily[r.date]=(daily[r.date]||0)+Number(r.pages||0);
    let tickets=0,pages=0,days=0;
    for(const p of Object.values(daily)){pages+=p;days++;tickets+=p>=40?3:p>=20?2:p>=5?1:0}
    return {reader,tickets,pages,days};
  });
}
function spinReaderWheel(){
  const pool=[];
  for(const r of monthlyReaderTickets())for(let i=0;i<r.tickets;i++)pool.push(r.reader);
  if(!pool.length){alert("No Reader Wheel tickets earned yet this month.");return}
  const winner=pool[Math.floor(Math.random()*pool.length)];
  alert(`Reader Wheel winner: ${winner}!`);
}
function nav(id,icon,label){return`<button class="navbtn ${(view===id||(id==="more"&&view==="budget"))?"active":""}" onclick="setView('${id}')"><div style="font-size:1.1rem">${icon}</div>${label}</button>`}
function needsSetup(){return !state.profile?.name}
function renderSetup(){const user=cloudUser?.();return `<main class="app"><header><div><div class="eyebrow">Private local-first + optional cloud</div><div class="title">Daily Life ✦</div></div></header><div class="setupCard"><h2>Set up this device</h2><p class="muted">Start locally, restore a private backup, or sign in to your Daily Life cloud account. Public app code contains no personal records.</p><div class="warning">If you already have the private starter backup that came with this package, use <b>Restore private starter backup</b>. Do not upload that backup to a public website or GitHub repository.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="document.querySelector('#restoreFile').click()">Restore private starter backup</button><button class="btn" onclick="manualSetup()">Start blank</button>${user?`<button class="btn" onclick="cloudRestoreSnapshot()">Restore cloud copy</button>`:`<button class="btn" onclick="openCloudAuth()">Sign in / cloud account</button>`}</div></div></main>`}
function render(){if(needsSetup()){document.querySelector("#app").innerHTML=renderSetup();return}ensureToday();save();const t=theme(),m=moon(),f=totals(),w=work(),h=wh(w),tk=todayTasks(),done=tk.filter(x=>x.done).length,nt=tk.find(x=>!x.done),tr=tire();document.querySelector("#app").innerHTML=`<main class="app"><header><div><div class="eyebrow">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div><div class="title">Daily Life ✦</div><div class="muted small">${esc(state.profile.name)} · local-first</div></div><div><div class="pill">✧ ${t}</div>${installPrompt?`<button class="btn primary small" style="margin-top:7px" onclick="installApp()">Install app</button>`:""}</div></header>${view==="today"?todayView(m,f,w,h,tk,done,nt,tr):""}${view==="log"?logView(f,w,tr):""}${view==="family"?familyView():""}${view==="home"?homeView():""}${view==="more"?moreView():""}${view==="budget"?budgetView():""}</main><nav class="bottom-nav">${nav("today","✦","Today")}${nav("log","＋","Log")}${nav("family","♡","Family")}${nav("home","⌂","Home")}${nav("more","•••","More")}</nav>`}
function todayView(m,f,w,h,tk,done,nt,tr){return`<div class="grid2"><div class="card glow"><div class="hero"><div class="orb">${m[1]}</div><div><div class="eyebrow">Moon today</div><h2>${m[0]}</h2><div class="muted small">${Math.round(m[3]*100)}% · lunar day ${m[2].toFixed(1)}</div></div></div></div><div class="card glow"><div class="eyebrow">Weather</div><h2>${weather?`${weather.temp}° · ${weatherText(weather.code)}`:"Loading…"}</h2><div class="muted small">${weather?`Feels ${weather.feels}° · H ${weather.high}° / L ${weather.low}° · Rain ${weather.rain}% · Wind ${weather.wind} mph`:"Uses location when allowed; Lincoln fallback."}</div></div></div><div class="grid2"><div class="card glow"><div class="eyebrow">Right now</div><h2>${esc(nt?.title||"Nothing urgent")}</h2><div class="muted">${esc(nt?.notes||"Tracked list is clear.")}</div></div><div class="card"><div class="eyebrow">Today</div><div class="big">${done} / ${tk.length}</div><div class="muted small">tasks complete</div></div></div><div class="grid2"><div class="metric"><div class="eyebrow">UPS</div><div class="big">${h.toFixed(2)} h</div><div class="muted small">${h?(Number(w?.rate)>0?money(h*Number(w.rate))+" est. gross":"Add hourly rate for estimate"):(w?.scheduled?`Scheduled ${w.scheduled}`:"No shift")}</div></div><div class="metric"><div class="eyebrow">Food</div><div class="big">${Math.round(f.cal)} cal</div><div class="muted small">${Math.round(f.protein)} g protein</div></div><div class="metric"><div class="eyebrow">Water</div><div class="big">${water()} oz</div><button class="btn primary" onclick="addWater(26)">+26 oz</button></div><div class="metric"><div class="eyebrow">Tire</div><div class="big">${tr?tr.psi+" PSI":"—"}</div><div class="muted small">${esc(tr?.notes||"No reading")}</div></div></div><div class="card"><div class="section-title"><h2>Today’s plan</h2><button class="btn" onclick="openTask()">+ Add</button></div>${tk.length?tk.map(x=>`<div class="row"><label class="task"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask('${x.id}',this.checked)"><span class="${x.done?"done":""}">${esc(x.title)}${x.notes?`<div class="muted small">${esc(x.notes)}</div>`:""}</span></label><span class="tag">${esc(x.category)}</span></div>`).join(""):`<div class="notice">No tasks yet.</div>`}</div>`}
function logView(f,w,tr){return`<div class="grid2"><div class="card"><div class="eyebrow">Water</div><div class="big">${water()} oz</div><div class="actions"><button class="btn primary" onclick="addWater(26)">+26</button><button class="btn" onclick="customWater()">Custom</button></div></div><div class="card"><div class="eyebrow">Stretch</div><div class="big">${stretch()} min</div><div class="actions"><button class="btn primary" onclick="addStretch(5)">+5</button><button class="btn" onclick="addStretch(10)">+10</button></div></div></div><div class="card"><div class="eyebrow">Self-care</div><div class="grid3">${care("mouthwash","Mouthwash")}${care("brush","Brush teeth")}${care("shower","Shower")}</div></div><div class="card"><div class="section-title"><h2>Food</h2><button class="btn primary" onclick="openFood()">+ Add</button></div><div class="grid3"><div class="metric"><div class="eyebrow">Calories</div><div class="big">${Math.round(f.cal)}</div></div><div class="metric"><div class="eyebrow">Protein</div><div class="big">${Math.round(f.protein)}g</div></div><div class="metric"><div class="eyebrow">Monsters</div><div class="big">${f.monsters}</div><button class="btn" onclick="monster()">+1</button></div></div>${food().slice().reverse().slice(0,8).map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${Math.round(x.calories||0)} cal</b></div>`).join("")}</div><div class="grid2"><div class="card"><div class="section-title"><h2>Work</h2><button class="btn" onclick="openWork()">Edit</button></div><div class="muted">${w?.start&&w?.end?`${w.start}–${w.end}`:(w?.scheduled?`Scheduled ${w.scheduled}`:"No shift")}</div></div><div class="card"><div class="section-title"><h2>Tire</h2><button class="btn" onclick="openTire()">Log</button></div><div class="big">${tr?tr.psi+" PSI":"—"}</div></div></div><div class="card"><div class="section-title"><h2>Outfit</h2><button class="btn" onclick="openOutfit()">Log / edit</button></div>${state.outfits.find(x=>x.date===ymd())?.photo?`<img class="photo" src="${state.outfits.find(x=>x.date===ymd()).photo}">`:`<div class="muted">No outfit photo logged today.</div>`}</div>`}
function care(key,label){const on=state.selfCare.some(x=>x.date===ymd()&&x.key===key&&x.done);return`<button class="btn ${on?"good":""}" onclick="toggleCare('${key}')">${on?"✓ ":""}${label}</button>`}
function familyView(){
  const ticketRows=monthlyReaderTickets();
  return `<div class="card glow"><div class="eyebrow">Reading</div><h2>Everyone reads</h2><div class="muted">5+ pages = 1 ticket · 20+ = 2 · 40+ = 3 per day.</div></div>
  <div class="grid2">${(state.settings.readers||[]).map(n=>{const p=reads().filter(x=>x.reader===n).reduce((s,x)=>s+Number(x.pages||0),0),t=p>=40?3:p>=20?2:p>=5?1:0;return`<div class="card"><h2>${esc(n)}</h2><div class="big">${p} pages</div><div class="muted small">${t} tickets today</div><button class="btn primary" onclick="openReading('${esc(n)}')">Log pages</button></div>`}).join("")}</div>
  <div class="card"><div class="section-title"><h2>Reader Wheel · this month</h2><button class="btn primary" onclick="spinReaderWheel()">Spin</button></div>${ticketRows.map(r=>`<div class="row"><span>${esc(r.reader)} · ${r.days} reading days</span><b>${r.tickets} tickets</b></div>`).join("")}</div>
  <div class="card"><div class="section-title"><h2>Kids + chores</h2><button class="btn" onclick="openChore()">+ Add</button></div>${state.chores.filter(x=>x.date===ymd()).map(x=>`<div class="row"><label class="task"><input type="checkbox" ${x.done?"checked":""} onchange="toggleChore('${x.id}',this.checked)"><span class="${x.done?"done":""}"><b>${esc(x.child)}</b> · ${esc(x.chore)}</span></label></div>`).join("")||`<div class="notice">No chores today yet.</div>`}</div>`;
}
function week(){const b=new Date(),wd=b.getDay(),diff=wd===0?-6:1-wd,m=new Date(b);m.setDate(b.getDate()+diff);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return ymd(d)})}

const BUDGET_CATEGORIES=[
  {id:"transport",name:"Transportation/Gas"},
  {id:"dining",name:"Dining/Convenience"},
  {id:"household",name:"Household/Shopping"},
  {id:"personal",name:"Personal/Health"},
  {id:"grocery",name:"Cash Grocery Overflow"},
  {id:"fun",name:"Entertainment/Fun"},
  {id:"cushion",name:"Cushion"}
];
let budgetMonth=localStorage.getItem("dailyLifeBudgetMonth")||ymd().slice(0,7);
const budgetCents=value=>Number.isFinite(Number(value))?Math.round(Math.max(0,Number(value))*100):0;
const budgetMoney=cents=>money(cents/100);
function budgetPlan(month=budgetMonth){
  const saved=state.budget.months[month]||{};
  return {...saved,income:saved.income??null,ebt:saved.ebt??null,ebtStart:saved.ebtStart??null,limits:{...(saved.limits||{})}};
}
function budgetTotals(month=budgetMonth){
  const plan=budgetPlan(month),bills=state.bills.filter(b=>String(b.due||"").slice(0,7)===month);
  const logs=state.budget.spending.filter(x=>String(x.date||"").slice(0,7)===month);
  const billTotal=bills.reduce((sum,b)=>sum+budgetCents(b.amount),0);
  const income=budgetCents(plan.income),ebt=budgetCents(plan.ebt),ebtStart=budgetCents(plan.ebtStart);
  const assigned=BUDGET_CATEGORIES.reduce((sum,c)=>sum+budgetCents(plan.limits[c.id]),0);
  const spent=logs.filter(x=>x.category!=="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const ebtSpent=logs.filter(x=>x.category==="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const [year,mo]=month.split("-").map(Number),days=new Date(year,mo,0).getDate(),today=ymd();
  const daysLeft=month<today.slice(0,7)?0:month===today.slice(0,7)?days-Number(today.slice(8))+1:days;
  const flexible=income-billTotal,remaining=flexible-spent;
  const ebtAvailable=ebtStart+ebt-ebtSpent;
  return {plan,bills,logs,billTotal,income,ebt,ebtStart,ebtAvailable,assigned,spent,ebtSpent,flexible,remaining,
    left:income-billTotal-assigned,daysLeft,weekly:daysLeft?Math.max(0,remaining)*7/daysLeft:0};
}
function budgetProgress(spent,limit,label){
  const percent=limit>0?Math.min(100,Math.round(spent*100/limit)):spent>0?100:0;
  return `<progress class="budget-progress ${spent>limit?"over":""}" max="100" value="${percent}" aria-label="${esc(label)}" aria-valuetext="${esc(budgetMoney(spent))} spent of ${esc(budgetMoney(limit))}">${percent}%</progress>`;
}

function changeBudgetMonth(offset){
  const d=new Date(budgetMonth+"-01T12:00:00");d.setMonth(d.getMonth()+offset);budgetMonth=ymd(d).slice(0,7);localStorage.setItem("dailyLifeBudgetMonth",budgetMonth);render();

function budgetAmountInput(id,label,value){return `<label>${label}<input id="${id}" type="number" inputmode="decimal" min="0" max="999999999" step="0.01" placeholder="0.00" value="${value===null||value===undefined?"":esc(value)}"></label>`}
function readBudgetAmount(id){
  const input=$("#"+id),value=input.value.trim();
  if(!input.checkValidity()||!Number.isFinite(Number(value))||Number(value)<0){input.reportValidity();throw new Error("Invalid amount")}
  return value===""?null:budgetCents(value)/100;
}
async function persistBudgetEdit(before){
  try{await save();closeModal();render();return true}
  catch(error){state.budget=before;alert("Could not save budget changes on this device. Please try again.");return false}
}
function openBudgetIncome(){

    let income,ebtStart,ebt;try{income=readBudgetAmount("budgetIncome");ebtStart=readBudgetAmount("budgetEBTStart");ebt=readBudgetAmount("budgetEBT")}catch{return}

function openBudgetLimit(id){
  const month=budgetMonth,c=BUDGET_CATEGORIES.find(c=>c.id===id);if(!c)return;

async function autoSplitBudget(){
  const t=budgetTotals();if(t.flexible<=0){alert("There is no positive cash income remaining after this month’s bills to split.");return}
  if(!confirm(`Replace all seven limits for ${budgetMonth} with equal shares of ${budgetMoney(t.flexible)}? Existing spending stays unchanged. You can edit each limit afterward.`))return;
  const before=structuredClone(state.budget),p=budgetPlan(),base=Math.floor(t.flexible/BUDGET_CATEGORIES.length),remainder=t.flexible% BUDGET_CATEGORIES.length;
  BUDGET_CATEGORIES.forEach((c,i)=>p.limits[c.id]=(base+(i<remainder?1:0))/100);
  state.budget.months[budgetMonth]=p;await persistBudgetEdit(before);
}
function openBudgetSpending(category="transport",index=-1){
  const existing=index>=0?state.budget.spending[index]:null;if(index>=0&&!existing)return;
  const x=existing||{category:category||"transport",date:budgetMonth===ymd().slice(0,7)?ymd():budgetMonth+"-01",amount:null,note:""};
  modal(existing?"Edit spending":"Log spending",`<div class="stack"><label>Date<input id="budgetDate" type="date" required value="${esc(x.date)}"></label><label>Category / payment source<select id="budgetCategory">${[...BUDGET_CATEGORIES,{id:"ebt",name:"EBT / grocery benefit (not cash)"}].map(c=>`<option value="${c.id}" ${x.category===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>${budgetAmountInput("budgetSpent","Amount",x.amount)}<label>Note (optional)<input id="budgetNote" maxlength="200" value="${esc(x.note||"")}" placeholder="Purchase or store"></label></div><p class="muted small">For mixed EBT/cash grocery payments, log the two amounts separately. Do not log a bill again here.</p>`,"Save spending",async()=>{

async function removeBudgetSpending(index){

function compressImage(file,max=1100,quality=.78){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}

// Readiness is a local balance estimate, never a bank/autopay verification.
const BILL_SETUPS=["Autopay","Scheduled","Manual","Unknown"];
const BILL_AMOUNT_TYPES=["Fixed amount","Full/current bill","Statement balance","Variable/estimate"];
const BILL_FREQUENCIES=["Monthly","Annual","Irregular","One-time","Trial / decision pending"];
function recordedBillSetup(bill){return BILL_SETUPS.includes(bill.paymentSetup)?bill.paymentSetup:"Unknown"}
function recordedBillAmountType(bill){return BILL_AMOUNT_TYPES.includes(bill.amountType)?bill.amountType:"Fixed amount"}
function recordedBillFrequency(bill){return BILL_FREQUENCIES.includes(bill.frequency)?bill.frequency:(billRepeat(bill)===1?"Monthly":billRepeat(bill)===12?"Annual":billRepeat(bill)>0?"Irregular":"One-time")}
function billReadiness(){
  const remaining=new Map();
  // Equal due dates keep their original list order for deterministic reservations.
  return state.bills.map((bill,index)=>({bill,index})).sort((a,b)=>String(a.bill.due||"9999-12-31").localeCompare(String(b.bill.due||"9999-12-31"))||a.index-b.index).map(row=>{
    const b=row.bill,setup=recordedBillSetup(b),matches=state.accounts.filter(a=>a.key&&a.key===b.paymentAccountKey),account=matches.length===1?matches[0]:null;
    const result={...row,setup,account};
    if(b.status==="paid")return {...result,status:"Paid"};
    if(!account)return {...result,status:"Needs account"};
    // Credit balances in this app represent debt, not cash available to pay bills.
    const balance=Number(account.balance);
    if(!["checking","savings"].includes(account.type)||account.balance===null||account.balance===""||!Number.isFinite(balance))return {...result,status:"Balance unavailable"};
    const amount=Number(b.amount);
    if(b.amount===null||b.amount===""||!Number.isFinite(amount)||amount<0||!/^\d{4}-\d{2}-\d{2}$/.test(String(b.due||""))){remaining.set(account.key,null);return {...result,status:"Check bill"}}
    const before=remaining.has(account.key)?remaining.get(account.key):Math.round(balance*100);
    if(before===null)return {...result,status:"Check earlier bill"};
    const after=before-Math.round(amount*100);remaining.set(account.key,after);
    return {...result,before,after,status:after<0?"Short":setup==="Unknown"?"Setup unknown":"Covered"};
  });
}
// Each occurrence remains a separate bill; paid history is never recycled.
const BILL_REPEATS=[[0,"Does not repeat"],[1,"Monthly"],[3,"Every 3 months"],[12,"Yearly"]];
function billRepeat(b){return BILL_REPEATS.some(([n])=>n===Number(b.repeatMonths))?Number(b.repeatMonths):0}
function validBillDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value||"")))return false;
  const d=new Date(value+"T12:00:00");return !isNaN(d)&&ymd(d)===value;
}
function nextBillDate(b){
  if(!validBillDate(b.due))return "";
  const [year,month,day]=b.due.split("-").map(Number),anchor=Number(b.repeatDay)||day;
  const d=new Date(year,month-1+(billRepeat(b)||1),1,12);
  d.setDate(Math.min(anchor,new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate()));
  return ymd(d);
}
function nextBillIndex(b){
  const linked=state.bills.findIndex(x=>x.previousBillId===b.id&&b.id);
  if(linked>=0)return linked;
  const due=nextBillDate(b),name=String(b.name||"").trim().toLowerCase();
  return due?state.bills.findIndex(x=>x!==b&&x.due===due&&String(x.name||"").trim().toLowerCase()===name):-1;
}
function nextBillDraft(b){return {name:b.name,amount:b.amount,due:nextBillDate(b),paymentAccountKey:b.paymentAccountKey||"",desiredAccountKey:b.desiredAccountKey||"",paymentSetup:recordedBillSetup(b),amountType:recordedBillAmountType(b),frequency:recordedBillFrequency(b),repeatMonths:billRepeat(b),repeatDay:Number(b.repeatDay)||Number(String(b.due).slice(8,10)),previousBillId:b.id}}
function appendNextBill(b){
  if(nextBillIndex(b)>=0||!validBillDate(b.due))return;
  state.bills.push({...nextBillDraft(b),id:uid(),status:"upcoming"});
}
function openNextBill(index){
  const b=state.bills[index];if(!b)return;
  const next=nextBillIndex(b);if(next>=0){openBill(next);return}
  openBill(-1,index);
}

function billRowView(r){
  const b=r.bill,paid=b.status==="paid",tone=r.status==="Covered"?"covered":r.status==="Short"?"short":"unknown";
  const note=r.after!==undefined?`${money(r.before/100)} available before this bill · ${r.after<0?money(-r.after/100)+" short":money(r.after/100)+" left"} after reserving it.`:r.status==="Balance unavailable"?"Readiness needs a recorded checking or savings balance. Credit balances track debt, not available cash.":r.status==="Check bill"||r.status==="Check earlier bill"?"Correct the amount or due date before relying on this account’s readiness.":paid?"Paid · not reserved.":b.paymentAccountKey?"The recorded account is missing or its key is not unique. Edit to choose an account.":"Choose the account that will pay this bill.";
  const repeat=BILL_REPEATS.find(([n])=>n===billRepeat(b))[1],desired=state.accounts.find(a=>a.key===b.desiredAccountKey),amountType=recordedBillAmountType(b),frequency=recordedBillFrequency(b);

  <div class="actions">${paid?`<span class="tag">Paid</span>`:`<span class="bill-status ${tone}">${r.status}</span>${r.setup==="Unknown"&&r.status!=="Setup unknown"?`<span class="bill-status unknown">Setup unknown</span>`:""}`}</div><div class="small muted">${note}</div></div></div>

}
function upcomingBillsView(){
  const rows=billReadiness(),unpaid=rows.filter(r=>r.bill.status!=="paid"),paid=rows.filter(r=>r.bill.status==="paid");
  return `<div class="card"><div class="section-title"><h2>Upcoming bills</h2><button class="btn" onclick="openBill()">+ Bill</button></div>

  ${unpaid.map(billRowView).join("")||`<div class="notice">No unpaid bills. Add a bill or create the next occurrence from paid history.</div>`}
  ${paid.length?`<details class="bill-history"><summary>Paid history (${paid.length})</summary><p class="muted small">Paid bills stay here. Use Create next bill to keep a past payment intact. Unchecking a paid bill does not remove its next occurrence.</p>${paid.slice().reverse().map(billRowView).join("")}</details>`:""}</div>`;
}
function openBill(index=-1,sourceIndex=-1){

  const source=sourceIndex>=0?state.bills[sourceIndex]:null;
  const b=existing||(source?nextBillDraft(source):{name:"",amount:null,due:"",paymentAccountKey:"",desiredAccountKey:"",paymentSetup:"Unknown",amountType:"Fixed amount",frequency:"One-time",repeatMonths:0});
  const paid=existing?.status==="paid";
  const accountOptions=state.accounts.filter(a=>a.key),missing=b.paymentAccountKey&&!accountOptions.some(a=>a.key===b.paymentAccountKey),desiredMissing=b.desiredAccountKey&&!accountOptions.some(a=>a.key===b.desiredAccountKey);
  modal(paid?"Edit paid bill":existing?"Edit bill":source?"Create next bill":"Add bill",`
  ${paid?`<p class="notice">You are editing a past payment. To record a future payment without changing this history, close this window and use Create next bill.</p>`:""}
  <div class="stack"><label>Bill name<input id="bn" required maxlength="200" value="${esc(b.name)}"></label><label>Amount<input id="ba" type="number" inputmode="decimal" min="0" max="999999999" step=".01" required value="${esc(b.amount??"")}"></label>
  <div><label for="bd">Due date</label><div class="bill-date-control"><input id="bd" type="date" required value="${esc(b.due)}"><button class="btn" type="button" onclick="pickBillDate()" aria-label="Choose bill due date">Choose date</button></div></div>
  <label>Current payment account<select id="billAccount"><option value="">Unassigned</option>${missing?`<option value="${esc(b.paymentAccountKey)}" selected>Previously assigned account (unavailable)</option>`:""}${accountOptions.map(a=>`<option value="${esc(a.key)}" ${a.key===b.paymentAccountKey?"selected":""}>${esc(a.name)} · ${esc(a.type)}${a.type==="credit"?" (readiness unavailable)":""}</option>`).join("")}</select></label>
  <label>Desired payment account (optional)<select id="billDesiredAccount"><option value="">No change planned</option>${desiredMissing?`<option value="${esc(b.desiredAccountKey)}" selected>Previously desired account (unavailable)</option>`:""}${accountOptions.map(a=>`<option value="${esc(a.key)}" ${a.key===b.desiredAccountKey?"selected":""}>${esc(a.name)} · ${esc(a.type)}</option>`).join("")}</select></label>
  <label>Payment setup<select id="billSetup">${BILL_SETUPS.map(setup=>`<option ${recordedBillSetup(b)===setup?"selected":""}>${setup}</option>`).join("")}</select></label>
  <label>Amount type<select id="billAmountType">${BILL_AMOUNT_TYPES.map(type=>`<option ${recordedBillAmountType(b)===type?"selected":""}>${type}</option>`).join("")}</select></label>
  <label>Bill frequency / status<select id="billFrequency">${BILL_FREQUENCIES.map(type=>`<option ${recordedBillFrequency(b)===type?"selected":""}>${type}</option>`).join("")}</select></label>
  ${paid?`<input id="billRepeat" type="hidden" value="${billRepeat(b)}">`:`<label for="billRepeat">Repeat</label><select id="billRepeat">${BILL_REPEATS.map(([n,label])=>`<option value="${n}" ${billRepeat(b)===n?"selected":""}>${label}</option>`).join("")}</select><p class="muted small">When marked paid, a repeating bill creates one unpaid next occurrence with the same amount, account and setup. Short months use their last day, then return to the original day. Review variable bill amounts each cycle. Edits apply only to this occurrence and the next one it has not yet created.</p>`}</div>
  <p class="muted small">Accounts come from Money. Setup is your record only; this app does not schedule payments or verify autopay.</p>`,existing?"Save changes":"Add bill",async()=>{
    for(const id of ["bn","ba","bd"]){if(!$("#"+id).checkValidity()){$("#"+id).reportValidity();return}}

    if(!name||!validBillDate(due)||!Number.isFinite(amount)||amount<0||!BILL_SETUPS.includes(paymentSetup)||!BILL_AMOUNT_TYPES.includes(amountType)||!BILL_FREQUENCIES.includes(frequency)||!BILL_REPEATS.some(([n])=>n===repeatMonths))return;

async function toggleBill(id,paid){

  const before=structuredClone(state.bills);x.status=paid?"paid":"upcoming";

  try{await save();render()}catch(error){state.bills=before;render();alert("Could not save this payment on this device. Please try again.")}
}

async function removeRoutine(i){if(confirm("Remove this recurring task?")){state.settings.recurringTasks.splice(i,1);await save();render()}}
function openMealPattern(){
  modal("Add weekly meal pattern",`<div class="stack"><label>Weekday<select id="mpd"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Dinner / rule<input id="mpn"></label><label>Method<input id="mpm" placeholder="crock-pot, pickup, away…"></label><label>Notes<input id="mpnotes"></label></div>`,"Add pattern",async()=>{const dish=$("#mpn").value.trim();if(!dish)return;state.settings.mealPatterns.push({weekday:Number($("#mpd").value),dish,method:$("#mpm").value,notes:$("#mpnotes").value});ensureMealPatterns();await save();closeModal();render()})
}
async function removeMealPattern(i){if(confirm("Remove this weekly meal pattern?")){state.settings.mealPatterns.splice(i,1);await save();render()}}
async function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Daily_Life_Backup_${ymd()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){try{const j=JSON.parse(await file.text());if(!j.version||!j.profile)throw new Error();state=migrateState(j);await save();render();alert("Daily Life backup restored.")}catch(e){alert("That file is not a valid Daily Life backup.")}}
async function erase(){if(confirm("Erase ALL Daily Life data stored on this device?")){await dbClear();state=blankState();render()}}
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;render()}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;render()});window.addEventListener("appinstalled",()=>{installPrompt=null;render()});
document.addEventListener("change",e=>{if(e.target?.id==="restoreFile"&&e.target.files[0])restore(e.target.files[0])});
async function init(){state=migrateState(await dbGet("state")||blankState());ensureMealPatterns();await cloudInit();await cloudFinanceInit();await save();render();if(!needsSetup())getWeather();}
init();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
</html>
