const DB_NAME="daily-life-local-v2";
const DB_VERSION=1;
const STORE="kv";
let __db;
function openDB(){
  if(__db) return Promise.resolve(__db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
    req.onsuccess=()=>{__db=req.result;resolve(__db)};
    req.onerror=()=>reject(req.error);
  });
}
async function dbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbSet(key,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbClear(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}

function ensureFamilyDay(date=ymd()){

function itineraryStatusForDate(date,items){
  if(date!==ymd())return null;
  const now=new Date(),hm=now.getHours()*60+now.getMinutes();
  const timed=items.filter(x=>hmMinutes(x.start)!==null);
  const active=timed.find(x=>{const s=hmMinutes(x.start),e=hmMinutes(x.end);return e!==null&&s<=hm&&e>hm});
  const next=timed.find(x=>hmMinutes(x.start)>=hm);
  return active?{title:"Right now · "+active.title,detail:active.end?"Until "+fmtClock(active.end):(active.detail||"")}:
    next?{title:"Next · "+fmtClock(next.start)+" · "+next.title,detail:next.detail||""}:{title:"The timed day is clear",detail:"Use the open time however you need."};
}

function monthlyReaderTickets(){
  const prefix=ymd().slice(0,7), readers=state.settings.readers||[];
  return readers.map(reader=>{
    const daily={};
    for(const r of state.readingLogs.filter(x=>x.reader===reader&&x.date.startsWith(prefix)))daily[r.date]=(daily[r.date]||0)+Number(r.pages||0);
    let tickets=0,pages=0,days=0;
    for(const p of Object.values(daily)){pages+=p;days++;tickets+=p>=40?3:p>=20?2:p>=5?1:0}
    return {reader,tickets,pages,days};
  });
}
function spinReaderWheel(){
  const pool=[];
  for(const r of monthlyReaderTickets())for(let i=0;i<r.tickets;i++)pool.push(r.reader);
  if(!pool.length){alert("No Reader Wheel tickets earned yet this month.");return}
  const winner=pool[Math.floor(Math.random()*pool.length)];
  alert(`Reader Wheel winner: ${winner}!`);
}

function sleepForDate(date=ymd()){return (state.sleepLogs||[]).find(x=>x.date===date)||null}
function sleepHours(log){
  if(!log?.bedtime||!log?.wakeTime)return 0;const [bh,bm]=log.bedtime.split(":").map(Number),[wh,wm]=log.wakeTime.split(":").map(Number);let mins=wh*60+(wm||0)-(bh*60+(bm||0));if(mins<0)mins+=1440;return mins/60;
}

function daysSinceDate(date){
  if(!date)return null;
  const d=new Date(date+"T12:00:00");if(Number.isNaN(d.getTime()))return null;
  return Math.max(0,Math.floor((new Date(ymd()+"T12:00:00")-d)/86400000));
}

function petRoutineById(id){return (state.petCareRoutines||[]).find(x=>x.id===id)}
function petRoutineDueState(r){
  if(r.active===false)return{due:false,label:"Paused",days:null};
  const linkedPet=r.petId?petById(r.petId):null;if(linkedPet?.status==="Archived")return{due:false,label:"Pet archived",days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};
  if(days===0)return{due:true,label:"Due today",days};
  return{due:false,label:"Due "+dl(date),days};
}
function duePetRoutines(){return (state.petCareRoutines||[]).filter(r=>petRoutineDueState(r).due).sort((a,b)=>String(a.nextDate||"").localeCompare(String(b.nextDate||"")))}
function petRoutinesCard(){
  const rows=[...(state.petCareRoutines||[])].filter(r=>r.active!==false&&(!r.petId||petById(r.petId)?.status!=="Archived")).sort((a,b)=>String(a.nextDate||"9999").localeCompare(String(b.nextDate||"9999")));
  let body="";
  for(const r of rows){
    const p=petById(r.petId),s=petRoutineDueState(r);
    body+=`<div class="pet-routine-row ${s.due?"is-due":""}"><button class="grow routine-edit" onclick="openPetRoutine('${r.id}')"><b>${esc(r.title)}</b><small>${p?esc(p.name)+" · ":"Shared care · "}${esc(s.label)}${r.everyDays?" · every "+r.everyDays+"d":""}</small></button><button class="btn small ${s.due?"primary":""}" onclick="completePetRoutine('${r.id}')">Done</button></div>`;
  }
  return `<div class="card pet-routines-card"><div class="section-title"><div><div class="eyebrow">Recurring care</div><h2>${duePetRoutines().length?duePetRoutines().length+" due":"Care routines"}</h2><div class="muted small">Tracks repeating care inside Daily Life only. No notifications are created.</div></div><button class="btn" onclick="openPetRoutine()">+ Routine</button></div>${body||"<div class='notice'>No recurring pet-care routines yet.</div>"}</div>`;
}
function openPetRoutine(id=""){
  const r=petRoutineById(id)||{id:"",petId:"",title:"",type:"Grooming",everyDays:30,nextDate:ymd(),lastDone:"",notes:"",active:true};

function gardenSeasonInfo(){
  const m=new Date().getMonth()+1;
  if([12,1,2].includes(m))return{season:"Winter planning",focus:"Review last season, order seeds, plan beds, and watch indoor plants."};
  if([3,4].includes(m))return{season:"Early spring",focus:"Seed starting, bed prep, pruning, and checking soil conditions are common priorities."};
  if(m===5)return{season:"Spring planting",focus:"Transplants, direct sowing, containers, and frost-sensitive planting move to the front."};
  if([6,7,8].includes(m))return{season:"Growing season",focus:"Watering, weeds, pests, succession planting, and harvest tracking matter most."};
  if([9,10].includes(m))return{season:"Fall garden",focus:"Harvest, seed saving, cleanup, perennials, bulbs, and frost preparation are useful focuses."};
  return{season:"Late fall",focus:"Finish cleanup, protect tender plants, store supplies, and capture notes for next year."};

function plantRoutineById(id){return (state.plantCareRoutines||[]).find(x=>x.id===id)}
function plantRoutineDueState(r){
  if(r.active===false)return{due:false,label:"Paused",days:null};
  const linkedPlant=r.plantId?plantById(r.plantId):null;if(["Finished","Dormant"].includes(linkedPlant?.status))return{due:false,label:linkedPlant.status,days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};
  if(days===0)return{due:true,label:"Due today",days};
  return{due:false,label:"Due "+dl(date),days};
}
function duePlantRoutines(){return (state.plantCareRoutines||[]).filter(r=>plantRoutineDueState(r).due).sort((a,b)=>String(a.nextDate||"").localeCompare(String(b.nextDate||"")))}

function ensurePeopleProfiles(){
  if(!Array.isArray(state.peopleProfiles))state.peopleProfiles=[];
  const names=[...(state.settings.familyMembers||[]).map(x=>String(x?.name||x||"").trim()).filter(Boolean)];
  for(const name of names){
    if(!state.peopleProfiles.some(p=>String(p.name||"").toLowerCase()===name.toLowerCase())){
      state.peopleProfiles.push({id:uid(),name,relationship:"child",birthday:"",livesWithUser:true,profileScope:"household",familyLinks:[],favoriteColors:[],favoriteCharacters:[],interests:[],favoriteFoods:[],sizes:{},wishlist:[],personNotes:[],sharedPlans:[],importantDates:[],birthdayPlan:{tasks:[]}});
    }
  }
  for(const p of state.peopleProfiles){
    if(!p.id)p.id=uid();
    if(!Array.isArray(p.personNotes))p.personNotes=[];
    if(!Array.isArray(p.familyLinks))p.familyLinks=[];
    if(!Array.isArray(p.sharedPlans))p.sharedPlans=[];
    if(!Array.isArray(p.importantDates))p.importantDates=[];
    if(!Array.isArray(p.wishlist))p.wishlist=[];
    if(!p.sizes||typeof p.sizes!=="object")p.sizes={};
  }
}
function personById(id){return (state.peopleProfiles||[]).find(p=>p.id===id)}
function normalizedRelationship(p){return String(p?.relationship||"person").trim().toLowerCase()}
function isChildProfile(p){return ["child","son","daughter"].includes(normalizedRelationship(p))}
function isSiblingProfile(p){return ["sister","brother","sibling"].includes(normalizedRelationship(p))}
function isAdultFamilyProfile(p){
  const r=normalizedRelationship(p);
  return ["sister","brother","sibling","mother","father","mom","dad","parent","aunt","uncle","cousin","grandparent","grandmother","grandfather","niece","nephew","family"].includes(r)
    ||/(sister|brother|sibling|mother|father|parent|aunt|uncle|cousin|grand|niece|nephew|in-law)/.test(r);
}
function livesWithUser(p){return p?.livesWithUser===true||p?.profileScope==="household"}
function relationshipGroup(p){
  if(isChildProfile(p)&&livesWithUser(p))return"Children";
  if(isPartnerProfile(p))return"Partner";
  if(isAdultFamilyProfile(p)||isChildProfile(p))return"Family";
  if(["friend","best friend"].includes(normalizedRelationship(p)))return"Friends";
  return"Other people";
}
function relationshipLabel(p){
  const r=String(p?.relationship||"Person").trim();
  return r?r.charAt(0).toUpperCase()+r.slice(1):"Person";
}
function isPartnerProfile(p){return ["partner","boyfriend","girlfriend","spouse"].includes(String(p?.relationship||"").toLowerCase())}
function nextWeekdayDate(weekday,from=new Date()){
  const d=new Date(from.getFullYear(),from.getMonth(),from.getDate()),diff=(Number(weekday)-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return d;
}
function ensureRelationshipCheckinEvents(){
  ensurePeopleProfiles();

  for(const p of state.peopleProfiles||[]){
    const c=p.recurringCheckin||{};if(!isPartnerProfile(p)||!c.enabled||!Number.isInteger(Number(c.weekday))||!c.startTime)continue;

function familyConnectionClusters(){
  const profiles=state.peopleProfiles||[],byName=new Map(profiles.map(p=>[String(p.name||"").trim().toLowerCase(),p])),
        visited=new Set(),clusters=[];
  for(const p of profiles){
    if(visited.has(p.id)||!(p.familyLinks||[]).length)continue;
    const stack=[p],members=[];
    while(stack.length){
      const cur=stack.pop();if(!cur||visited.has(cur.id))continue;
      visited.add(cur.id);members.push(cur);
      for(const link of cur.familyLinks||[]){
        const match=byName.get(String(link.name||"").trim().toLowerCase());
        if(match&&!visited.has(match.id))stack.push(match);
      }
    }
    if(members.length>1)clusters.push(members);
  }
  return clusters.sort((a,b)=>b.length-a.length||String(a[0]?.name||"").localeCompare(String(b[0]?.name||"")));
}
function familyConnectionsCard(){
  const clusters=familyConnectionClusters();
  if(!clusters.length)return"";
  return `<div class="card family-connections-card"><div class="section-title"><div><div class="eyebrow">Family connections</div><h2>${clusters.length} linked family group${clusters.length===1?"":"s"}</h2><div class="muted small">These connections come from private People profiles, not household membership.</div></div></div>
    <div class="family-cluster-grid">${clusters.map(group=>`<div class="family-cluster">${group.map(p=>`<button onclick="openPersonHub('${p.id}')"><span class="person-avatar mini">${esc((p.name||"?").trim().charAt(0).toUpperCase()||"?")}</span><span><b>${esc(p.name)}</b><small>${esc(relationshipLabel(p))}</small></span></button>`).join("")}</div>`).join("")}</div>
  </div>`;
}
function peopleAgendaItems(){

  for(const e of state.events||[]){
    if(!e.date||e.date<ymd()||e.status==="cancelled")continue;
    const p=profileByName.get(String(e.child||"").trim().toLowerCase());if(!p)continue;
    rows.push({kind:"event",person:p,date:e.date,title:e.title||"Event",time:e.startTime||"",location:e.location||"",id:e.id});

}

const BUDGET_CATEGORIES=[
  {id:"transport",name:"Transportation/Gas"},
  {id:"dining",name:"Dining/Convenience"},
  {id:"household",name:"Household/Shopping"},
  {id:"personal",name:"Personal/Health"},
  {id:"grocery",name:"Cash Grocery Overflow"},
  {id:"fun",name:"Entertainment/Fun"},
  {id:"cushion",name:"Cushion"}
];
let budgetMonth=localStorage.getItem("dailyLifeBudgetMonth")||ymd().slice(0,7);
const budgetCents=value=>Number.isFinite(Number(value))?Math.round(Math.max(0,Number(value))*100):0;
const budgetMoney=cents=>money(cents/100);
function budgetPlan(month=budgetMonth){
  const saved=state.budget.months[month]||{};
  return {...saved,income:saved.income??null,ebt:saved.ebt??null,ebtStart:saved.ebtStart??null,limits:{...(saved.limits||{})}};
}
function budgetTotals(month=budgetMonth){
  const plan=budgetPlan(month),bills=state.bills.filter(b=>String(b.due||"").slice(0,7)===month);
  const logs=state.budget.spending.filter(x=>String(x.date||"").slice(0,7)===month);
  const billTotal=bills.reduce((sum,b)=>sum+budgetCents(b.amount),0);
  const income=budgetCents(plan.income),ebt=budgetCents(plan.ebt),ebtStart=budgetCents(plan.ebtStart);
  const assigned=BUDGET_CATEGORIES.reduce((sum,c)=>sum+budgetCents(plan.limits[c.id]),0);
  const spent=logs.filter(x=>x.category!=="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const ebtSpent=logs.filter(x=>x.category==="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const [year,mo]=month.split("-").map(Number),days=new Date(year,mo,0).getDate(),today=ymd();
  const daysLeft=month<today.slice(0,7)?0:month===today.slice(0,7)?days-Number(today.slice(8))+1:days;
  const flexible=income-billTotal,remaining=flexible-spent;
  const ebtAvailable=ebtStart+ebt-ebtSpent;
  return {plan,bills,logs,billTotal,income,ebt,ebtStart,ebtAvailable,assigned,spent,ebtSpent,flexible,remaining,
    left:income-billTotal-assigned,daysLeft,weekly:daysLeft?Math.max(0,remaining)*7/daysLeft:0};
}
function budgetProgress(spent,limit,label){
  const percent=limit>0?Math.min(100,Math.round(spent*100/limit)):spent>0?100:0;
  return `<progress class="budget-progress ${spent>limit?"over":""}" max="100" value="${percent}" aria-label="${esc(label)}" aria-valuetext="${esc(budgetMoney(spent))} spent of ${esc(budgetMoney(limit))}">${percent}%</progress>`;
}

    return `<div class="card"><div class="section-title"><h3>${c.name}</h3><button class="btn small" aria-label="Edit ${c.name} limit" onclick="openBudgetLimit('${c.id}')">Edit limit</button></div>

function changeBudgetMonth(offset){
  const d=new Date(budgetMonth+"-01T12:00:00");d.setMonth(d.getMonth()+offset);budgetMonth=ymd(d).slice(0,7);localStorage.setItem("dailyLifeBudgetMonth",budgetMonth);render();
}
function budgetAmountInput(id,label,value){return `<label>${label}<input id="${id}" type="number" inputmode="decimal" min="0" max="999999999" step="0.01" placeholder="0.00" value="${value===null||value===undefined?"":esc(value)}"></label>`}
function readBudgetAmount(id){
  const input=$("#"+id),value=input.value.trim();
  if(!input.checkValidity()||!Number.isFinite(Number(value))||Number(value)<0){input.reportValidity();throw new Error("Invalid amount")}
  return value===""?null:budgetCents(value)/100;
}
async function persistBudgetEdit(before){
  try{await save();closeModal();render();return true}
  catch(error){state.budget=before;alert("Could not save budget changes on this device. Please try again.");return false}
}
function openBudgetIncome(){
  const month=budgetMonth,p=budgetPlan(month);
  modal("Monthly income & benefits",`<p class="muted small">${month} · Enter expected take-home cash income. Keep grocery benefits separate.</p><div class="stack">${budgetAmountInput("budgetIncome","Expected monthly cash income",p.income)}${budgetAmountInput("budgetEBTStart","Starting EBT balance / carryover",p.ebtStart)}${budgetAmountInput("budgetEBT","Monthly EBT / grocery benefit",p.ebt)}</div>`,"Save",async()=>{
    let income,ebtStart,ebt;try{income=readBudgetAmount("budgetIncome");ebtStart=readBudgetAmount("budgetEBTStart");ebt=readBudgetAmount("budgetEBT")}catch{return}
    const before=structuredClone(state.budget);state.budget.months[month]={...budgetPlan(month),income,ebtStart,ebt};await persistBudgetEdit(before);
  });
}
function openBudgetLimit(id){
  const month=budgetMonth,c=BUDGET_CATEGORIES.find(c=>c.id===id);if(!c)return;
  modal(c.name,`<p class="muted small">Monthly limit · ${month}</p>${budgetAmountInput("budgetLimit","Cash limit",budgetPlan(month).limits[id])}`,"Save",async()=>{
    let value;try{value=readBudgetAmount("budgetLimit")}catch{return}
    const before=structuredClone(state.budget),p=budgetPlan(month);p.limits[id]=value??0;state.budget.months[month]=p;await persistBudgetEdit(before);
  });
}
async function autoSplitBudget(){
  const t=budgetTotals();if(t.flexible<=0){alert("There is no positive cash income remaining after this month’s bills to split.");return}
  if(!confirm(`Replace all seven limits for ${budgetMonth} with equal shares of ${budgetMoney(t.flexible)}? Existing spending stays unchanged. You can edit each limit afterward.`))return;
  const before=structuredClone(state.budget),p=budgetPlan(),base=Math.floor(t.flexible/BUDGET_CATEGORIES.length),remainder=t.flexible% BUDGET_CATEGORIES.length;
  BUDGET_CATEGORIES.forEach((c,i)=>p.limits[c.id]=(base+(i<remainder?1:0))/100);
  state.budget.months[budgetMonth]=p;await persistBudgetEdit(before);
}
function openBudgetSpending(category="transport",index=-1){
  const existing=index>=0?state.budget.spending[index]:null;if(index>=0&&!existing)return;
  const x=existing||{category:category||"transport",date:budgetMonth===ymd().slice(0,7)?ymd():budgetMonth+"-01",amount:null,note:""};
  modal(existing?"Edit spending":"Log spending",`<div class="stack"><label>Date<input id="budgetDate" type="date" required value="${esc(x.date)}"></label><label>Category / payment source<select id="budgetCategory">${[...BUDGET_CATEGORIES,{id:"ebt",name:"EBT / grocery benefit (not cash)"}].map(c=>`<option value="${c.id}" ${x.category===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>${budgetAmountInput("budgetSpent","Amount",x.amount)}<label>Note (optional)<input id="budgetNote" maxlength="200" value="${esc(x.note||"")}" placeholder="Purchase or store"></label></div><p class="muted small">For mixed EBT/cash grocery payments, log the two amounts separately. Do not log a bill again here.</p>`,"Save spending",async()=>{
    const date=$("#budgetDate").value;if(!date||!$("#budgetDate").checkValidity()){$("#budgetDate").reportValidity();return}
    let amount;try{amount=readBudgetAmount("budgetSpent")}catch{return}if(!amount){alert("Enter an amount greater than zero.");return}
    const before=structuredClone(state.budget),entry={...existing,id:existing?.id||uid(),date,amount,category:$("#budgetCategory").value,note:$("#budgetNote").value.trim(),userEdited:existing?.source==="bank"?true:existing?.userEdited};
    if(existing)state.budget.spending[index]=entry;else state.budget.spending.push(entry);
    const oldMonth=budgetMonth;budgetMonth=date.slice(0,7);if(!await persistBudgetEdit(before))budgetMonth=oldMonth;
  });
}
async function removeBudgetSpending(index){
  if(!state.budget.spending[index]||!confirm("Remove this spending entry from the local budget?"))return;
  const before=structuredClone(state.budget);state.budget.spending.splice(index,1);await persistBudgetEdit(before);
}

async function requestMealSuggestion(date){
  let m=state.meals.find(x=>x.date===date&&x.type==="dinner");
  if(!m){m={id:uid(),date,type:"dinner",dish:"",status:"planned",recipeState:"suggestion-queued",prepDone:[]};state.meals.push(m)}
  else{m.recipeState="suggestion-queued"}

  if(typeof cloudQueueMealSuggestion==="function"){
    const ok=await cloudQueueMealSuggestion(date);
    if(!ok)m.recipeState="waiting_for_cloud";
    await save();
  }
  render();
}
async function requestWeekSuggestions(){
  const today=ymd(),dates=week(),targets=dates.filter(date=>{
    if(date<today)return false;
    const m=state.meals.find(x=>x.date===date&&x.type==="dinner");
    return !m?.dish&&m?.recipeState!=="suggestion-queued";
  });
  if(!targets.length){await queueMissingMealRecipes();render();return}
  for(const date of targets){
    let m=state.meals.find(x=>x.date===date&&x.type==="dinner");
    if(!m){m={id:uid(),date,type:"dinner",dish:"",status:"planned",recipeState:"suggestion-queued",prepDone:[]};state.meals.push(m)}
    else m.recipeState="suggestion-queued";
    if(typeof cloudQueueMealSuggestion==="function"){
      const ok=await cloudQueueMealSuggestion(date);
      if(!ok)m.recipeState="waiting_for_cloud";
    }
  }
  await save();render();
}

const moneyNum=v=>Number(String(v||"").replace(/[$,]/g,""))||0;
function payrollDate(v){const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`:""}
function rx1(text,re){const m=text.match(re);return m?m[1]:""}
async function importPayrollStatement(file){
  if(!file)return;
  try{
    if(!window.pdfjsLib)throw new Error("PDF reader did not load.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text="";
    for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),content=await page.getTextContent();text+=" "+content.items.map(i=>i.str).join(" ")}
    const payDate=payrollDate(rx1(text,/Pay Date:\s*(\d{1,2}\/\d{1,2}\/\d{4})/i));
    const pm=text.match(/Pay Period:\s*(\d{1,2}\/\d{1,2}\/\d{4})\s*-\s*(\d{1,2}\/\d{1,2}\/\d{4})/i),periodStart=pm?payrollDate(pm[1]):"",periodEnd=pm?payrollDate(pm[2]):"";
    const reg=text.match(/REGULAR\s+([\d.]+)\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i),ot=text.match(/OVERTIME\s+([\d.]+)\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i);
    const earn=text.match(/Earnings\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i);
    const p={id:uid(),source:"Dayforce PDF",periodStart,periodEnd,payDate,regularHours:reg?Number(reg[1]):0,regularRate:reg?Number(reg[2]):moneyNum(rx1(text,/Pay Rate:\s*([\d.]+)/i)),regularPay:reg?moneyNum(reg[3]):0,overtimeHours:ot?Number(ot[1]):0,overtimeRate:ot?Number(ot[2]):0,overtimePay:ot?moneyNum(ot[3]):0,totalHours:earn?Number(earn[1]):moneyNum(rx1(text,/TOTAL HOURS\s+([\d.]+)/i)),grossPay:earn?moneyNum(earn[2]):0,taxes:moneyNum(rx1(text,/Taxes\s+\$?([\d,]+\.\d{2})/i)),deductions:moneyNum(rx1(text,/Deductions\s+\$?([\d,]+\.\d{2})/i)),reimbursements:moneyNum(rx1(text,/Reimbursements\s+\$?([\d,]+\.\d{2})/i)),netPay:moneyNum(rx1(text,/Net Pay\s+\$?([\d,]+\.\d{2})/i)),directDeposits:[...text.matchAll(/Direct Deposit\s+\d+\s+X+\d+\s+\$?([\d,]+\.\d{2})/gi)].map(m=>moneyNum(m[1])),vacationHours:moneyNum(rx1(text,/Vacation Hours Balance:\s*([\d.]+)/i)),pstHours:moneyNum(rx1(text,/PST Bank Hrly Balance:\s*([\d.]+)/i)),optionWeekHours:moneyNum(rx1(text,/Option Week Hours Balance:\s*([\d.]+)/i)),importedAt:new Date().toISOString()};
    if(!p.payDate||!p.netPay)throw new Error("I could not confidently recognize this Dayforce earnings statement.");
    p.fingerprint=[p.periodStart,p.periodEnd,p.payDate,p.netPay.toFixed(2)].join("|");
    if(state.paychecks.some(x=>x.fingerprint===p.fingerprint)){alert("That earnings statement is already in Daily Life.");return}
    state.paychecks.push(p);await save();render();alert(`Imported UPS paycheck: ${p.totalHours.toFixed(2)} hours · ${money(p.netPay)} net.`);
  }catch(error){alert("Could not import that payroll PDF: "+(error?.message||"Unknown error"))}
  finally{document.querySelector("#payrollFile").value=""}
}

function compressImage(file,max=1100,quality=.78){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}

// Readiness is a local balance estimate, never a bank/autopay verification.
const BILL_SETUPS=["Autopay","Scheduled","Manual","Unknown"];
const BILL_AMOUNT_TYPES=["Fixed amount","Full/current bill","Statement balance","Variable/estimate"];
const BILL_FREQUENCIES=["Monthly","Annual","Irregular","One-time","Trial / decision pending"];
function recordedBillSetup(bill){return BILL_SETUPS.includes(bill.paymentSetup)?bill.paymentSetup:"Unknown"}
function recordedBillAmountType(bill){return BILL_AMOUNT_TYPES.includes(bill.amountType)?bill.amountType:"Fixed amount"}
function recordedBillFrequency(bill){return BILL_FREQUENCIES.includes(bill.frequency)?bill.frequency:(billRepeat(bill)===1?"Monthly":billRepeat(bill)===12?"Annual":billRepeat(bill)>0?"Irregular":"One-time")}
const INCOME_FREQUENCIES=["One-time","Weekly","Every 2 weeks","Monthly"];
function addIncomeDate(date,frequency){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||"")))return"";
  const d=new Date(date+"T12:00:00");
  if(frequency==="Weekly")d.setDate(d.getDate()+7);
  else if(frequency==="Every 2 weeks")d.setDate(d.getDate()+14);
  else if(frequency==="Monthly"){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate()));}
  else return"";
  return ymd(d);
}
function expectedIncomeOccurrences(untilDate){
  const today=ymd(),out=[];
  for(const src of state.expectedIncome||[]){
    if(src.enabled===false)continue;
    const amount=Number(src.amount||0),start=String(src.date||"");
    if(!Number.isFinite(amount)||amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(start))continue;
    const frequency=INCOME_FREQUENCIES.includes(src.frequency)?src.frequency:"One-time";
    let date=start,guard=0;
    while(date&&date<=untilDate&&guard++<100){
      if(date>=today)out.push({sourceId:src.id,date,amount,accountKey:String(src.accountKey||""),transferable:src.transferable!==false,name:String(src.name||"Expected income"),confidence:String(src.confidence||"confirmed"),frequency,notes:String(src.notes||"")});
      if(frequency==="One-time")break;

  <label>Bill frequency / status<select id="billFrequency" onchange="syncBillFrequencyRepeat()">${BILL_FREQUENCIES.map(type=>`<option ${recordedBillFrequency(b)===type?"selected":""}>${type}</option>`).join("")}</select></label>
  ${paid?`<input id="billRepeat" type="hidden" value="${billRepeat(b)}">`:`<label for="billRepeat">Repeat</label><select id="billRepeat" onchange="syncBillRepeatFrequency()">${BILL_REPEATS.map(([n,label])=>`<option value="${n}" ${billRepeat(b)===n?"selected":""}>${label}</option>`).join("")}</select><p class="muted small">When marked paid, a repeating bill creates one unpaid next occurrence with the same amount, account and setup. Short months use their last day, then return to the original day. Review variable bill amounts each cycle. Edits apply only to this occurrence and the next one it has not yet created.</p>`}</div>
  <p class="muted small">Accounts come from Money. Setup is your record only; this app does not schedule payments or verify autopay.</p>`,existing?"Save changes":"Add bill",async()=>{
    for(const id of ["bn","ba","bd"]){if(!$("#"+id).checkValidity()){$("#"+id).reportValidity();return}}
    const name=$("#bn").value.trim(),amount=Number($("#ba").value),due=$("#bd").value,paymentAccountKey=$("#billAccount").value,desiredAccountKey=$("#billDesiredAccount").value,paymentSetup=$("#billSetup").value,amountType=$("#billAmountType").value,frequency=$("#billFrequency").value,repeatMonths=Number($("#billRepeat").value);
    if(!name||!validBillDate(due)||!Number.isFinite(amount)||amount<0||!BILL_SETUPS.includes(paymentSetup)||!BILL_AMOUNT_TYPES.includes(amountType)||!BILL_FREQUENCIES.includes(frequency)||!BILL_REPEATS.some(([n])=>n===repeatMonths))return;
    if(paymentAccountKey&&paymentAccountKey!==b.paymentAccountKey&&!state.accounts.some(a=>a.key===paymentAccountKey)){alert("That account is no longer available. Reopen the bill and choose an account.");return}
    if(desiredAccountKey&&desiredAccountKey!==b.desiredAccountKey&&!state.accounts.some(a=>a.key===desiredAccountKey)){alert("That desired account is no longer available. Reopen the bill and choose an account.");return}
    const liveIndex=existing?state.bills.indexOf(existing):-1;if(existing&&liveIndex<0){alert("This bill changed. Close and reopen it before saving.");return}
    if(source&&nextBillIndex(source)>=0){alert("A next bill already exists. Close this window and use View next bill.");return}
    if(!existing&&state.bills.some(x=>x.due===due&&String(x.name||"").trim().toLowerCase()===name.toLowerCase())){alert("A bill with this name and due date already exists. Edit that bill, or use a distinct name for a separate bill.");return}
    const button=$("#saveModal");button.disabled=true;
    const entry={...(existing||{id:uid(),status:"upcoming"}),name,amount:Math.round(amount*100)/100,due,paymentAccountKey,desiredAccountKey,paymentSetup,amountType,frequency,repeatMonths,
      repeatDay:due===b.due&&b.repeatDay?b.repeatDay:Number(due.slice(8,10))};
    if(source)entry.previousBillId=source.id;
    if(existing)state.bills[liveIndex]=entry;else state.bills.push(entry);
    try{await save();closeModal();render()}
    catch(error){if(existing)state.bills[liveIndex]=existing;else state.bills.splice(state.bills.indexOf(entry),1);button.disabled=false;alert("Could not save this bill on this device. Please try again.")}
  });
}
async function toggleBill(id,paid){
  const x=state.bills.find(b=>b.id===id);if(!x)return;
  const before=structuredClone(state.bills);x.status=paid?"paid":"upcoming";
  if(paid&&billRepeat(x))appendNextBill(x);
  try{await save();render()}catch(error){state.bills=before;render();alert("Could not save this payment on this device. Please try again.")}
}
function openPeople(){
  modal("Reading list",`<div class="stack"><label>Names, comma-separated<input id="people" value="${esc((state.settings.readers||[]).join(", "))}"></label></div>`,"Save",async()=>{const names=$("#people").value.split(",").map(x=>x.trim()).filter(Boolean);if(names.length)state.settings.readers=names;await save();closeModal();render()})
}
function openRoutine(){
  modal("Add recurring task",`<div class="stack"><label>Task<input id="rt"></label><label>Category<input id="rc" value="life"></label><label>Days<select id="rd" multiple size="7"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Notes<input id="rn"></label></div>`,"Add",async()=>{const title=$("#rt").value.trim();if(!title)return;const days=[...$("#rd").selectedOptions].map(o=>Number(o.value));state.settings.recurringTasks.push({title,category:$("#rc").value||"life",days:days.length?days:[0,1,2,3,4,5,6],order:100,notes:$("#rn").value});await save();closeModal();render()})
}
async function removeRoutine(i){if(confirm("Remove this recurring task?")){state.settings.recurringTasks.splice(i,1);await save();render()}}
function openMealPattern(){
  modal("Add weekly meal pattern",`<div class="stack"><label>Weekday<select id="mpd"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Dinner / rule<input id="mpn"></label><label>Method<input id="mpm" placeholder="crock-pot, pickup, away…"></label><label>Notes<input id="mpnotes"></label></div>`,"Add pattern",async()=>{const dish=$("#mpn").value.trim();if(!dish)return;state.settings.mealPatterns.push({weekday:Number($("#mpd").value),dish,method:$("#mpm").value,notes:$("#mpnotes").value});ensureMealPatterns();await save();closeModal();render()})
}
async function removeMealPattern(i){if(confirm("Remove this weekly meal pattern?")){state.settings.mealPatterns.splice(i,1);await save();render()}}
async function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Daily_Life_Backup_${ymd()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){try{const j=JSON.parse(await file.text());if(!j.version||!j.profile)throw new Error();state=migrateState(j);await save();render();alert("Daily Life backup restored.")}catch(e){alert("That file is not a valid Daily Life backup.")}}
async function erase(){if(confirm("Erase ALL Daily Life data stored on this device?")){await dbClear();state=blankState();render()}}
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;render()}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;render()});window.addEventListener("appinstalled",()=>{installPrompt=null;render()});
document.addEventListener("change",e=>{if(e.target?.id==="restoreFile"&&e.target.files[0])restore(e.target.files[0]);if(e.target?.id==="payrollFile"&&e.target.files[0])importPayrollStatement(e.target.files[0])});
async function init(){state=migrateState(await dbGet("state")||blankState());ensureMealPatterns();await cloudInit();ensureRecurringFamilyEvents();ensureFamilyDay();await queueMissingMealRecipes();if(typeof cloudPullLifeEntries==="function")await cloudPullLifeEntries(false);ensureRecurringFamilyEvents();ensureFamilyDay();await cloudFinanceInit();await save();render();if(!needsSetup())getWeather();}
init();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=20261001-2225").catch(()=>{});
