<script>

const DB_NAME="daily-life-local-v2";
const DB_VERSION=1;
const STORE="kv";
let __db;
function openDB(){
  if(__db) return Promise.resolve(__db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
    req.onsuccess=()=>{__db=req.result;resolve(__db)};
    req.onerror=()=>reject(req.error);
  });
}
async function dbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbSet(key,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbClear(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}

</script>

  const items=[],today=days[0],next=days.slice(1,4);
  const add=(priority,icon,title,detail,category)=>{if(!items.some(x=>x.title===title))items.push({priority,icon,title,detail,category})};
  const freeze=next.find(d=>d.low<=32);
  if(freeze){
    const when=weatherForecastDayLabel(freeze.date);
    add(100,"❄","Prepare for a freeze "+when,
      "House: protect outdoor faucets/hoses and bring sensitive plants in. Car: put a scraper where you can reach it and check washer fluid. Kids: set out warmer layers the night before.","weather");
  }
  const sharpCold=next.find(d=>today&&Math.max(today.high,today.low)-Math.max(d.high,d.low)>=18);
  if(sharpCold){
    const when=weatherForecastDayLabel(sharpCold.date);
    add(92,"↘","A noticeable temperature drop is coming "+when,
      "Move coats/layers where they are easy to grab and check tire pressure after the colder air arrives; pressure commonly falls as temperature drops.","weather");
  }
  const snow=next.find(d=>[71,73,75,77,85,86].includes(d.code));
  if(snow){
    const when=weatherForecastDayLabel(snow.date);
    add(98,"☃","Snow is in the forecast "+when,
      "Car: make sure the scraper is in the vehicle and leave extra travel time. House: clear a path plan. Kids: stage gloves, hats, and dry shoes.","weather");
  }
  const storm=next.find(d=>[95,96,99].includes(d.code));
  if(storm){
    const when=weatherForecastDayLabel(storm.date);
    add(96,"⚡","Thunderstorms are possible "+when,
      "Charge phones, secure loose outdoor items, and keep indoor plans available for the kids. Recheck the forecast closer to the event for timing.","weather");
  }
  const rain=next.find(d=>d.rain>=65);
  if(rain){
    const when=weatherForecastDayLabel(rain.date);
    add(82,"☂","Plan for rain "+when,
      "Put umbrellas/rain gear by the door, protect anything outside that should stay dry, and allow a little extra drive time.","weather");
  }
  const wind=next.find(d=>d.wind>=30);
  if(wind){
    const when=weatherForecastDayLabel(wind.date);
    add(88,"≋","Windy weather is expected "+when,
      "Secure lightweight outdoor items and trash/recycling. Check that anything loose around the car or porch is put away.","weather");
  }
  const heat=next.find(d=>d.high>=90);
  if(heat){
    const when=weatherForecastDayLabel(heat.date);
    add(84,"☀","Hot weather is coming "+when,
      "Set out water bottles, plan lighter outdoor timing for the kids, and avoid leaving heat-sensitive items in the car.","weather");
  }
  return items.sort((a,b)=>b.priority-a.priority).slice(0,3);
}
function hmMinutes(v){const m=String(v||"").match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}

function inferredWorkStartForDate(date){
  const prefs=state.settings?.itinerary||{},target=new Date(date+"T12:00:00"),targetWd=target.getDay(),
        workDays=Array.isArray(prefs.workWeekdays)?prefs.workWeekdays.map(Number):[2,3,4,5,6];
  if(!workDays.includes(targetWd))return null;
  const cutoff=new Date(target);cutoff.setDate(cutoff.getDate()-42);
  const cutoffDate=ymd(cutoff),prior=(state.workShifts||[]).filter(w=>w.date<date&&w.date>=cutoffDate&&(w.start||w.scheduled));
  const toMinutes=w=>hmMinutes(w.start||w.scheduled),median=vals=>{
    const rows=vals.filter(Number.isFinite).sort((a,b)=>a-b);if(!rows.length)return null;
    const mid=Math.floor(rows.length/2);return rows.length%2?rows[mid]:Math.round((rows[mid-1]+rows[mid])/2);
  };
  const sameWeekday=prior.filter(w=>new Date(w.date+"T12:00:00").getDay()===targetWd).map(toMinutes).filter(Number.isFinite);
  if(sameWeekday.length>=2)return{minutes:median(sameWeekday),samples:sameWeekday.length,source:"same weekday"};

  if(workdayStarts.length>=3)return{minutes:median(workdayStarts),samples:workdayStarts.length,source:"recent workday"};
  return null;
}

function itinerarySleepPlan(date){

const CONFIRMED_WORK_OFF_DATES=new Set(["2026-10-04"]);

function sanitizeWorkScheduleData(target){

    if(isConfirmedWorkOffDate(w.date))return false;

  return `<div class="dayflow-phase-row dayflow-completable ${allDone?"is-done":""}"><span class="dayflow-phase-time"><b>${esc(fmtClock(x.start))}</b><small>${x.end?esc(fmtClock(x.end)):""}</small></span><span class="grow">${title}${steps}${multi&&itineraryTypeLabel(x)?`<small class="dayflow-row-meta">${esc(itineraryTypeLabel(x))}</small>`:""}</span>${dayFlowOpenButton(x,date)}</div>`;
}

function itineraryDayItems(date){
  if(typeof ensureFamilyDay==="function")ensureFamilyDay(date);
  const anchors=itineraryFixedItems(date),
        routinesRaw=itinerarySuggestedBlocks(date),
        routines=itineraryFitRoutines(date,anchors,routinesRaw),
        visibleRoutines=routines.filter(x=>!x.skippedByConflict),
        base=[...anchors,...visibleRoutines],
        tasks=itineraryAutoTaskBlocks(date,base),
        used=[...base,...tasks],
        finishedBlockers=dayFlowFinishedRows().filter(r=>r.date===date&&hmMinutes(r.start)!==null).map(r=>({
          start:r.start,end:r.end||minutesHm((hmMinutes(r.start)||0)+Math.max(15,Number(r.durationMinutes||15))),
          durationMinutes:Math.max(15,Number(r.durationMinutes||15))
        })),
        open=itineraryRestBlocks([...used,...finishedBlockers],date);
  return dayFlowOverlayFinished(date,[...used,...open]).sort((a,b)=>String(a.start).localeCompare(String(b.start))||(a.kind==="gap"?1:-1));
}

function itineraryPlanningDiagnostics(date){
  const anchors=itineraryFixedItems(date),raw=itinerarySuggestedBlocks(date),fitted=itineraryFitRoutines(date,anchors,raw),
        skipped=fitted.filter(x=>x.skippedByConflict),
        moved=fitted.filter(x=>x.movedByPlanner&&!x.skippedByConflict),
        sleepPlan=itinerarySleepPlan(date),cutoff=itineraryDayEnd(date),
        sleepConflicts=state.settings?.itinerary?.protectSleep===false?[]:anchors.filter(x=>{
          const s=hmMinutes(x.start),e=hmMinutes(x.end);return s!==null&&(s>=cutoff||(e!==null&&e>cutoff));
        });
  return{skipped,moved,sleepConflicts,sleepPlan};
}

function itineraryStatusForDate(date,items){
  if(date!==ymd())return null;
  const now=new Date(),hm=now.getHours()*60+now.getMinutes();
  const timed=items.filter(x=>hmMinutes(x.start)!==null);
  const active=timed.find(x=>{const s=hmMinutes(x.start),e=hmMinutes(x.end);return e!==null&&s<=hm&&e>hm});
  const next=timed.find(x=>hmMinutes(x.start)>=hm);
  return active?{title:"Right now · "+active.title,detail:active.end?"Until "+fmtClock(active.end):(active.detail||"")}:
    next?{title:"Next · "+fmtClock(next.start)+" · "+next.title,detail:next.detail||""}:{title:"The timed day is clear",detail:"Use the open time however you need."};
}

  if(x.source==="meal")return `onclick="openMeal('${date}')"`;

function itineraryPhase(item){
  const m=hmMinutes(item.start)||0;
  if(m<360)return["Before sunrise","☾"];
  if(m<720)return["Morning","☀"];
  if(m<930)return["Midday","◷"];
  if(m<1110)return["After school / afternoon","✎"];
  return["Evening","⌂"];
}
function itineraryDurationLabel(x){
  const s=hmMinutes(x.start),e=hmMinutes(x.end);if(s===null||e===null||e<=s)return x.endUnknown?"end TBD":"";
  const n=e-s;return n>=60?(n%60?Math.floor(n/60)+"h "+(n%60)+"m":Math.floor(n/60)+"h"):n+"m";
}
function itineraryTypeLabel(x){
  if(x.endUnknown)return"TIME TBD";

function dayFlowBucketForMinutes(m){
  if(m<360)return"before";
  if(m<720)return"morning";
  if(m<900)return"midday";
  if(m<1080)return"afternoon";
  if(m<1170)return"evening";
  return"tonight";
}
const DAY_FLOW_BUCKETS={
  before:{title:"Before Sunrise",icon:"☾"},
  morning:{title:"Morning",icon:"☀"},
  midday:{title:"Midday",icon:"◷"},
  afternoon:{title:"Afternoon",icon:"✎"},
  evening:{title:"Evening",icon:"⌂"},
  tonight:{title:"Tonight",icon:"✦"}
};
function dayFlowSleepBlock(date){
  if(state.settings?.itinerary?.protectSleep===false)return null;
  const log=sleepForDate(date),previous=shiftDateString(date,-1),plan=itinerarySleepPlan(previous),
    wake=hmMinutes(log?.wakeTime||plan?.wake||""),
    bedtime=String(log?.bedtime||plan?.bedtime||"");
  if(wake===null||wake<=0)return null;
  const actual=Number(log?.actualSleepHours||0),
    detail=[bedtime?"Continued from "+fmtClock(bedtime):"",actual>0?"~"+actual.toFixed(actual%1?1:0)+" h actual sleep logged":(plan?.targetHours?plan.targetHours+" h target":"Protected sleep")].filter(Boolean).join(" · ");
  return {id:"sleep:"+date,start:"00:00",end:minutesHm(wake),title:"Sleep",detail,fixed:true,kind:"sleep",icon:"☾",source:"sleep"};
}
function dayFlowBucketItems(date,key){
  const rows=itineraryDayItems(date).filter(x=>{
    if(String(x.templateKey||"")==="wind-down")return key==="tonight";
    const m=hmMinutes(x.start);return m!==null&&dayFlowBucketForMinutes(m)===key;
  });
  if(key==="before"){
    const sleep=dayFlowSleepBlock(date);
    if(sleep)rows.unshift(sleep);
  }
  return rows;
}

function dayFlowConflictAudit(date){
  const anchors=itineraryFixedItems(date).filter(x=>hmMinutes(x.start)!==null),
    overlaps=[],seen=new Set(),diagnostics=itineraryPlanningDiagnostics(date);
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i],as=hmMinutes(a.start),ae=hmMinutes(a.end);
    if(as===null||ae===null||ae<=as)continue;
    for(let j=i+1;j<anchors.length;j++){
      const b=anchors[j],bs=hmMinutes(b.start),be=hmMinutes(b.end);
      if(bs===null||be===null||be<=bs)continue;
      const overlap=Math.min(ae,be)-Math.max(as,bs);
      if(overlap<=0)continue;
      if(a.source==="meal"&&b.source==="meal"&&a.sourceId===b.sourceId)continue;
      const key=[a.id,b.id].sort().join("|");if(seen.has(key))continue;seen.add(key);
      overlaps.push({a,b,minutes:overlap});
    }
  }
  return{
    overlaps,
    skipped:diagnostics.skipped||[],
    sleepConflicts:diagnostics.sleepConflicts||[],
    count:overlaps.length+(diagnostics.skipped||[]).length+(diagnostics.sleepConflicts||[]).length
  };
}
function dayFlowConflictCard(date){
  const audit=dayFlowConflictAudit(date);
  if(!audit.count)return `<div class="notice dayflow-clear"><b>No schedule conflicts detected.</b> Fixed anchors, routines, meals, and sleep currently fit without an obvious collision.</div>`;
  return `<div class="card dayflow-conflict-card"><div class="section-title"><div><div class="eyebrow">Schedule check</div><h2>${audit.count} item${audit.count===1?"":"s"} need attention</h2><div class="muted small">These are possible collisions or routines that could not fit. They are not silently moved through a fixed commitment.</div></div></div>
    ${audit.overlaps.map(({a,b,minutes})=>`<div class="dayflow-conflict-row"><b>Possible overlap · ${minutes} min</b><span>${esc(fmtClock(a.start))} ${esc(a.title)} ↔ ${esc(fmtClock(b.start))} ${esc(b.title)}</span></div>`).join("")}
    ${audit.skipped.map(x=>`<div class="dayflow-conflict-row"><b>Couldn’t fit · ${esc(x.title)}</b><span>Preferred ${esc(fmtClock(x.originalStart||x.start))}${x.originalEnd?"–"+esc(fmtClock(x.originalEnd)):""} · tap it in the agenda to adjust.</span></div>`).join("")}
    ${audit.sleepConflicts.map(x=>`<div class="dayflow-conflict-row"><b>Sleep-window conflict · ${esc(x.title)}</b><span>${esc(fmtClock(x.start))}${x.end?"–"+esc(fmtClock(x.end)):""}</span></div>`).join("")}
  </div>`;
}

function peakSeasonPlanningRows(){
  const x=upsSeasonality(),p=upsEmploymentProfile();if(!x)return[];
  const year=Number(ymd().slice(0,4)),previous=String(year-1),current=String(year),
        lastYear=x.years?.[previous]||{},thisYear=x.years?.[current]||{},
        recent=Number(x.recentWeeklyAverageNet||0),
        latestInside=[...(p?.verifiedRates||[])].filter(v=>v.job==="inside"&&Number(v.rate)>0).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).slice(-1)[0],
        currentRate=Number(p?.currentRate||latestInside?.rate||employmentRateForDate(p,ymd())?.rate||0),
        months=["10","11","12"];
  return months.map(month=>{
    const targetDate=`${year}-${month}-15`,effective=employmentRateForDate(p,targetDate),targetRate=Number(effective?.rate||currentRate||0),
          rateFactor=currentRate>0&&targetRate>0?targetRate/currentRate:1,
          recentMonthly=recent>0?recent*4.345*rateFactor:0,
          prior=Number(lastYear[month]||0),actual=Number(thisYear[month]||0),
          candidates=[prior,recentMonthly].filter(n=>Number.isFinite(n)&&n>0),
          low=candidates.length?Math.min(...candidates):0,high=candidates.length?Math.max(...candidates):0;

  });

function ensureFamilyDay(date=ymd()){
  const settings=state.settings||{},desired=new Map();
  const addDesired=(child,chore,generated)=>{
    const name=String(child||"").trim(),task=String(chore||"").trim();if(!name||!task)return;
    desired.set(name+"|"+task,{child:name,chore:task,generated});
  };
  const family=(settings.familyMembers||[]).map(x=>String(x?.name||x||"").trim()).filter(Boolean),
        basics=(settings.dailyKidBasics||[]).map(String).map(x=>x.trim()).filter(Boolean);
  for(const name of family)for(const basic of basics)addDesired(name,basic,"daily-basics");
  for(const r of settings.choreRotations||[]){
    const members=(r.members||[]).map(String).map(x=>x.trim()).filter(Boolean),
          chores=(r.chores||[]).map(String).map(x=>x.trim()).filter(Boolean);
    if(!members.length||!chores.length)continue;
    const anchor=/^\d{4}-\d{2}-\d{2}$/.test(String(r.anchorDate||""))?String(r.anchorDate):date,
          offset=dateDayIndex(date)-dateDayIndex(anchor);
    for(let i=0;i<members.length;i++){
      const choreIndex=((i+offset)%chores.length+chores.length)%chores.length;
      addDesired(members[i],chores[choreIndex],"rotation");
    }
  }
  const generatedKinds=new Set(["daily-basics","rotation"]),kept=new Map(),next=[];
  for(const row of state.chores||[]){
    if(row.date!==date||!generatedKinds.has(String(row.generated||""))){next.push(row);continue}
    const key=String(row.child||"").trim()+"|"+String(row.chore||"").trim();
    if(!desired.has(key)||kept.has(key))continue;
    const target=desired.get(key);
    row.child=target.child;row.chore=target.chore;row.generated=target.generated;
    kept.set(key,row);next.push(row);
  }
  state.chores=next;
  const existing=new Set((state.chores||[]).filter(x=>x.date===date).map(x=>String(x.child||"").trim()+"|"+String(x.chore||"").trim()));
  for(const [key,target] of desired){
    if(existing.has(key))continue;
    state.chores.push({id:uid(),date,child:target.child,chore:target.chore,done:false,generated:target.generated});
    existing.add(key);
  }
}
function ensureRecurringFamilyEvents(){
  const defs=state.settings?.recurringFamilyEvents||[],today=new Date(),desired=new Map();
  for(const r of defs)if(!r.id)r.id=uid();
  for(let offset=-1;offset<=35;offset++){
    const d=new Date(today);d.setDate(today.getDate()+offset);const date=ymd(d),wd=d.getDay();
    for(const r of defs){
      if(Number(r.weekday)!==wd)continue;
      const title=String(r.title||"").trim();if(!title)continue;
      desired.set(String(r.id)+"|"+date,{rule:r,date});
    }
  }
  const generated=(state.events||[]).filter(e=>e.generated==="recurring"&&e.date>=ymd(new Date(today.getTime()-86400000)));
  const used=new Set();
  for(const [key,item] of desired){
    const {rule:r,date}=item,child=String(r.child||""),startTime=String(r.startTime||"");
    let e=generated.find(x=>!used.has(x.id)&&String(x.recurringRuleId||"")===String(r.id)&&String(x.recurringOccurrenceDate||x.date||"")===date);
    if(!e)e=generated.find(x=>!used.has(x.id)&&!x.recurringRuleId&&x.date===date&&String(x.title||"").toLowerCase()===String(r.title||"").toLowerCase()&&String(x.child||"")===child&&String(x.startTime||"")===startTime);
    const exception=(state.events||[]).find(x=>x.recurringException===true&&String(x.recurringRuleId||"")===String(r.id)&&String(x.recurringOccurrenceDate||"")===date);
    if(exception){used.add(exception.id);continue}
    if(!e){
      e={id:uid(),date};state.events.push(e);
    }
    Object.assign(e,{date,title:String(r.title||"").trim(),child,type:String(r.type||"family"),startTime,endTime:String(r.endTime||""),location:String(r.location||""),status:String(r.status||"confirmed"),source:"Family routine",notes:String(r.notes||""),generated:"recurring",recurringRuleId:r.id,recurringOccurrenceDate:date});
    used.add(e.id);
  }
  state.events=(state.events||[]).filter(e=>{
    if(e.generated!=="recurring")return true;
    if(e.date<ymd(new Date(today.getTime()-86400000)))return true;
    if(used.has(e.id))return true;
    return false;
  });
}

function schoolAssignmentNeedsAction(a,date=ymd()){
  const status=String(a?.status||"due").toLowerCase(),due=String(a?.due||"");

  if(status==="due")return !due||due<=date;

function ensureSchoolAssignmentTasks(date=ymd()){
  if(!Array.isArray(state.tasks))state.tasks=[];
  for(const a of state.schoolAssignments||[]){
    let task=state.tasks.find(t=>String(t.sourceAssignmentId||"")===String(a.id||""));
    const needs=schoolAssignmentNeedsAction(a,date);
    if(needs&&!task){
      task={id:uid(),date,title:a.title||"School assignment",child:a.child||"",category:"school",notes:[a.course,a.due?"Due "+a.due:"",String(a.status||"").toLowerCase()==="missing"?"Missing in school snapshot":""].filter(Boolean).join(" · "),done:false,order:String(a.status||"").toLowerCase()==="missing"?20:45,sourceAssignmentId:a.id,itineraryMinutes:30,itineraryPreference:"after-school"};
      state.tasks.push(task);
    }else if(needs&&task&&!task.done){
      task.title=a.title||task.title;task.child=a.child||task.child;task.category="school";task.notes=[a.course,a.due?"Due "+a.due:"",String(a.status||"").toLowerCase()==="missing"?"Missing in school snapshot":""].filter(Boolean).join(" · ");
      if(task.date<date)task.date=date;
    }else if(!needs&&task&&!task.done){
      task.done=true;task.notes=[task.notes,"School snapshot now: "+String(a.status||"updated")].filter(Boolean).join(" · ");
    }
  }
}

        adminNow=nextLifeAdminAction();

function sleepForDate(date=ymd()){return (state.sleepLogs||[]).find(x=>x.date===date)||null}
function sleepWindowHours(log){
  if(!log?.bedtime||!log?.wakeTime)return 0;
  const [bh,bm]=log.bedtime.split(":").map(Number),[wh,wm]=log.wakeTime.split(":").map(Number);
  let mins=wh*60+(wm||0)-(bh*60+(bm||0));if(mins<0)mins+=1440;
  return mins/60;
}
function sleepHours(log){
  const actual=Number(log?.actualSleepHours);
  return Number.isFinite(actual)&&actual>0?actual:sleepWindowHours(log);
}

function dailyReviewStatus(kind,key,date=ymd()){
  const review=dailyReviewEntry(kind,key,date);
  if(review&&["no","na"].includes(String(review.status||"")))return review.status;
  if(kind==="task"){
    const x=(state.tasks||[]).find(v=>String(v.id)===String(key));
    if(x?.done)return"yes";
  }else if(kind==="chore"){
    const x=(state.chores||[]).find(v=>String(v.id)===String(key));
    if(x?.done)return"yes";

function dailyReviewExpected(date=ymd()){
  const rows=[];

    if(String(t.title||"").trim().toLowerCase()==="ups shift"&&typeof isUsualWorkday==="function"&&!isUsualWorkday(date)&&!(typeof workShiftHasActual==="function"&&workShiftHasActual(workForDate(date))))continue;
    rows.push({kind:"task",key:t.id,label:t.title||"Task",group:"Tasks",detail:[t.child,t.category].filter(Boolean).join(" · "),status:dailyReviewStatus("task",t.id,date)});
  }

    rows.push({kind:"chore",key:c.id,label:c.chore||"Chore",group:"Chores + routines",detail:c.child||"",status:dailyReviewStatus("chore",c.id,date)});
  }

function dailyReviewSummary(date=ymd()){

function dailyReviewBacklog(days=7){

    if(summary.unknown)out.push({date,unknown:summary.unknown,total:summary.total});
  }

}

function selfCarePatternStats(key,days=7){

async function applyDailyReview(kind,key,date,status){
  const item=dailyReviewExpected(date).find(x=>x.kind===kind&&String(x.key)===String(key));
  if(!item)return;
  if(kind==="task"){
    const t=(state.tasks||[]).find(x=>String(x.id)===String(key));
    if(t&&status==="yes")t.done=true;
    else if(t)t.done=false;
    if(t?.sharedEntryId&&status==="yes"&&typeof sharingUpsertTask==="function"){
      const ok=await sharingUpsertTask(t);
      if(!ok){t.done=false;return}
    }
  }else if(kind==="chore"){
    const c=(state.chores||[]).find(x=>String(x.id)===String(key));
    if(c&&status==="yes")c.done=true;
    else if(c)c.done=false;
  }else if(kind==="care"){
    let row=selfCareLogRow(key,date);
    if(status==="yes"){
      if(!row){row={id:uid(),date,key,done:true,count:1,times:[],source:"daily-review"};state.selfCare.push(row)}
      else{row.done=true;row.count=Math.max(1,Number(row.count||0));if(!Array.isArray(row.times))row.times=[]}
    }else if(row){

function homeTaskAge(task){

function homeTaskCadence(task){
  const dates=[...new Set((state.homeLogs||[]).filter(x=>String(x.task||"").toLowerCase()===String(task||"").toLowerCase()&&x.status==="done"&&/^\d{4}-\d{2}-\d{2}$/.test(String(x.date||""))).map(x=>x.date))].sort();
  const intervals=[];for(let i=1;i<dates.length;i++){const days=Math.round((new Date(dates[i]+"T12:00:00")-new Date(dates[i-1]+"T12:00:00"))/86400000);if(days>0)intervals.push(days)}

  const recent=intervals.slice(-8),sorted=[...recent].sort((a,b)=>a-b),mid=Math.floor(sorted.length/2),
        typical=sorted.length%2?sorted[mid]:Math.round((sorted[mid-1]+sorted[mid])/2),age=homeTaskAge(task);

    if(age>=typical*1.2)stateLabel="longer than usual";

  return{dates,intervals:recent,samples:recent.length,typical,min:Math.min(...recent),max:Math.max(...recent),age,stateLabel,label:`Usually about every ${typical} day${typical===1?"":"s"}`};

function patternMonthStats(start,end){
  const inRange=x=>String(x?.date||"")>=start&&String(x?.date||"")<=end;
  return{
    workHours:(state.workShifts||[]).filter(inRange).reduce((n,x)=>n+wh(x),0),
    workouts:(state.workouts||[]).filter(inRange).length,
    reading:(state.readingLogs||[]).filter(inRange).reduce((n,x)=>n+Number(x.pages||0),0),
    chores:(state.chores||[]).filter(x=>inRange(x)&&x.done).length,
    meals:(state.meals||[]).filter(x=>inRange(x)&&x.status==="made").length,
    careDays:new Set((state.selfCare||[]).filter(x=>inRange(x)&&x.done).map(x=>x.date)).size
  };
}
function patternCompareTile(label,current,previous,format=v=>String(v)){
  const max=Math.max(Number(current)||0,Number(previous)||0,1),
        currentPct=Math.round((Number(current)||0)*100/max),
        previousPct=Math.round((Number(previous)||0)*100/max),
        delta=(Number(current)||0)-(Number(previous)||0),
        deltaLabel=Math.abs(delta)<.005?"same":delta>0?"↑ "+format(Math.abs(delta)):"↓ "+format(Math.abs(delta));
  return `<div class="pattern-compare-tile"><div class="pattern-compare-head"><span><b>${esc(format(current))}</b><small>${esc(label)}</small></span><span class="tag">${esc(deltaLabel)}</span></div><div class="pattern-mini-bars" aria-label="${esc(label)} compared with the same span last month"><span><i style="width:${currentPct}%"></i><small>This month</small></span><span><i style="width:${previousPct}%"></i><small>Last month</small></span></div><div class="muted small">Previous same span: ${esc(format(previous))}</div></div>`;
}
function monthOverviewCard(){

        prevDate=new Date(now.getFullYear(),now.getMonth()-1,1),
        prevPrefix=`${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,"0")}`,
        prevLast=new Date(prevDate.getFullYear(),prevDate.getMonth()+1,0).getDate(),
        prevEnd=prevPrefix+"-"+String(Math.min(day,prevLast)).padStart(2,"0"),
        current=patternMonthStats(prefix+"-01",today),
        previous=patternMonthStats(prevPrefix+"-01",prevEnd),
        monthName=new Date(prefix+"-01T12:00:00").toLocaleDateString("en-US",{month:"long"});
  return `<div class="card month-overview"><div class="section-title"><div><div class="eyebrow">Month at a glance</div><h2>${esc(monthName)} through day ${day}</h2><div class="muted small">Compared with the same number of calendar days last month.</div></div></div><div class="pattern-compare-grid">
    ${patternCompareTile("UPS hours",current.workHours,previous.workHours,v=>Number(v).toFixed(1)+" h")}
    ${patternCompareTile("workouts",current.workouts,previous.workouts,v=>Math.round(Number(v)||0)+"")}
    ${patternCompareTile("pages read",current.reading,previous.reading,v=>Math.round(Number(v)||0)+"")}
    ${patternCompareTile("chores done",current.chores,previous.chores,v=>Math.round(Number(v)||0)+"")}
    ${patternCompareTile("meals made",current.meals,previous.meals,v=>Math.round(Number(v)||0)+"")}
    ${patternCompareTile("self-care days",current.careDays,previous.careDays,v=>Math.round(Number(v)||0)+"")}
  </div></div>`;
}
function projectUrgency(p){
  if(["done","closed"].includes(String(p.status||"")))return 99;
  const due=String(p.due||"");if(!due)return 50;
  const days=Math.ceil((new Date(due+"T12:00:00")-new Date(ymd()+"T12:00:00"))/86400000);
  return days<0?-10:days<=7?0:days<=30?10:30;
}

function primaryVehicle(){return (state.vehicles||[]).find(v=>v.primary)||(state.vehicles||[])[0]||null}
function isFuelService(x){return /fuel|gas/i.test(String(x?.type||""))||Number(x?.gallons||0)>0}
function tireLogTimestamp(x){
  const date=String(x?.date||""),rawTime=String(x?.time||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return NaN;
  const time=/^\d{2}:\d{2}$/.test(rawTime)?rawTime:"12:00";
  return new Date(date+"T"+time+":00").getTime();
}
function tirePressureStats(){
  const rows=[...(state.tireLogs||[])].map(x=>({...x,_ts:tireLogTimestamp(x)}))
    .filter(x=>Number.isFinite(x._ts)&&Number.isFinite(Number(x.psi))&&Number(x.psi)>0)
    .sort((a,b)=>a._ts-b._ts);
  const losses=[];let lastFill=null;
  for(const row of rows){
    const event=String(row.event||"reading").toLowerCase();
    if(event==="fill"){lastFill=row;continue}
    if(!lastFill)continue;
    const hours=(row._ts-lastFill._ts)/3600000,loss=Number(lastFill.psi)-Number(row.psi);
    if(hours>=1&&loss>0)losses.push({from:lastFill,to:row,hours,loss,perDay:loss/(hours/24)});
    lastFill=null;
  }
  const recent=losses.slice(-4),avgPerDay=recent.length?recent.reduce((n,x)=>n+x.perDay,0)/recent.length:null;
  return{rows,latest:rows[rows.length-1]||null,latestFill:[...rows].reverse().find(x=>String(x.event||"").toLowerCase()==="fill")||null,losses,recent,avgPerDay,samples:recent.length};
}
function latestVehicleService(vehicleId,pattern){
  return [...(state.vehicleServices||[])].filter(x=>(!vehicleId||!x.vehicleId||x.vehicleId===vehicleId)&&pattern.test(String(x.type||"")))
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||Number(b.mileage||0)-Number(a.mileage||0))[0]||null;
}
function vehicleMaintenanceSnapshot(v=primaryVehicle()){
  if(!v)return{oil:null,rotation:null};
  const currentMiles=Number(v.mileage||0),
        oilLast=latestVehicleService(v.id,/oil/i),
        rotationLast=latestVehicleService(v.id,/rotation/i),
        build=(key,label,last,dueMiles,dueDate,interval)=>{
          const miles=Number(dueMiles||0)||null,date=String(dueDate||""),every=Number(interval||0)||null,
                mileageDue=!!(miles&&currentMiles&&currentMiles>=miles),
                dateDue=!!(date&&date<=ymd()),
                due=mileageDue||dateDue,
                milesRemaining=miles&&currentMiles?miles-currentMiles:null;
          return{key,label,last,dueMiles:miles,dueDate:date,interval:every,due,mileageDue,dateDue,milesRemaining,currentMiles};
        };
  return{
    oil:build("oil","Oil change",oilLast,v.oilDueMiles,v.oilDueDate,v.oilIntervalMiles),
    rotation:build("rotation","Tire rotation",rotationLast,v.rotationDueMiles,v.rotationDueDate,v.rotationIntervalMiles)
  };
}
function vehicleMaintenanceText(x){
  if(!x)return{main:"not set",detail:""};
  let main="not set";
  if(x.due)main="DUE";
  else if(x.dueMiles)main=Number(x.dueMiles).toLocaleString()+" mi";
  else if(x.dueDate)main=dl(x.dueDate);
  else if(x.interval)main="log a service to calculate";
  const detail=[
    x.last?(x.last.mileage?"Last "+Number(x.last.mileage).toLocaleString()+" mi":x.last.date?"Last "+dl(x.last.date):""):"",
    x.interval?"every "+Number(x.interval).toLocaleString()+" mi":"",
    !x.due&&x.milesRemaining!==null&&x.milesRemaining>0?Number(x.milesRemaining).toLocaleString()+" mi remaining":""
  ].filter(Boolean).join(" · ");
  return{main,detail};
}
function recalculateVehicleMaintenance(v=primaryVehicle()){
  if(!v)return;
  const oil=latestVehicleService(v.id,/oil/i),rotation=latestVehicleService(v.id,/rotation/i),
        oi=Number(v.oilIntervalMiles||0),ri=Number(v.rotationIntervalMiles||0);
  if(oil?.mileage&&oi>0)v.oilDueMiles=Number(oil.mileage)+oi;
  if(rotation?.mileage&&ri>0)v.rotationDueMiles=Number(rotation.mileage)+ri;
}
function ensureVehicleMaintenanceTasks(date=ymd()){
  if(!Array.isArray(state.tasks))state.tasks=[];
  const v=primaryVehicle();if(!v)return;
  const snap=vehicleMaintenanceSnapshot(v);
  for(const x of [snap.oil,snap.rotation]){
    if(!x)continue;
    let task=state.tasks.find(t=>t.sourceMaintenance===x.key&&!t.done);
    if(x.due&&!task){
      task={id:uid(),date,title:x.label+" due",category:"car",notes:[x.dueMiles?Number(x.dueMiles).toLocaleString()+" mi due":"",x.dueDate?"Due "+x.dueDate:""].filter(Boolean).join(" · "),done:false,order:35,sourceMaintenance:x.key,itineraryMinutes:60,itineraryPreference:"afternoon"};
      state.tasks.push(task);
    }else if(!x.due&&task){
      task.done=true;
      task.notes=[task.notes,"Maintenance no longer shows due"].filter(Boolean).join(" · ");
    }
  }
}

function vehicleFuelStats(vehicleId=""){
  const fills=(state.vehicleServices||[]).filter(x=>(!vehicleId||!x.vehicleId||x.vehicleId===vehicleId)&&isFuelService(x)&&Number(x.mileage)>0&&Number(x.gallons)>0)
    .sort((a,b)=>Number(a.mileage)-Number(b.mileage)||String(a.date||"").localeCompare(String(b.date||"")));
  const byId=new Map(),mpgs=[];
  for(let i=0;i<fills.length;i++){
    const x=fills[i],prev=fills[i-1],pricePerGallon=Number(x.cost)>0?Number(x.cost)/Number(x.gallons):null;
    let miles=null,mpg=null;
    if(prev&&x.fullTank===true&&prev.fullTank===true){
      const diff=Number(x.mileage)-Number(prev.mileage);
      if(diff>0&&diff<2000){miles=diff;mpg=diff/Number(x.gallons);mpgs.push(mpg)}
    }
    byId.set(x.id,{pricePerGallon,miles,mpg});
  }
  const latest=fills[fills.length-1]||null,avgMpg=mpgs.length?mpgs.slice(-5).reduce((a,b)=>a+b,0)/mpgs.slice(-5).length:null;
  return{fills,latest,byId,avgMpg,mpgs};
}

  </div>`;
}

function petRoutineDueState(r){

  const linkedPet=r.petId?petById(r.petId):null;if(linkedPet?.status==="Archived")return{due:false,label:"Pet archived",days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};

function plantById(id){return (state.plants||[]).find(p=>p.id===id)}
function plantCareState(p){
  const last=lastPlantLog(p.id,"Watered"),days=last?daysSinceDate(last.date):null,every=Math.max(0,Number(p.waterEveryDays||0));
  if(p.status==="Finished"||p.status==="Dormant")return{label:p.status,due:false,days};
  if(!every)return{label:last?"Last watered "+days+"d ago":"No water schedule",due:false,days};
  if(days===null)return{label:"Watering not logged yet",due:true,days:null};

}

function gardenSeasonInfo(){
  const m=new Date().getMonth()+1;
  if([12,1,2].includes(m))return{season:"Winter planning",focus:"Review last season, order seeds, plan beds, and watch indoor plants."};
  if([3,4].includes(m))return{season:"Early spring",focus:"Seed starting, bed prep, pruning, and checking soil conditions are common priorities."};
  if(m===5)return{season:"Spring planting",focus:"Transplants, direct sowing, containers, and frost-sensitive planting move to the front."};
  if([6,7,8].includes(m))return{season:"Growing season",focus:"Watering, weeds, pests, succession planting, and harvest tracking matter most."};
  if([9,10].includes(m))return{season:"Fall garden",focus:"Harvest, seed saving, cleanup, perennials, bulbs, and frost preparation are useful focuses."};
  return{season:"Late fall",focus:"Finish cleanup, protect tender plants, store supplies, and capture notes for next year."};
}

  if(!rows.length)return"";
  const byPlant=new Map();
  for(const x of rows){const p=plantById(x.plantId),name=p?.name||"Unknown plant";if(!byPlant.has(name))byPlant.set(name,[]);byPlant.get(name).push(x)}
  return `<div class="card garden-harvest-card"><div class="section-title"><div><div class="eyebrow">${year} harvest</div><h2>${rows.length} harvest log${rows.length===1?"":"s"}</h2></div></div>${[...byPlant.entries()].map(([name,logs])=>`<div class="row"><span><b>${esc(name)}</b><div class="muted small">${logs.slice(-3).map(x=>esc(x.value||dl(x.date))).join(" · ")}</div></span><b>${logs.length}</b></div>`).join("")}</div>`;

function plantRoutineById(id){return (state.plantCareRoutines||[]).find(x=>x.id===id)}
function plantRoutineDueState(r){
  if(r.active===false)return{due:false,label:"Paused",days:null};
  const linkedPlant=r.plantId?plantById(r.plantId):null;if(["Finished","Dormant"].includes(linkedPlant?.status))return{due:false,label:linkedPlant.status,days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};
  if(days===0)return{due:true,label:"Due today",days};
  return{due:false,label:"Due "+dl(date),days};
}
function duePlantRoutines(){return (state.plantCareRoutines||[]).filter(r=>plantRoutineDueState(r).due).sort((a,b)=>String(a.nextDate||"").localeCompare(String(b.nextDate||"")))}
function plantRoutinesCard(){

  let body="";
  for(const r of rows){
    const p=plantById(r.plantId),s=plantRoutineDueState(r);
    body+=`<div class="pet-routine-row ${s.due?"is-due":""}"><button class="grow routine-edit" onclick="openPlantRoutine('${r.id}')"><b>${esc(r.title)}</b><small>${p?esc(p.name)+" · ":"Garden-wide · "}${esc(s.label)}${r.everyDays?" · every "+r.everyDays+"d":""}</small></button><button class="btn small ${s.due?"primary":""}" onclick="completePlantRoutine('${r.id}')">Done</button></div>`;

}

function familyConnectionClusters(){
  const profiles=state.peopleProfiles||[],byName=new Map(profiles.map(p=>[String(p.name||"").trim().toLowerCase(),p])),
        visited=new Set(),clusters=[];
  for(const p of profiles){
    if(visited.has(p.id)||!(p.familyLinks||[]).length)continue;
    const stack=[p],members=[];
    while(stack.length){
      const cur=stack.pop();if(!cur||visited.has(cur.id))continue;
      visited.add(cur.id);members.push(cur);
      for(const link of cur.familyLinks||[]){
        const match=byName.get(String(link.name||"").trim().toLowerCase());
        if(match&&!visited.has(match.id))stack.push(match);
      }
    }
    if(members.length>1)clusters.push(members);
  }
  return clusters.sort((a,b)=>b.length-a.length||String(a[0]?.name||"").localeCompare(String(b[0]?.name||"")));
}
function familyConnectionsCard(){
  const clusters=familyConnectionClusters();
  if(!clusters.length)return"";
  return `<div class="card family-connections-card"><div class="section-title"><div><div class="eyebrow">Family connections</div><h2>${clusters.length} linked family group${clusters.length===1?"":"s"}</h2><div class="muted small">These connections come from private People profiles, not household membership.</div></div></div>
    <div class="family-cluster-grid">${clusters.map(group=>`<div class="family-cluster">${group.map(p=>`<button onclick="openPersonHub('${p.id}')"><span class="person-avatar mini">${esc((p.name||"?").trim().charAt(0).toUpperCase()||"?")}</span><span><b>${esc(p.name)}</b><small>${esc(relationshipLabel(p))}</small></span></button>`).join("")}</div>`).join("")}</div>
  </div>`;
}
function peopleAgendaItems(){
  const profileByName=new Map((state.peopleProfiles||[]).map(p=>[String(p.name||"").trim().toLowerCase(),p])),rows=[];
  for(const e of state.events||[]){
    if(!e.date||e.date<ymd()||e.status==="cancelled")continue;
    const p=profileByName.get(String(e.child||"").trim().toLowerCase());if(!p)continue;
    rows.push({kind:"event",person:p,date:e.date,title:e.title||"Event",time:e.startTime||"",location:e.location||"",id:e.id});
  }
  for(const p of state.peopleProfiles||[])for(const plan of p.sharedPlans||[]){
    if(!plan||typeof plan==="string"||!plan.date||plan.date<ymd())continue;
    rows.push({kind:"plan",person:p,date:plan.date,title:plan.title||"Plan",time:plan.time||"",location:plan.location||"",id:plan.id||""});
  }
  return rows.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}

function openPersonNote(personId,noteId=""){
  const p=personById(personId);if(!p)return;
  if(!Array.isArray(p.personNotes))p.personNotes=[];
  const existing=p.personNotes.find(n=>n.id===noteId);
  const note=existing||{id:"",date:ymd(),category:"General",text:""};
  modal(`Note · ${p.name}`,`<div class="stack"><div class="grid2"><label>Date<input id="pndate" type="date" value="${esc(note.date||ymd())}"></label><label>Type<select id="pncat">${["General","Preference","Life update","Gift clue","Memory","Follow-up"].map(v=>`<option ${(note.category||"General")===v?"selected":""}>${v}</option>`).join("")}</select></label></div><label>Note<textarea id="pntext" rows="5" placeholder="Something they mentioned, a preference, family update, gift clue, memory…">${esc(note.text||"")}</textarea></label></div>`,"Save",async()=>{
    const textValue=$("#pntext").value.trim();if(!textValue)return;
    let n=existing;if(!n){n={id:uid()};p.personNotes.push(n)}
    Object.assign(n,{date:$("#pndate").value||ymd(),category:$("#pncat").value,text:textValue,updatedAt:new Date().toISOString()});
    await save();if(typeof cloudUpsertPersonProfile==="function")await cloudUpsertPersonProfile(p);closeModal();render();
  });
}
function openPersonPlan(personId,planId=""){

}
function readingMonthCard(){

        pages=logs.reduce((n,x)=>n+Number(x.pages||0),0),days=new Set(logs.map(x=>x.date)).size,

function readingBooksCard(){
  const map=new Map();
  for(const x of state.readingLogs||[]){
    const book=String(x.book||"").trim();if(!book)continue;
    const key=book.toLowerCase(),row=map.get(key)||{book,pages:0,logs:0,last:""};
    row.pages+=Number(x.pages||0);row.logs++;if(String(x.date||"")>row.last)row.last=x.date;map.set(key,row);
  }
  const rows=[...map.values()].sort((a,b)=>String(b.last).localeCompare(String(a.last))).slice(0,20);
  return `<div class="card"><div class="eyebrow">Books</div><h2>Recently logged</h2>${rows.map(x=>`<div class="row"><span><b>${esc(x.book)}</b><div class="muted small">${x.logs} log${x.logs===1?"":"s"} · last ${esc(dl(x.last))}</div></span><b>${x.pages} pages</b></div>`).join("")||`<div class="notice">Add a book title when logging pages to build this list.</div>`}</div>`;
}
function readingHistoryCard(){

function openReadingHubSection(section){
  if(section==="log"){openReadingChooser();return}
  let title="Reading",body="";
  if(section==="readers"){title="Readers";body=readingReadersCard()}
  else if(section==="wheel"){title="Reader Wheel";body=readingWheelCard()}
  else if(section==="today"){title="Reading Today";body=readingTodayCard()}
  else if(section==="month"){title="Reading This Month";body=readingMonthCard()}
  else if(section==="books"){title="Books";body=readingBooksCard()}
  else if(section==="history"){title="Reading History";body=readingHistoryCard()}
  else if(section==="patterns"){title="Reading Patterns";body=readingPatternCard()}
  modal(title,`<div class="reading-hub-modal">${body}</div>`,"Close",closeModal);
}

function week(offset=0){const b=new Date(),wd=b.getDay(),diff=wd===0?-6:1-wd,m=new Date(b);m.setDate(b.getDate()+diff+(Number(offset)||0)*7);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return ymd(d)})}
function activeOrders(){
  return [...(state.orders||[])].filter(o=>!["complete","cancelled"].includes(String(o.status||""))).sort((a,b)=>String(b.orderDate||"").localeCompare(String(a.orderDate||"")));
}

function foodTotalsForDate(date){
  const rows=(state.foodLogs||[]).filter(x=>x.date===date),sum=k=>rows.reduce((n,x)=>n+Number(x?.[k]||0)*foodQuantity(x),0);
  return{rows,cal:sum("calories"),protein:sum("protein"),carbs:sum("carbs"),fat:sum("fat"),fiber:sum("fiber"),caffeineMg:sum("caffeineMg"),knownCaffeine:rows.some(x=>Number(x.caffeineMg)>0),monsters:rows.filter(x=>x.category==="monster").reduce((n,x)=>n+foodQuantity(x),0)};
}

function foodIntakeTrends(){
  const dates=trendDates(7),labels=dates.map(d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"narrow"})),
    vals=key=>dates.map(d=>{const t=foodTotalsForDate(d);return Number(t[key]||0)}),
    calories=vals("cal"),protein=vals("protein"),caffeine=vals("caffeineMg"),monsters=vals("monsters"),
    waterVals=dates.map(d=>(state.waterLogs||[]).filter(x=>x.date===d).reduce((a,x)=>a+Number(x.oz||0),0)),
    row=(title,arr,fmt)=>{const max=Math.max(1,...arr);return `<div class="trend-row"><div class="trend-title">${esc(title)}</div><div class="trend-bars">${arr.map((v,i)=>trendBar(v,max,labels[i],fmt(v))).join("")}</div></div>`},
    caffeineKnown=caffeine.some(v=>v>0),monsterKnown=monsters.some(v=>v>0);
  return `<div class="card food-trends-card"><div class="eyebrow">7-day intake</div><h2>What you actually logged</h2><div class="muted small">Nutrition and caffeine bars use tracked values, including clearly marked estimates when exact package details are unavailable.</div>${row("Tracked calories",calories,v=>Math.round(v)+"")}${row("Tracked protein",protein,v=>Math.round(v)+"g")}${row("Water",waterVals,v=>Math.round(v)+" oz")}${caffeineKnown?row("Tracked caffeine",caffeine,v=>Math.round(v)+"mg"):""}${monsterKnown?row("Energy drinks",monsters,v=>Number(v.toFixed(1))+""):""}</div>`;
}

let foodWeekOffset=0;
function shiftFoodWeek(delta){
  foodWeekOffset+=Number(delta)||0;
  closeModal();
  openFoodHubSection("week");
}
function resetFoodWeek(){
  foodWeekOffset=0;
  closeModal();
  openFoodHubSection("week");
}
function foodWeekRangeLabel(dates){
  if(!dates?.length)return"";
  const a=new Date(dates[0]+"T12:00:00"),b=new Date(dates[dates.length-1]+"T12:00:00");
  const sameMonth=a.getMonth()===b.getMonth();
  const left=a.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const right=b.toLocaleDateString("en-US",sameMonth?{day:"numeric"}:{month:"short",day:"numeric"});
  return left+" – "+right;
}

    ${dates.map(d=>{const m=state.meals.find(x=>x.date===d&&x.type==="dinner"),rs=mealRecipeStatus(m),sg=latestMealSuggestion(d),past=d<today;return `<div class="row ${past?"past-row":""}"><span onclick="openMeal('${d}')" style="flex:1"><b>${dl(d)}</b><div class="muted small">${m?.method?esc(m.method):past?"Past":""}</div></span>${m?.dish?`<span onclick="openMeal('${d}')" style="text-align:right">${esc(m.dish)}<div class="muted small">${rs==="ready"?"✓ recipe ready":rs==="waiting"?"cloud needed":"✨ building recipe"}</div></span>`:past?`<span class="muted small">No meal logged</span>`:sg?suggestionCard(sg,true):m?.recipeState==="suggestion-queued"?`<span class="muted small">✨ choosing from your kitchen…</span>`:`<div class="actions"><button class="btn small primary" onclick="requestMealSuggestion('${d}')">Suggest</button><button class="btn small" onclick="openMeal('${d}')">Choose</button></div>`}</div>`}).join("")}</div>`;

function inventorySetCategory(category){inventoryCategory=category||"All";localStorage.setItem("dailyLifeInventoryCategory",inventoryCategory);render()}
function inventorySetSearch(value){inventorySearch=String(value||"");render()}
function inventoryRoomById(id){return (state.houseRooms||[]).find(x=>x.id===id)||null}
function inventoryLocationById(id){return (state.inventoryLocations||[]).find(x=>x.id===id)||null}
function inventoryRoomLabel(id){return inventoryRoomById(id)?.name||""}
function inventoryLocationLabel(item){
  const loc=inventoryLocationById(item?.locationId),room=inventoryRoomById(item?.roomId||loc?.roomId);
  return [room?.name,loc?.name].filter(Boolean).join(" · ");
}
function inventoryCategories(){
  const defaults=["Household","Cleaning","Bathroom","Clothing","Kids","School","Electronics","Tools","Seasonal","Other"];
  return [...new Set([...defaults,...(state.inventoryItems||[]).map(x=>String(x.category||"").trim()).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
}
function inventoryEnsureRoom(name){
  name=String(name||"").trim();if(!name)return"";
  let room=(state.houseRooms||[]).find(x=>String(x.name||"").trim().toLowerCase()===name.toLowerCase());
  if(!room){room={id:uid(),name,notes:""};state.houseRooms.push(room)}
  return room.id;
}
function inventoryEnsureLocation(roomId,name){
  name=String(name||"").trim();if(!name)return"";
  let loc=(state.inventoryLocations||[]).find(x=>x.roomId===roomId&&String(x.name||"").trim().toLowerCase()===name.toLowerCase());
  if(!loc){loc={id:uid(),roomId,name,notes:""};state.inventoryLocations.push(loc)}
  return loc.id;
}
function inventoryVisibleItems(){
  const q=String(inventorySearch||"").trim().toLowerCase(),cat=inventoryCategory||"All";
  return [...(state.inventoryItems||[])].filter(x=>{
    if(cat!=="All"&&String(x.category||"Other")!==cat)return false;
    if(!q)return true;
    const hay=[x.name,x.category,x.status,x.notes,inventoryLocationLabel(x)].join(" ").toLowerCase();
    return hay.includes(q);
  }).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
}

function openInventoryItem(id=""){
  const x=(state.inventoryItems||[]).find(v=>v.id===id)||{id:"",name:"",category:"Household",quantity:1,status:"Have",roomId:"",locationId:"",notes:""};
  const roomName=inventoryRoomLabel(x.roomId||inventoryLocationById(x.locationId)?.roomId),locName=inventoryLocationById(x.locationId)?.name||"";
  modal(x.id?"Inventory item":"Add inventory item",`<div class="stack">
    <label>Item<input id="invname" value="${esc(x.name||"")}" placeholder="Batteries, winter coats, light bulbs…"></label>
    <div class="grid2"><label>Category<input id="invcat" list="inventoryCategories" value="${esc(x.category||"Household")}"><datalist id="inventoryCategories">${inventoryCategories().map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label><label>Quantity<input id="invqty" type="number" min="0" step="1" value="${Number(x.quantity??1)}"></label></div>
    <div class="grid2"><label>Room<input id="invroom" list="inventoryRooms" value="${esc(roomName)}" placeholder="Kitchen"><datalist id="inventoryRooms">${(state.houseRooms||[]).map(r=>`<option value="${esc(r.name)}">`).join("")}</datalist></label><label>Location<input id="invloc" value="${esc(locName)}" placeholder="Pantry shelf, hall closet, bin 2…"></label></div>
    <label>Status<select id="invstatus">${["Have","Low","Need","Stored","Lent out","Donate / sell","Gone"].map(v=>`<option ${String(x.status||"Have")===v?"selected":""}>${v}</option>`).join("")}</select></label>
    <label>Notes<textarea id="invnotes" rows="3">${esc(x.notes||"")}</textarea></label>
    ${x.id?`<button type="button" class="btn danger" onclick="removeInventoryItem('${x.id}')">Remove item</button>`:""}
  </div>`,"Save",async()=>{
    const name=$("#invname").value.trim();if(!name)return;

    let row=(state.inventoryItems||[]).find(v=>v.id===id);if(!row){row={id:uid()};state.inventoryItems.push(row)}
    Object.assign(row,{name,category:$("#invcat").value.trim()||"Other",quantity:Math.max(0,Number($("#invqty").value||0)),status:$("#invstatus").value,roomId,locationId,notes:$("#invnotes").value.trim(),updatedAt:new Date().toISOString()});

async function removeInventoryItem(id){

function monthSummary(){const prefix=ymd().slice(0,7),ws=state.workShifts.filter(x=>x.date.startsWith(prefix)),wat=state.waterLogs.filter(x=>x.date.startsWith(prefix)),st=state.stretchLogs.filter(x=>x.date.startsWith(prefix)),rd=state.readingLogs.filter(x=>x.date.startsWith(prefix));return{work:ws.reduce((s,x)=>s+wh(x),0),water:wat.reduce((s,x)=>s+Number(x.oz||0),0),waterDays:new Set(wat.map(x=>x.date)).size,stretch:st.reduce((s,x)=>s+Number(x.minutes||0),0),stretchDays:new Set(st.map(x=>x.date)).size,pages:rd.reduce((s,x)=>s+Number(x.pages||0),0),readingDays:new Set(rd.map(x=>x.date)).size}}
function safeToSpendSnapshot(){
  const allCash=(state.accounts||[]).filter(a=>["checking","savings"].includes(a.type)&&a.balance!==null&&a.balance!==""&&Number.isFinite(Number(a.balance))),
        protectedCash=allCash.filter(a=>a.protectFromSpending||a.key==="house_fund"),
        cash=allCash.filter(a=>!a.protectFromSpending&&a.key!=="house_fund"),
        cashKeys=new Set(cash.map(a=>a.key)),
        total=cash.reduce((sum,a)=>sum+Number(a.balance||0),0),
        protectedTotal=protectedCash.reduce((sum,a)=>sum+Number(a.balance||0),0),
        readiness=billReadiness().filter(r=>r.bill.status!=="paid"),
        validBills=readiness.filter(r=>r.account&&cashKeys.has(r.account.key)&&validBillDate(r.bill.due)&&r.bill.amount!==null&&r.bill.amount!==""&&Number.isFinite(Number(r.bill.amount))&&Number(r.bill.amount)>=0),
        dates=[...new Set(validBills.map(r=>r.bill.due))].sort(),
        horizon=dates[dates.length-1]||"",
        income=horizon?expectedIncomeOccurrences(horizon).filter(x=>cashKeys.has(x.accountKey)):[];

  let reserveCents=0;
  for(const date of dates){
    let billNeedAfterRestricted=0,transferableIncome=0;
    for(const account of cash){
      const billsThrough=validBills.filter(r=>r.account.key===account.key&&r.bill.due<=date).reduce((sum,r)=>sum+Math.round(Number(r.bill.amount)*100),0),
            restrictedIncome=income.filter(x=>x.accountKey===account.key&&x.date<=date&&!x.transferable).reduce((sum,x)=>sum+Math.round(Number(x.amount)*100),0);
      billNeedAfterRestricted+=Math.max(0,billsThrough-restrictedIncome);
    }
    transferableIncome=income.filter(x=>x.date<=date&&x.transferable).reduce((sum,x)=>sum+Math.round(Number(x.amount)*100),0);
    reserveCents=Math.max(reserveCents,Math.max(0,billNeedAfterRestricted-transferableIncome));
  }

  const reserved=reserveCents/100,
        cushion=budgetCents(budgetPlan().limits?.cushion)/100,
        safe=total-reserved-cushion,
        incomplete=readiness.some(r=>["Needs account","Balance unavailable","Check bill","Check earlier bill"].includes(r.status)),
        expectedThroughHorizon=horizon?income.reduce((sum,x)=>sum+Number(x.amount||0),0):0;
  return{total,protectedTotal,reserved,cushion,safe,incomplete,horizon,expectedThroughHorizon};
}

function systemHealthChecks(){
  const issues=[],info=[];
  const people=state.peopleProfiles||[],personIds=new Set(people.map(p=>p.id));
  const duplicateNames=[...new Set(people.map(p=>String(p.name||"").trim().toLowerCase()).filter((n,i,a)=>n&&a.indexOf(n)!==i))];
  if(duplicateNames.length)issues.push(`${duplicateNames.length} duplicate People name${duplicateNames.length===1?"":"s"} need review`);
  const orphanKids=(state.kidsMoneyAccounts||[]).filter(a=>a.personId&&!personIds.has(a.personId)).length;
  if(orphanKids)issues.push(`${orphanKids} Kids Money account${orphanKids===1?"":"s"} no longer match a People profile`);
  const oldSpelling=JSON.stringify({
    people:state.peopleProfiles,
    tasks:state.tasks,
    chores:state.chores,
    events:state.events,
    readers:state.settings?.readers,
    familyMembers:state.settings?.familyMembers,
    routines:state.settings?.recurringFamilyEvents
  }).match(/Dimitri/gi)?.length||0;
  if(oldSpelling)issues.push(`Found ${oldSpelling} misspelled “Dimitri” reference${oldSpelling===1?"":"s"}; use Demitri`);
  const badBills=(state.bills||[]).filter(b=>Number(b.amount)<0||!String(b.name||"").trim()).length;
  if(badBills)issues.push(`${badBills} bill record${badBills===1?"":"s"} need review`);
  const unfinishedUps=(state.workShifts||[]).filter(w=>w.date<ymd()&&w.start&&!w.end).length;
  if(unfinishedUps)issues.push(`${unfinishedUps} past UPS shift${unfinishedUps===1?"":"s"} still need a punch-out`);
  if(typeof cloudUser==="function"&&cloudUser()){
    if(!cloudRemoteUpdatedAt)issues.push("No full private cloud snapshot has been created yet");
    if(typeof cloudError==="string"&&cloudError)issues.push("Cloud reported an error: "+cloudError);
    else info.push("Cloud account signed in");
  }else info.push("Cloud account not signed in on this device");
  if(typeof sharingConnected==="function"&&sharingConnected())info.push("Household sharing connected");
  else info.push("Household sharing not connected");
  if(typeof vaultEnvelope!=="undefined"&&vaultEnvelope)info.push("Encrypted Private Vault exists on this device");
  else info.push("Private Vault not created on this device");
  info.push(`${people.length} People profiles · ${(state.events||[]).length} events · ${(state.tasks||[]).length} tasks`);
  info.push(`Build ${APP_BUILD} · data schema v${Number(state.version)||0}`);
  info.push(navigator.serviceWorker?.controller?"Installed-app service worker active":"Service worker not controlling this page yet");
  const lastExport=localStorage.getItem("dailyLifeLastExportAt");if(lastExport)info.push("Last manual export "+new Date(lastExport).toLocaleString());
  if(typeof cloudRemoteUpdatedAt!=="undefined"&&cloudRemoteUpdatedAt)info.push("Cloud snapshot "+new Date(cloudRemoteUpdatedAt).toLocaleString());
  if(typeof sharingLastPulledAt!=="undefined"&&sharingLastPulledAt)info.push("Shared household sync "+new Date(sharingLastPulledAt).toLocaleString());
  return{issues,info};
}

async function removeHobbyProject(id){
  const x=hobbyProjectById(id);if(!x||!confirm(`Delete "${x.name||"this project"}"?`))return;
  state.hobbyProjects=(state.hobbyProjects||[]).filter(v=>v.id!==id);await save();closeModal();render();
}
async function removeHobbyPhoto(id){
  const x=hobbyProjectById(id);if(!x)return;delete x.photo;x.photoLocalOnly=false;await save();closeModal();openHobbyProject(id);
}
async function addHobbyMaterialsToShopping(id){
  const x=hobbyProjectById(id);
  const raw=x?String(x.materials||""):String($("#hpmaterials")?.value||"");
  const projectName=x?.name||String($("#hpname")?.value||"Hobby project").trim()||"Hobby project";
  const lines=raw.split(/\r?\n/).map(v=>v.replace(/^[-•*]\s*/,"").trim()).filter(Boolean);
  if(!lines.length){alert("Add materials first.");return}
  let added=0;
  for(const item of lines){
    const key=normFood(item),exists=(state.shopping||[]).some(s=>s.status==="needed"&&normFood(s.item)===key);
    if(exists)continue;
    state.shopping.push({id:uid(),item,qty:"",store:"",status:"needed",source:"hobby",notes:"For "+projectName});added++;
  }
  await save();render();alert(added?added+" material"+(added===1?"":"s")+" added to the shopping list.":"Those materials are already on the shopping list.");
}

// Budget values live only in the existing local state/backup, never in source defaults.
const BUDGET_CATEGORIES=[
  {id:"transport",name:"Transportation/Gas"},
  {id:"dining",name:"Dining/Convenience"},
  {id:"household",name:"Household/Shopping"},
  {id:"personal",name:"Personal/Health"},
  {id:"grocery",name:"Cash Grocery Overflow"},
  {id:"fun",name:"Entertainment/Fun"},
  {id:"cushion",name:"Cushion"}
];
let budgetMonth=localStorage.getItem("dailyLifeBudgetMonth")||ymd().slice(0,7);
let budgetTab=localStorage.getItem("dailyLifeBudgetTab")||"plan";
const budgetCents=value=>Number.isFinite(Number(value))?Math.round(Math.max(0,Number(value))*100):0;
const budgetMoney=cents=>money(cents/100);
function budgetPlan(month=budgetMonth){
  const saved=state.budget.months[month]||{};
  return {...saved,income:saved.income??null,ebt:saved.ebt??null,ebtStart:saved.ebtStart??null,limits:{...(saved.limits||{})}};
}
function budgetTotals(month=budgetMonth){
  const plan=budgetPlan(month),bills=state.bills.filter(b=>String(b.due||"").slice(0,7)===month);
  const logs=state.budget.spending.filter(x=>String(x.date||"").slice(0,7)===month);
  const billTotal=bills.reduce((sum,b)=>sum+budgetCents(b.amount),0);
  const income=budgetCents(plan.income),ebt=budgetCents(plan.ebt),ebtStart=budgetCents(plan.ebtStart);
  const assigned=BUDGET_CATEGORIES.reduce((sum,c)=>sum+budgetCents(plan.limits[c.id]),0);
  const spent=logs.filter(x=>x.category!=="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const ebtSpent=logs.filter(x=>x.category==="ebt").reduce((sum,x)=>sum+budgetCents(x.amount),0);
  const [year,mo]=month.split("-").map(Number),days=new Date(year,mo,0).getDate(),today=ymd();
  const daysLeft=month<today.slice(0,7)?0:month===today.slice(0,7)?days-Number(today.slice(8))+1:days;
  const flexible=income-billTotal,remaining=flexible-spent;
  const ebtAvailable=ebtStart+ebt-ebtSpent;
  return {plan,bills,logs,billTotal,income,ebt,ebtStart,ebtAvailable,assigned,spent,ebtSpent,flexible,remaining,
    left:income-billTotal-assigned,daysLeft,weekly:daysLeft?Math.max(0,remaining)*7/daysLeft:0};
}
function budgetProgress(spent,limit,label){
  const percent=limit>0?Math.min(100,Math.round(spent*100/limit)):spent>0?100:0;
  return `<progress class="budget-progress ${spent>limit?"over":""}" max="100" value="${percent}" aria-label="${esc(label)}" aria-valuetext="${esc(budgetMoney(spent))} spent of ${esc(budgetMoney(limit))}">${percent}%</progress>`;
}

  return `${hero}${budgetTabs()}<div class="budget-tab-panel">${budgetTab==="plan"?plan:budgetTab==="bills"?bills:budgetTab==="categories"?categories:activity}</div>`;

function budgetHubDetailHtml(section){

  const html=budgetDetailedView();
  budgetTab=previous;
  return html;
}

function budgetAmountInput(id,label,value){return `<label>${label}<input id="${id}" type="number" inputmode="decimal" min="0" max="999999999" step="0.01" placeholder="0.00" value="${value===null||value===undefined?"":esc(value)}"></label>`}
function readBudgetAmount(id){
  const input=$("#"+id),value=input.value.trim();
  if(!input.checkValidity()||!Number.isFinite(Number(value))||Number(value)<0){input.reportValidity();throw new Error("Invalid amount")}
  return value===""?null:budgetCents(value)/100;
}
async function persistBudgetEdit(before){
  try{await save();closeModal();render();return true}
  catch(error){state.budget=before;alert("Could not save budget changes on this device. Please try again.");return false}
}
function openBudgetIncome(){
  const month=budgetMonth,p=budgetPlan(month);
  modal("Monthly income & benefits",`<p class="muted small">${month} · Enter expected take-home cash income. Keep grocery benefits separate.</p><div class="stack">${budgetAmountInput("budgetIncome","Expected monthly cash income",p.income)}${budgetAmountInput("budgetEBTStart","Starting EBT balance / carryover",p.ebtStart)}${budgetAmountInput("budgetEBT","Monthly EBT / grocery benefit",p.ebt)}</div>`,"Save",async()=>{
    let income,ebtStart,ebt;try{income=readBudgetAmount("budgetIncome");ebtStart=readBudgetAmount("budgetEBTStart");ebt=readBudgetAmount("budgetEBT")}catch{return}
    const before=structuredClone(state.budget);state.budget.months[month]={...budgetPlan(month),income,ebtStart,ebt};await persistBudgetEdit(before);
  });
}
function openBudgetLimit(id){
  const month=budgetMonth,c=BUDGET_CATEGORIES.find(c=>c.id===id);if(!c)return;
  modal(c.name,`<p class="muted small">Monthly limit · ${month}</p>${budgetAmountInput("budgetLimit","Cash limit",budgetPlan(month).limits[id])}`,"Save",async()=>{
    let value;try{value=readBudgetAmount("budgetLimit")}catch{return}
    const before=structuredClone(state.budget),p=budgetPlan(month);p.limits[id]=value??0;state.budget.months[month]=p;await persistBudgetEdit(before);
  });
}
async function autoSplitBudget(){
  const t=budgetTotals();if(t.flexible<=0){alert("There is no positive cash income remaining after this month’s bills to split.");return}
  if(!confirm(`Replace all seven limits for ${budgetMonth} with equal shares of ${budgetMoney(t.flexible)}? Existing spending stays unchanged. You can edit each limit afterward.`))return;
  const before=structuredClone(state.budget),p=budgetPlan(),base=Math.floor(t.flexible/BUDGET_CATEGORIES.length),remainder=t.flexible% BUDGET_CATEGORIES.length;
  BUDGET_CATEGORIES.forEach((c,i)=>p.limits[c.id]=(base+(i<remainder?1:0))/100);
  state.budget.months[budgetMonth]=p;await persistBudgetEdit(before);
}
function openBudgetSpending(category="transport",index=-1){
  const existing=index>=0?state.budget.spending[index]:null;if(index>=0&&!existing)return;
  const x=existing||{category:category||"transport",date:budgetMonth===ymd().slice(0,7)?ymd():budgetMonth+"-01",amount:null,note:""};
  modal(existing?"Edit spending":"Log spending",`<div class="stack"><label>Date<input id="budgetDate" type="date" required value="${esc(x.date)}"></label><label>Category / payment source<select id="budgetCategory">${[...BUDGET_CATEGORIES,{id:"ebt",name:"EBT / grocery benefit (not cash)"}].map(c=>`<option value="${c.id}" ${x.category===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>${budgetAmountInput("budgetSpent","Amount",x.amount)}<label>Note (optional)<input id="budgetNote" maxlength="200" value="${esc(x.note||"")}" placeholder="Purchase or store"></label></div><p class="muted small">For mixed EBT/cash grocery payments, log the two amounts separately. Do not log a bill again here.</p>`,"Save spending",async()=>{
    const date=$("#budgetDate").value;if(!date||!$("#budgetDate").checkValidity()){$("#budgetDate").reportValidity();return}
    let amount;try{amount=readBudgetAmount("budgetSpent")}catch{return}if(!amount){alert("Enter an amount greater than zero.");return}
    const before=structuredClone(state.budget),entry={...existing,id:existing?.id||uid(),date,amount,category:$("#budgetCategory").value,note:$("#budgetNote").value.trim(),userEdited:existing?.source==="bank"?true:existing?.userEdited};
    if(existing)state.budget.spending[index]=entry;else state.budget.spending.push(entry);
    const oldMonth=budgetMonth;budgetMonth=date.slice(0,7);if(!await persistBudgetEdit(before))budgetMonth=oldMonth;
  });
}
async function removeBudgetSpending(index){
  if(!state.budget.spending[index]||!confirm("Remove this spending entry from the local budget?"))return;
  const before=structuredClone(state.budget);state.budget.spending.splice(index,1);await persistBudgetEdit(before);
}

    <label>Exact start (optional)<input id="taskstart" type="time" value="${esc(x.itineraryStart||"")}"></label>

async function removeTask(id){
  const t=(state.tasks||[]).find(x=>x.id===id);if(!t)return;
  if(!confirm(`Delete "${t.title||"this task"}"?`))return;
  if(t.sharedEntryId&&typeof sharingMakeTaskPrivate==="function"){const ok=await sharingMakeTaskPrivate(t);if(!ok)return}
  state.tasks=(state.tasks||[]).filter(x=>x.id!==id);

function parsePunchDate(text){
  const iso=String(text||"").match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/);if(iso)return iso[1]+"-"+String(iso[2]).padStart(2,"0")+"-"+String(iso[3]).padStart(2,"0");
  const us=String(text||"").match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);return us?us[3]+"-"+String(us[1]).padStart(2,"0")+"-"+String(us[2]).padStart(2,"0"):"";
}
function parsePunchClock(value,ampm=""){
  const m=String(value||"").match(/^(\d{1,2}):(\d{2})$/);if(!m)return"";let h=Number(m[1]),min=Number(m[2]);if(min>59)return"";
  const ap=String(ampm||"").toUpperCase();if(ap){if(h<1||h>12)return"";if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0}else if(h>23)return"";
  return String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");
}
function decimalHourClock(value){
  const n=Number(value);if(!Number.isFinite(n)||n<0||n>=24)return"";
  let total=Math.round(n*60),h=Math.floor(total/60)%24,m=total%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function parsePunchHistory(text){
  const out=[];
  for(const raw of String(text||"").split(/\r?\n/)){
    const line=raw.trim(),date=parsePunchDate(line);if(!line||!date)continue;
    if(/PAY\s+ACTUAL/i.test(line)){
      const afterDate=line.slice(Math.max(0,line.search(/\b\d{1,2}\/\d{1,2}\/20\d{2}\b/))).replace(/^.*?\b\d{1,2}\/\d{1,2}\/20\d{2}\b/,""),
            nums=[...afterDate.matchAll(/\b(\d+(?:\.\d+)?)\b/g)].map(m=>Number(m[1]));
      if(nums.length>=6&&nums[4]>0){
        out.push({date,start:decimalHourClock(nums[0]),end:decimalHourClock(nums[1]),rawStartDecimal:nums[0],rawEndDecimal:nums[1],officialHours:nums[4],officialGrossPay:nums[5],payCode:"PAY ACTUAL",timecardVerified:true,raw:line});
        continue;
      }
    }
    const times=[...line.matchAll(/\b(\d{1,2}:\d{2})\s*(AM|PM)?\b/gi)].map(m=>parsePunchClock(m[1],m[2]||"")).filter(Boolean);
    if(!times.length)continue;
    out.push({date,start:times[0],end:times[1]||"",raw:line});
  }
  const byDate=new Map();for(const x of out){const prev=byDate.get(x.date);if(!prev)byDate.set(x.date,x);else{for(const k of ["start","end","rawStartDecimal","rawEndDecimal","officialHours","officialGrossPay","payCode","timecardVerified"])if((prev[k]===undefined||prev[k]==="")&&x[k]!==undefined)prev[k]=x[k]}}
  return [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function parseUpsTimecardSummary(text){
  const raw=String(text||""),rows=parsePunchHistory(raw),
        gross=raw.match(/This\s+Weeks?\s+Gross\s+Pay:\s*\$?([\d,]+(?:\.\d+)?)/i),
        hours=raw.match(/Total\s+Hours:\s*([\d.]+)/i),
        updated=raw.match(/LAST\s+UPDATED:\s*([^\r\n]+)/i);
  return{
    totalHours:hours?Number(hours[1]):null,
    grossPay:gross?Number(gross[1].replace(/,/g,"")):null,
    lastUpdatedRaw:updated?updated[1].trim():"",
    periodStart:rows[0]?.date||"",
    periodEnd:rows[rows.length-1]?.date||"",
    importedAt:new Date().toISOString(),
    source:"UPS timecard text"
  };
}

const moneyNum=v=>Number(String(v||"").replace(/[$,]/g,""))||0;
function payrollDate(v){const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`:""}
function rx1(text,re){const m=text.match(re);return m?m[1]:""}
async function importPayrollStatement(file){
  if(!file)return;
  try{
    if(!window.pdfjsLib)throw new Error("PDF reader did not load.");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text="";
    for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),content=await page.getTextContent();text+=" "+content.items.map(i=>i.str).join(" ")}
    const payDate=payrollDate(rx1(text,/Pay Date:\s*(\d{1,2}\/\d{1,2}\/\d{4})/i));
    const pm=text.match(/Pay Period:\s*(\d{1,2}\/\d{1,2}\/\d{4})\s*-\s*(\d{1,2}\/\d{1,2}\/\d{4})/i),periodStart=pm?payrollDate(pm[1]):"",periodEnd=pm?payrollDate(pm[2]):"";
    const reg=text.match(/REGULAR\s+([\d.]+)\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i),ot=text.match(/OVERTIME\s+([\d.]+)\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i);
    const earn=text.match(/Earnings\s+([\d.]+)\s+\$?([\d,]+\.\d{2})/i);
    const p={id:uid(),source:"Dayforce PDF",periodStart,periodEnd,payDate,regularHours:reg?Number(reg[1]):0,regularRate:reg?Number(reg[2]):moneyNum(rx1(text,/Pay Rate:\s*([\d.]+)/i)),regularPay:reg?moneyNum(reg[3]):0,overtimeHours:ot?Number(ot[1]):0,overtimeRate:ot?Number(ot[2]):0,overtimePay:ot?moneyNum(ot[3]):0,totalHours:earn?Number(earn[1]):moneyNum(rx1(text,/TOTAL HOURS\s+([\d.]+)/i)),grossPay:earn?moneyNum(earn[2]):0,taxes:moneyNum(rx1(text,/Taxes\s+\$?([\d,]+\.\d{2})/i)),deductions:moneyNum(rx1(text,/Deductions\s+\$?([\d,]+\.\d{2})/i)),reimbursements:moneyNum(rx1(text,/Reimbursements\s+\$?([\d,]+\.\d{2})/i)),netPay:moneyNum(rx1(text,/Net Pay\s+\$?([\d,]+\.\d{2})/i)),directDeposits:[...text.matchAll(/Direct Deposit\s+\d+\s+X+\d+\s+\$?([\d,]+\.\d{2})/gi)].map(m=>moneyNum(m[1])),vacationHours:moneyNum(rx1(text,/Vacation Hours Balance:\s*([\d.]+)/i)),pstHours:moneyNum(rx1(text,/PST Bank Hrly Balance:\s*([\d.]+)/i)),optionWeekHours:moneyNum(rx1(text,/Option Week Hours Balance:\s*([\d.]+)/i)),importedAt:new Date().toISOString()};
    if(!p.payDate||!p.netPay)throw new Error("I could not confidently recognize this Dayforce earnings statement.");
    p.fingerprint=[p.periodStart,p.periodEnd,p.payDate,p.netPay.toFixed(2)].join("|");
    if(state.paychecks.some(x=>x.fingerprint===p.fingerprint)){alert("That earnings statement is already in Daily Life.");return}
    state.paychecks.push(p);await save();render();alert(`Imported UPS paycheck: ${p.totalHours.toFixed(2)} hours · ${money(p.netPay)} net.`);
  }catch(error){alert("Could not import that payroll PDF: "+(error?.message||"Unknown error"))}
  finally{document.querySelector("#payrollFile").value=""}
}

function compressImage(file,max=1100,quality=.78){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}

const ACCOUNT_STRATEGIES=["Standard","Interest-first savings","Deposit landing checking","Transition / close","Protected reserve"];
function accountStrategy(a){return ACCOUNT_STRATEGIES.includes(a?.strategy)?a.strategy:"Standard"}
function accountStrategyNote(a){
  const s=accountStrategy(a);
  if(s==="Interest-first savings")return"Preferred place for cash that does not need to stay elsewhere.";
  if(s==="Deposit landing checking")return"Income can land here, then excess can move after upcoming bills and your chosen buffer.";
  if(s==="Transition / close")return"Use this as an exit checklist: move straggler bills/income and work toward a zero operational balance.";
  if(s==="Protected reserve")return"Keep this money outside ordinary safe-to-spend calculations.";
  return"Normal account with no special cash-placement goal.";
}
function accountBillsDueSoon(accountKey,days=30){
  const end=new Date(ymd()+"T12:00:00");end.setDate(end.getDate()+days);const until=ymd(end);
  return (state.bills||[]).filter(b=>b.status!=="paid"&&b.paymentAccountKey===accountKey&&validBillDate(b.due)&&b.due<=until&&Number.isFinite(Number(b.amount))&&Number(b.amount)>=0);
}
function accountSweepPlan(a,days=45){
  const today=ymd(),endDate=new Date(today+"T12:00:00");endDate.setDate(endDate.getDate()+Math.max(1,Number(days)||45));const until=ymd(endDate),
        floor=Math.max(0,Number(a.minimumOperatingBalance||0)),balance=Number(a.balance||0),events=[];
  for(const x of expectedIncomeOccurrences(until)){
    if(x.accountKey===a.key)events.push({date:x.date,kind:"income",amount:Number(x.amount||0),name:x.name});
  }
  for(const b of state.bills||[]){
    if(b.status==="paid"||b.paymentAccountKey!==a.key||!validBillDate(b.due)||b.due<today||b.due>until)continue;
    const amount=Number(b.amount);if(!Number.isFinite(amount)||amount<0)continue;
    events.push({date:b.due,kind:"bill",amount:-amount,name:b.name});
  }
  events.sort((x,y)=>x.date.localeCompare(y.date)||(x.kind==="bill"?-1:1));
  let running=0,minRunning=0;
  for(const e of events){running+=e.amount;minRunning=Math.min(minRunning,running)}
  const requiredNow=Math.max(floor,floor-Math.min(0,minRunning)),
        excess=Math.max(0,balance-requiredNow),short=Math.max(0,requiredNow-balance);
  return{today,until,floor,balance,events,requiredNow,excess,short,
    billCount:events.filter(x=>x.kind==="bill").length,incomeCount:events.filter(x=>x.kind==="income").length};
}
function accountSortForBills(a){
  const s=accountStrategy(a);
  if(s==="Interest-first savings")return 0;
  if(s==="Standard"&&a.type==="savings")return 1;
  if(s==="Standard")return 2;
  if(s==="Deposit landing checking")return 3;
  if(s==="Protected reserve")return 4;
  return 9;
}

function accountStrategyCard(){
  const accounts=state.accounts||[],interest=accounts.filter(a=>accountStrategy(a)==="Interest-first savings"),
        landings=accounts.filter(a=>accountStrategy(a)==="Deposit landing checking"),
        exiting=accounts.filter(a=>accountStrategy(a)==="Transition / close"),

  const savingsBills=home?(state.bills||[]).filter(b=>b.status!=="paid"&&b.paymentAccountKey===home.key).length:0;
  const landingRows=landings.map(a=>{

      :plan.short>0
        ?`<div class="sweep-suggestion short"><span>Known checking need above current balance</span><b>${money(plan.short)}</b><small>Based on entered bills, expected income timing, and your buffer.</small></div>`
        :`<div class="sweep-suggestion settled"><span>Checking is near the calculated operating amount</span><b>${money(plan.requiredNow)}</b><small>Known 45-day bills + your buffer.</small></div>`;
    return `<div class="money-strategy-row landing"><div class="grow"><b>${esc(a.name)}</b><div class="muted small">Deposit landing · ${plan.billCount} checking bill${plan.billCount===1?"":"s"} · ${plan.incomeCount} expected deposit${plan.incomeCount===1?"":"s"} through ${esc(dl(plan.until))}</div></div><div class="strategy-amount"><b>${money(plan.balance)}</b><small>current recorded balance</small></div></div>${suggestion}`;
  }).join("");
  const exitRows=exiting.map(a=>{

          income=(state.expectedIncome||[]).filter(x=>x.enabled!==false&&x.accountKey===a.key),

  }).join("");
  const interestRows=interest.map(a=>{
    const bills=(state.bills||[]).filter(b=>b.status!=="paid"&&b.paymentAccountKey===a.key).length;
    return `<div class="money-strategy-row home"><div class="grow"><b>${esc(a.name)}</b><div class="muted small">Interest-first home base · ${bills} bill${bills===1?"":"s"} currently pay here${a.billPayAllowed===true?" · direct bill pay allowed":a.billPayAllowed===false?" · direct bill pay unavailable":""}</div></div><b>${money(a.balance)}</b></div>`;
  }).join("");
  return `<div class="card money-strategy-card botanical-money"><div class="section-title"><div><div class="eyebrow">Cash strategy</div><h2>Keep more cash earning interest</h2><div class="muted small">Savings is the preferred home for money that does not need to remain elsewhere. Checking keeps only the amount needed for checking-only bills and your chosen operating buffer.</div></div></div>
    ${home?`<div class="strategy-home-summary"><span><b>Preferred cash home</b><small>${esc(home.name)} · ${savingsBills} active bill${savingsBills===1?"":"s"} already assigned there</small></span><b>${money(home.balance)}</b></div>`:""}
    ${interestRows}${landingRows}
    ${exiting.length?`<div class="mini-heading strategy-exit-title">Accounts to exit</div>${exitRows}`:""}
    <div class="muted small strategy-disclaimer">Sweep guidance uses only recorded balances, entered bills, enabled expected income, and your operating buffer. It does not predict unlogged spending or actually move money.</div>

  if(!validBillDate(b.due))return "";
  const [year,month,day]=b.due.split("-").map(Number),anchor=Number(b.repeatDay)||day;
  const d=new Date(year,month-1+(billRepeat(b)||1),1,12);
  d.setDate(Math.min(anchor,new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate()));
  return ymd(d);
}
function nextBillIndex(b){
  const linked=state.bills.findIndex(x=>x.previousBillId===b.id&&b.id);
  if(linked>=0)return linked;
  const due=nextBillDate(b),name=String(b.name||"").trim().toLowerCase();
  return due?state.bills.findIndex(x=>x!==b&&x.due===due&&String(x.name||"").trim().toLowerCase()===name):-1;
}
function nextBillDraft(b){return {name:b.name,amount:b.amount,due:nextBillDate(b),paymentAccountKey:b.paymentAccountKey||"",desiredAccountKey:b.desiredAccountKey||"",paymentSetup:recordedBillSetup(b),amountType:recordedBillAmountType(b),frequency:recordedBillFrequency(b),repeatMonths:billRepeat(b),repeatDay:Number(b.repeatDay)||Number(String(b.due).slice(8,10)),previousBillId:b.id}}
function appendNextBill(b){
  if(nextBillIndex(b)>=0||!validBillDate(b.due))return;
  state.bills.push({...nextBillDraft(b),id:uid(),status:"upcoming"});
}
function openNextBill(index){
  const b=state.bills[index];if(!b)return;
  const next=nextBillIndex(b);if(next>=0){openBill(next);return}
  openBill(-1,index);
}
function pickBillDate(){

function syncBillFrequencyRepeat(){
  const frequency=$("#billFrequency"),repeat=$("#billRepeat");
  if(!frequency||!repeat)return;
  if(frequency.value==="Monthly")repeat.value="1";
  else if(frequency.value==="Annual")repeat.value="12";
  else if(frequency.value==="One-time")repeat.value="0";

function syncBillRepeatFrequency(){
  const frequency=$("#billFrequency"),repeat=$("#billRepeat");
  if(!frequency||!repeat)return;

  else if(months===12)frequency.value="Annual";
  else if(months>0)frequency.value="Irregular";
  else if(frequency.value!=="Trial / decision pending")frequency.value="One-time";
}
function billRowView(r){
  const b=r.bill,paid=b.status==="paid",pendingPayment=paid&&b.paymentPending===true,bankMatched=paid&&b.paidSource==="bank",tone=["Covered now","Covered by due date"].includes(r.status)?"covered":r.status==="Projected short"?"short":r.status==="Transfer needed"?"transfer":"unknown";

    if(r.status==="Covered now")note=`${money(r.currentBefore/100)} available now before this bill · ${money(r.currentAfter/100)} left after reserving it now.`;
