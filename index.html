<script>

const DB_NAME="daily-life-local-v2";
const DB_VERSION=1;
const STORE="kv";
let __db;
function openDB(){
  if(__db) return Promise.resolve(__db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
    req.onsuccess=()=>{__db=req.result;resolve(__db)};
    req.onerror=()=>reject(req.error);
  });
}
async function dbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbSet(key,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbClear(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}

</script>

function ensureFamilyDay(date=ymd()){

    for(const basic of basics){
      const chore=String(basic),key=name+"|"+chore;
      if(!existing.has(key)){state.chores.push({id:uid(),date,child:name,chore,done:false,generated:"daily-basics"});existing.add(key)}
    }
  }
  for(const r of settings.choreRotations||[]){
    const members=(r.members||[]).map(String).filter(Boolean),chores=(r.chores||[]).map(String).filter(Boolean);

function hmMinutes(v){const m=String(v||"").match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}

function itineraryOpenGaps(items){const prefs=state.settings?.itinerary||{},dayStart=hmMinutes(prefs.dayStart||"03:00")??180,dayEnd=hmMinutes(prefs.dayEnd||"21:30")??1290,intervals=[];for(const x of items){const s=hmMinutes(x.start);if(s===null)continue;let e=hmMinutes(x.end);if(e===null||e<=s)e=s+15;intervals.push({start:Math.max(dayStart,s),end:Math.min(dayEnd,e)})}intervals.sort((a,b)=>a.start-b.start);const merged=[];for(const x of intervals){const last=merged[merged.length-1];if(!last||x.start>last.end)merged.push({...x});else last.end=Math.max(last.end,x.end)}const gaps=[];let cursor=dayStart;for(const x of merged){if(x.start-cursor>=30)gaps.push({id:"gap:"+cursor,start:minutesHm(cursor),end:minutesHm(x.start),title:"Open / flexible time",detail:(x.start-cursor)+" minutes available",fixed:false,kind:"gap",icon:"",source:"gap"});cursor=Math.max(cursor,x.end)}if(dayEnd-cursor>=30)gaps.push({id:"gap:"+cursor,start:minutesHm(cursor),end:minutesHm(dayEnd),title:"Open / flexible time",detail:(dayEnd-cursor)+" minutes available",fixed:false,kind:"gap",icon:"",source:"gap"});return gaps}

function itineraryStatusForDate(date,items){

  const next=timed.find(x=>hmMinutes(x.start)>=hm);
  return active?{title:"Right now · "+active.title,detail:active.end?"Until "+fmtClock(active.end):(active.detail||"")}:
    next?{title:"Next · "+fmtClock(next.start)+" · "+next.title,detail:next.detail||""}:{title:"The timed day is clear",detail:"Use the open time however you need."};
}

function lastHomeTask(task){
  return [...(state.homeLogs||[])].filter(x=>String(x.task||"").toLowerCase()===String(task||"").toLowerCase()&&x.status==="done").sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")))[0]||null;
}
function homeTaskAge(task){
  const x=lastHomeTask(task);if(!x)return null;return Math.max(0,Math.floor((Date.now()-new Date(x.date+"T12:00:00").getTime())/86400000));
}
async function quickHomeTask(task,area="Home"){

function trendDates(days=7){const out=[];const d=new Date();for(let i=days-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(ymd(x))}return out}
function trendBar(value,max,label,display){
  const pct=max>0?Math.max(3,Math.min(100,Math.round((Number(value)||0)*100/max))):3;
  return `<div class="trend-col" title="${esc(label)} · ${esc(display)}"><div class="trend-value">${esc(display)}</div><div class="trend-track"><div class="trend-fill" style="height:${pct}%"></div></div><div class="trend-label">${esc(label)}</div></div>`;
}

function sevenDayTrends(){

        foodVals=dates.map(d=>foodTotalsForDate(d).cal),
        proteinVals=dates.map(d=>foodTotalsForDate(d).protein),

        maxWater=Math.max(1,...waterVals),maxFood=Math.max(1,...foodVals),maxProtein=Math.max(1,...proteinVals),maxSleep=Math.max(1,...sleepVals);

function projectUrgency(p){
  if(["done","closed"].includes(String(p.status||"")))return 99;
  const due=String(p.due||"");if(!due)return 50;
  const days=Math.ceil((new Date(due+"T12:00:00")-new Date(ymd()+"T12:00:00"))/86400000);
  return days<0?-10:days<=7?0:days<=30?10:30;
}

function isFuelService(x){return /fuel|gas/i.test(String(x?.type||""))||Number(x?.gallons||0)>0}
function vehicleFuelStats(vehicleId=""){
  const fills=(state.vehicleServices||[]).filter(x=>(!vehicleId||!x.vehicleId||x.vehicleId===vehicleId)&&isFuelService(x)&&Number(x.mileage)>0&&Number(x.gallons)>0)
    .sort((a,b)=>Number(a.mileage)-Number(b.mileage)||String(a.date||"").localeCompare(String(b.date||"")));
  const byId=new Map(),mpgs=[];
  for(let i=0;i<fills.length;i++){
    const x=fills[i],prev=fills[i-1],pricePerGallon=Number(x.cost)>0?Number(x.cost)/Number(x.gallons):null;
    let miles=null,mpg=null;
    if(prev&&x.fullTank===true&&prev.fullTank===true){
      const diff=Number(x.mileage)-Number(prev.mileage);
      if(diff>0&&diff<2000){miles=diff;mpg=diff/Number(x.gallons);mpgs.push(mpg)}
    }
    byId.set(x.id,{pricePerGallon,miles,mpg});
  }
  const latest=fills[fills.length-1]||null,avgMpg=mpgs.length?mpgs.slice(-5).reduce((a,b)=>a+b,0)/mpgs.slice(-5).length:null;
  return{fills,latest,byId,avgMpg,mpgs};
}

function daysSinceDate(date){
  if(!date)return null;
  const d=new Date(date+"T12:00:00");if(Number.isNaN(d.getTime()))return null;
  return Math.max(0,Math.floor((new Date(ymd()+"T12:00:00")-d)/86400000));
}

function petRoutineById(id){return (state.petCareRoutines||[]).find(x=>x.id===id)}
function petRoutineDueState(r){
  if(r.active===false)return{due:false,label:"Paused",days:null};
  const linkedPet=r.petId?petById(r.petId):null;if(linkedPet?.status==="Archived")return{due:false,label:"Pet archived",days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};
  if(days===0)return{due:true,label:"Due today",days};
  return{due:false,label:"Due "+dl(date),days};
}
function duePetRoutines(){return (state.petCareRoutines||[]).filter(r=>petRoutineDueState(r).due).sort((a,b)=>String(a.nextDate||"").localeCompare(String(b.nextDate||"")))}
function petRoutinesCard(){
  const rows=[...(state.petCareRoutines||[])].filter(r=>r.active!==false&&(!r.petId||petById(r.petId)?.status!=="Archived")).sort((a,b)=>String(a.nextDate||"9999").localeCompare(String(b.nextDate||"9999")));
  let body="";
  for(const r of rows){
    const p=petById(r.petId),s=petRoutineDueState(r);
    body+=`<div class="pet-routine-row ${s.due?"is-due":""}"><button class="grow routine-edit" onclick="openPetRoutine('${r.id}')"><b>${esc(r.title)}</b><small>${p?esc(p.name)+" · ":"Shared care · "}${esc(s.label)}${r.everyDays?" · every "+r.everyDays+"d":""}</small></button><button class="btn small ${s.due?"primary":""}" onclick="completePetRoutine('${r.id}')">Done</button></div>`;
  }
  return `<div class="card pet-routines-card"><div class="section-title"><div><div class="eyebrow">Recurring care</div><h2>${duePetRoutines().length?duePetRoutines().length+" due":"Care routines"}</h2><div class="muted small">Tracks repeating care inside Daily Life only. No notifications are created.</div></div><button class="btn" onclick="openPetRoutine()">+ Routine</button></div>${body||"<div class='notice'>No recurring pet-care routines yet.</div>"}</div>`;
}
function openPetRoutine(id=""){
  const r=petRoutineById(id)||{id:"",petId:"",title:"",type:"Grooming",everyDays:30,nextDate:ymd(),lastDone:"",notes:"",active:true};
  const petOptions=(state.pets||[]).filter(p=>p.status!=="Archived").map(p=>`<option value="${p.id}" ${p.id===r.petId?"selected":""}>${esc(p.name)}</option>`).join("");
  const types=["Grooming","Nail trim","Preventive care","Medication","Litter deep clean","Wash bedding","Weight check","Other"];
  modal(r.id?"Pet care routine":"Add recurring pet care",`<div class="stack"><label>Pet<select id="ptrpet"><option value="">Shared / all pets</option>${petOptions}</select></label><label>Routine<input id="ptrtitle" value="${esc(r.title||"")}" placeholder="Trim nails, deep-clean litter box…"></label><div class="grid2"><label>Care type<select id="ptrtype">${types.map(v=>`<option ${v===r.type?"selected":""}>${v}</option>`).join("")}</select></label><label>Repeat every N days<input id="ptrevery" type="number" min="0" value="${Number(r.everyDays||0)}"></label></div><div class="grid2"><label>Next date<input id="ptrnext" type="date" value="${esc(r.nextDate||"")}"></label><label>Status<select id="ptractive"><option value="1" ${r.active!==false?"selected":""}>Active</option><option value="0" ${r.active===false?"selected":""}>Paused</option></select></label></div><label>Notes<textarea id="ptrnotes" rows="3">${esc(r.notes||"")}</textarea></label><div class="muted small">This schedule appears only inside Daily Life. It does not create a reminder or notification.</div></div>`,"Save",async()=>{
    const title=$("#ptrtitle").value.trim();if(!title)return;let x=petRoutineById(id);if(!x){x={id:uid(),lastDone:""};state.petCareRoutines.push(x)}
    Object.assign(x,{petId:$("#ptrpet").value,title,type:$("#ptrtype").value,everyDays:Math.max(0,Number($("#ptrevery").value||0)),nextDate:$("#ptrnext").value,notes:$("#ptrnotes").value.trim(),active:$("#ptractive").value==="1"});await save();closeModal();render();
  });
}
async function completePetRoutine(id){
  const r=petRoutineById(id);if(!r)return;const date=ymd();r.lastDone=date;
  if(Number(r.everyDays)>0){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+Number(r.everyDays));r.nextDate=ymd(d)}else r.nextDate="";
  state.petLogs.push({id:uid(),petId:r.petId||"",type:r.type||"Care",date,time:new Date().toTimeString().slice(0,5),value:"",notes:r.title+(r.notes?" · "+r.notes:""),routineId:r.id});
  await save();render();
}

async function copyPetHandoff(){

    pets.length?"Pets: "+pets.join(", "):"",

function gardenSeasonInfo(){
  const m=new Date().getMonth()+1;
  if([12,1,2].includes(m))return{season:"Winter planning",focus:"Review last season, order seeds, plan beds, and watch indoor plants."};
  if([3,4].includes(m))return{season:"Early spring",focus:"Seed starting, bed prep, pruning, and checking soil conditions are common priorities."};
  if(m===5)return{season:"Spring planting",focus:"Transplants, direct sowing, containers, and frost-sensitive planting move to the front."};
  if([6,7,8].includes(m))return{season:"Growing season",focus:"Watering, weeds, pests, succession planting, and harvest tracking matter most."};
  if([9,10].includes(m))return{season:"Fall garden",focus:"Harvest, seed saving, cleanup, perennials, bulbs, and frost preparation are useful focuses."};
  return{season:"Late fall",focus:"Finish cleanup, protect tender plants, store supplies, and capture notes for next year."};
}

function plantRoutineById(id){return (state.plantCareRoutines||[]).find(x=>x.id===id)}
function plantRoutineDueState(r){
  if(r.active===false)return{due:false,label:"Paused",days:null};
  const linkedPlant=r.plantId?plantById(r.plantId):null;if(["Finished","Dormant"].includes(linkedPlant?.status))return{due:false,label:linkedPlant.status,days:null};
  const today=ymd(),date=String(r.nextDate||"");
  if(!date)return{due:false,label:r.lastDone?"Last done "+dl(r.lastDone):"No next date",days:null};
  const days=Math.ceil((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days<0)return{due:true,label:Math.abs(days)+"d overdue",days};
  if(days===0)return{due:true,label:"Due today",days};
  return{due:false,label:"Due "+dl(date),days};
}

async function completePlantRoutine(id){
  const r=plantRoutineById(id);if(!r)return;const date=ymd();r.lastDone=date;
  if(Number(r.everyDays)>0){const d=new Date(d[Truncated]
