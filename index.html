<script>

const DB_NAME="daily-life-local-v2";
const DB_VERSION=1;
const STORE="kv";
let __db;
function openDB(){
  if(__db) return Promise.resolve(__db);
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
    req.onblocked=()=>{window.__DailyLifeStartupStage="Waiting for phone storage";window.__DailyLifeStartupDetail="Phone storage is busy in another Daily Life page. The saved information has not been changed."};
    req.onsuccess=()=>{__db=req.result;__db.onversionchange=()=>__db.close();resolve(__db)};
    req.onerror=()=>reject(req.error||new Error("Phone storage could not be opened."));
  });
}
async function dbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function dbSet(key,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}
async function dbClear(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
  });
}

</script>

          detail:[fallback.child,fallback.date<date?"Carried forward from "+dl(fallback.date):"",fallback.notes,"Filled into open time from your real task list"].filter(Boolean).join(" ¬∑ "),
          fixed:false,kind:"task",icon:"‚úì",source:"task",sourceId:fallback.id,durationMinutes:mins,done:!!fallback.done,
          autoPlanned:true,openTimeFallback:true,carriedForward:fallback.date<date
        });

      }

      const chunk=remaining,end=g.end,
            next=nextAnchorAfter(end),
            short=chunk<30;

        id:"gap:"+date+":"+cursor,start:minutesHm(cursor),end:minutesHm(end),
        title:short?"Transition time":"Open time ¬∑ nothing else tracked",
        detail:short
          ?["Bathroom / water / put away what you were using",next?"Next: "+next.title:""].filter(Boolean).join(" ¬∑ ")
          :"Daily Life already placed every real task it can see. Use this block for rest, an unlogged need, or add/capture what actually needs doing.",
        fixed:false,kind:"gap",icon:short?"‚Üó":"",source:"gap",durationMinutes:chunk
      });
      cursor=end;
    }
  }
  return out;
}

function dayFlowCheckRows(){

function dayFlowItemKey(x,date){
  const source=String(x?.source||"item"),
    ref=String(x?.sourceId||x?.templateKey||x?.id||""),
    start=String(x?.start||""),
    title=String(x?.title||"");
  return String(date||x?.date||ymd())+"|"+source+"|"+ref+"|"+start+"|"+title;
}
function dayFlowSubtaskLabels(x){
  if(Array.isArray(x?.subtasks)&&x.subtasks.length)return x.subtasks.map(String).filter(Boolean);
  if(String(x?.templateKey||"")==="homework")return["Homework","Read 20 minutes"];
  if(x?.source==="suggested"){
    const parts=String(x.detail||"").split(/\s+¬∑\s+/).map(v=>v.trim()).filter(Boolean);
    if(parts.length>1)return parts;
  }
  return[String(x?.title||"Task")];
}
function dayFlowPartKey(itemKey,index){return itemKey+"|part:"+index}
function dayFlowPartDone(x,date,index){
  const ref=Array.isArray(x?.subtaskRefs)?x.subtaskRefs[index]:"";
  if(ref){
    const chore=(state.chores||[]).find(v=>v.id===ref);
    if(chore?.done)return true;
  }
  const key=dayFlowPartKey(dayFlowItemKey(x,date),index);
  return dayFlowCheckRows().some(r=>r.key===key);
}
function dayFlowBlockDone(x,date){
  const labels=dayFlowSubtaskLabels(x);
  return !!labels.length&&labels.every((_,i)=>dayFlowPartDone(x,date,i));
}
function dayFlowApplyNativeDone(x,done){
  if(!x)return;
  if(x.source==="task"){
    const t=(state.tasks||[]).find(v=>v.id===x.sourceId);
    if(t){t.done=done;t.completedAt=done?new Date().toISOString():""}
  }else if(x.source==="custom"){
    const b=(state.itineraryBlocks||[]).find(v=>v.id===x.sourceId);
    if(b)b.done=done;
  }else if(x.source==="meal"){
    const m=(state.meals||[]).find(v=>v.id===x.sourceId),
      step=m&&Array.isArray(m.dayFlowSteps)?m.dayFlowSteps.find(v=>String(v.start||"")===String(x.start||"")&&String(v.title||"")===String(x.title||"")):null;
    if(step)step.done=done;
  }
}
function dayFlowSyncFinished(x,date){
  const itemKey=dayFlowItemKey(x,date),finished=dayFlowFinishedRows(),index=finished.findIndex(r=>r.itemKey===itemKey),
    done=dayFlowBlockDone(x,date);
  if(done&&index<0){
    finished.push({
      id:"finished:"+uid(),itemKey,date,title:String(x.title||"Finished task"),start:String(x.start||""),end:String(x.end||""),
      detail:String(x.detail||""),subtasks:dayFlowSubtaskLabels(x),source:String(x.source||""),sourceId:String(x.sourceId||""),
      templateKey:String(x.templateKey||""),kind:String(x.kind||""),icon:String(x.icon||"‚úì"),completedAt:new Date().toISOString()
    });
  }else if(!done&&index>=0)finished.splice(index,1);
  dayFlowApplyNativeDone(x,done);
}
function dayFlowOverlayFinished(date,rows){
  const finished=dayFlowFinishedRows().filter(r=>r.date===date),keys=new Set();
  for(const x of rows){
    const key=dayFlowItemKey(x,date);keys.add(key);

  for(const r of finished){
    if(keys.has(r.itemKey))continue;
    rows.push({
      id:r.itemKey,title:r.title,start:r.start,end:r.end,detail:r.detail,subtasks:r.subtasks||[],
      source:r.source,sourceId:r.sourceId,templateKey:r.templateKey,kind:r.kind,icon:r.icon,done:true,archivedCompletion:true
    });
  }

}
async function toggleDayFlowPart(event,date,encodedItemKey,index){
  event?.preventDefault?.();event?.stopPropagation?.();

    x=itineraryDayItems(date).find(v=>dayFlowItemKey(v,date)===itemKey);

  const partIndex=Number(index)||0,key=dayFlowPartKey(itemKey,partIndex),rows=dayFlowCheckRows(),at=rows.findIndex(r=>r.key===key),
    wasDone=dayFlowPartDone(x,date,partIndex),nowDone=!wasDone;
  if(nowDone){
    if(at<0)rows.push({key,date,itemKey,index:partIndex,label:dayFlowSubtaskLabels(x)[partIndex]||x.title,completedAt:new Date().toISOString()});
  }else if(at>=0)rows.splice(at,1);
  const ref=Array.isArray(x.subtaskRefs)?x.subtaskRefs[partIndex]:"";

    const chore=(state.chores||[]).find(v=>v.id===ref);

  await save();
}

function dayFlowBucketForMinutes(m){
  if(m<360)return"before";
  if(m<720)return"morning";
  if(m<900)return"midday";
  if(m<1080)return"afternoon";
  if(m<1170)return"evening";
  return"tonight";
}
const DAY_FLOW_BUCKETS={
  before:{title:"Before Sunrise",icon:"‚òæ"},
  morning:{title:"Morning",icon:"‚òÄ"},
  midday:{title:"Midday",icon:"‚ó∑"},
  afternoon:{title:"Afternoon",icon:"‚úé"},

};
function dayFlowSleepBlock(date){
  if(state.settings?.itinerary?.protectSleep===false)return null;
  const log=sleepForDate(date),previous=shiftDateString(date,-1),plan=itinerarySleepPlan(previous),
    wake=hmMinutes(log?.wakeTime||plan?.wake||""),
    bedtime=String(log?.bedtime||plan?.bedtime||"");
  if(wake===null||wake<=0)return null;
  const actual=Number(log?.actualSleepHours||0),
    detail=[bedtime?"Continued from "+fmtClock(bedtime):"",actual>0?"~"+actual.toFixed(actual%1?1:0)+" h actual sleep logged":(plan?.targetHours?plan.targetHours+" h target":"Protected sleep")].filter(Boolean).join(" ¬∑ ");
  return {id:"sleep:"+date,start:"00:00",end:minutesHm(wake),title:"Sleep",detail,fixed:true,kind:"sleep",icon:"‚òæ",source:"sleep"};
}
function dayFlowBucketItems(date,key){
  const rows=itineraryDayItems(date).filter(x=>{
    if(String(x.templateKey||"")==="wind-down")return key==="tonight";
    const m=hmMinutes(x.start);return m!==null&&dayFlowBucketForMinutes(m)===key;
  });
  if(key==="before"){
    const sleep=dayFlowSleepBlock(date);
    if(sleep)rows.unshift(sleep);
  }
  return rows;
}

function dayFlowActor(x){
  if(!x)return "";
  if(x.source==="work")return "me";
  const owner=String(x.actor||x.person||x.responsible||"").trim().toLowerCase();
  if(owner)return owner;
  const title=String(x.title||"").trim();
  // Explicitly assigned Tanner actions run in parallel with the UPS shift.
  if(/^tanner\s*[¬∑:‚Äì-]\s*/i.test(title))return "tanner";
  return "";
}
function dayFlowDifferentPeople(a,b){
  const aa=dayFlowActor(a),bb=dayFlowActor(b);
  // Unknown ownership is not proof that two appointments can overlap.
  return !!(aa&&bb&&aa!==bb);
}
function dayFlowConflictAudit(date){
  const anchors=itineraryFixedItems(date).filter(x=>!x.nonBlocking&&hmMinutes(x.start)!==null),
    overlaps=[],seen=new Set(),diagnostics=itineraryPlanningDiagnostics(date);
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i],as=hmMinutes(a.start),ae=hmMinutes(a.end);
    if(as===null||ae===null||ae<=as)continue;
    for(let j=i+1;j<anchors.length;j++){
      const b=anchors[j],bs=hmMinutes(b.start),be=hmMinutes(b.end);
      if(bs===null||be===null||be<=bs)continue;
      const overlap=Math.min(ae,be)-Math.max(as,bs);
      if(overlap<=0||dayFlowDifferentPeople(a,b))continue;
      if(a.source==="meal"&&b.source==="meal"&&a.sourceId===b.sourceId)continue;
      const key=[a.id,b.id].sort().join("|");if(seen.has(key))continue;seen.add(key);
      overlaps.push({a,b,minutes:overlap});
    }
  }
  return{
    overlaps,
    skipped:diagnostics.skipped||[],
    sleepConflicts:diagnostics.sleepConflicts||[],
    hardCount:overlaps.length+(diagnostics.sleepConflicts||[]).length,
    routineCount:(diagnostics.skipped||[]).length,
    count:overlaps.length+(diagnostics.skipped||[]).length+(diagnostics.sleepConflicts||[]).length
  };
}
function dayFlowConflictCard(date){
  const audit=dayFlowConflictAudit(date);
  if(!audit.count)return `<div class="notice dayflow-clear"><b>No schedule conflicts detected.</b> Fixed anchors, routines, meals, and sleep currently fit without an obvious collision.</div>`;
  return `<div class="card dayflow-conflict-card"><div class="section-title"><div><div class="eyebrow">Schedule review</div><h2>${audit.hardCount?audit.hardCount+" possible conflict"+(audit.hardCount===1?"":"s"):"No fixed-time conflicts"}</h2><div class="muted small">${audit.routineCount?audit.routineCount+" flexible routine"+(audit.routineCount===1?"":"s")+" could not fit.":""} Routines that did not fit are suggestions, not overlapping appointments. Fixed commitments are never moved automatically.</div></div></div>
    ${audit.overlaps.map(({a,b,minutes})=>`<div class="dayflow-conflict-row"><b>Possible overlap ¬∑ ${minutes} min</b><span>${esc(fmtClock(a.start))} ${esc(a.title)} ‚Üî ${esc(fmtClock(b.start))} ${esc(b.title)}</span></div>`).join("")}
    ${audit.skipped.map(x=>`<div class="dayflow-conflict-row"><b>Couldn‚Äôt fit ¬∑ ${esc(x.title)}</b><span>Preferred ${esc(fmtClock(x.originalStart||x.start))}${x.originalEnd?"‚Äì"+esc(fmtClock(x.originalEnd)):""} ¬∑ tap it in the agenda to adjust.</span></div>`).join("")}
    ${audit.sleepConflicts.map(x=>`<div class="dayflow-conflict-row"><b>Sleep-window conflict ¬∑ ${esc(x.title)}</b><span>${esc(fmtClock(x.start))}${x.end?"‚Äì"+esc(fmtClock(x.end)):""}</span></div>`).join("")}
  </div>`;
}

function monthNameFromKey(key){const n=Number(key);return n>=1&&n<=12?new Date(2026,n-1,1).toLocaleDateString("en-US",{month:"short"}):String(key)}

function peakSeasonPlanningRows(){
  const x=upsSeasonality(),p=upsEmploymentProfile();if(!x)return[];
  const year=Number(ymd().slice(0,4)),previous=String(year-1),current=String(year),
        lastYear=x.years?.[previous]||{},thisYear=x.years?.[current]||{},
        recent=Number(x.recentWeeklyAverageNet||0),
        latestInside=[...(p?.verifiedRates||[])].filter(v=>v.job==="inside"&&Number(v.rate)>0).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).slice(-1)[0],
        currentRate=Number(p?.currentRate||latestInside?.rate||employmentRateForDate(p,ymd())?.rate||0),
        months=["10","11","12"];
  return months.map(month=>{
    const targetDate=`${year}-${month}-15`,effective=employmentRateForDate(p,targetDate),targetRate=Number(effective?.rate||currentRate||0),
          rateFactor=currentRate>0&&targetRate>0?targetRate/currentRate:1,
          recentMonthly=recent>0?recent*4.345*rateFactor:0,
          prior=Number(lastYear[month]||0),actual=Number(thisYear[month]||0),
          candidates=[prior,recentMonthly].filter(n=>Number.isFinite(n)&&n>0),
          low=candidates.length?Math.min(...candidates):0,high=candidates.length?Math.max(...candidates):0;
    return{month,targetDate,prior,recentMonthly,actual,low,high,targetRate,rateAdjusted:Math.abs(rateFactor-1)>.001};
  });
}

function monthlyReaderTickets(){
  const prefix=ymd().slice(0,7), readers=state.settings.readers||[];
  return readers.map(reader=>{
    const daily={};
    for(const r of state.readingLogs.filter(x=>x.reader===reader&&x.date.startsWith(prefix)))daily[r.date]=(daily[r.date]||0)+Number(r.pages||0);
    let tickets=0,pages=0,days=0;
    for(const p of Object.values(daily)){pages+=p;days++;tickets+=p>=40?3:p>=20?2:p>=5?1:0}
    return {reader,tickets,pages,days};
  });
}

  const winner=pool[Math.floor(Math.random()*pool.length)];
  alert(`Reader Wheel winner: ${winner}!`);
}

function ensureFamilyDay(date=ymd()){

    const name=String(child||"").trim(),task=String(chore||"").trim();if(!name||!task)return;
    desired.set(name+"|"+task,{child:name,chore:task,generated});
  };

        basics=(settings.dailyKidBasics||[]).map(String).map(x=>x.trim()).filter(Boolean),
        weekday=new Date(date+"T12:00:00").getDay(),
        kidsHomeForGeneratedRoutines=weekday!==6;
  if(kidsHomeForGeneratedRoutines)for(const name of family)for(const basic of basics)addDesired(name,basic,"daily-basics");

    if(!kidsHomeForGeneratedRoutines)continue;

          chores=(r.chores||[]).map(String).map(x=>x.trim()).filter(Boolean);
    if(!members.length||!chores.length)continue;

          offset=dateDayIndex(date)-dateDayIndex(anchor);
    for(let i=0;i<members.length;i++){
      const choreIndex=((i+offset)%chores.length+chores.length)%chores.length;
      addDesired(members[i],chores[choreIndex],"rotation");
    }
  }
  const generatedKinds=new Set(["daily-basics","rotation"]),kept=new Map(),next=[];
  for(const row of state.chores||[]){
    if(row.date!==date||!generatedKinds.has(String(row.generated||""))){next.push(row);continue}
    const key=String(row.child||"").trim()+"|"+String(row.chore||"").trim();
    if(!desired.has(key)||kept.has(key)){
      // Changing a recurring rule must not erase a completed chore or a
      // review decision that has already been recorded. Only untouched,
      // automatically generated rows can be retired.
      const recordedReview=(state.dailyReviews||[]).some(r=>
        r.date===date&&r.kind==="chore"&&String(r.key)===String(row.id)&&
        String(r.status||"")!=="unknown");
      if(row.done||row.completedAt||recordedReview)next.push(row);
      continue;
    }
    const target=desired.get(key);
    row.child=target.child;row.chore=target.chore;row.generated=target.generated;
    kept.set(key,row);next.push(row);
  }
  state.chores=next;
  const existing=new Set((state.chores||[]).filter(x=>x.date===date).map(x=>String(x.child||"").trim()+"|"+String(x.chore||"").trim()));
  for(const [key,target] of desired){
    if(existing.has(key))continue;
    state.chores.push({id:uid(),date,child:target.child,chore:target.chore,done:false,generated:target.generated});
    existing.add(key);
  }
}

        endDate=/^\d{4}-\d{2}-\d{2}$/.test(String(r.endDate||""))?String(r.endDate):"";

  const used=new Set();

    if(!e)e=generated.find(x=>!used.has(x.id)&&!x.recurringRuleId&&x.date===date&&String(x.title||"").toLowerCase()===String(r.title||"").toLowerCase()&&String(x.child||"")===child&&String(x.startTime||"")===startTime);

    used.add(e.id);
  }
  state.events=(state.events||[]).filter(e=>{
    if(e.generated!=="recurring")return true;

function eventDisplayKey(e){

             .replace(/\bfull\s*[- ]?cast\b/g," ")

function sleepWindowHours(log){
  if(!log?.bedtime||!log?.wakeTime)return 0;
  const [bh,bm]=log.bedtime.split(":").map(Number),[wh,wm]=log.wakeTime.split(":").map(Number);
  let mins=wh*60+(wm||0)-(bh*60+(bm||0));if(mins<0)mins+=1440;
  return mins/60;
}
function sleepHours(log){
  const actual=Number(log?.actualSleepHours);
  return Number.isFinite(actual)&&actual>0?actual:sleepWindowHours(log);
}

function dailyReviewEntry(kind,key,date=ymd()){

}
function dailyReviewSet(kind,key,date,status,label="",group=""){
  if(!Array.isArray(state.dailyReviews))state.dailyReviews=[];
  let x=dailyReviewEntry(kind,key,date);
  if(!x){x={id:uid(),date,kind,key:String(key)};state.dailyReviews.push(x)}
  Object.assign(x,{status,label,group,updatedAt:new Date().toISOString()});
  return x;
}
function dailyReviewClear(kind,key,date=ymd()){
  state.dailyReviews=(state.dailyReviews||[]).filter(x=>!(x.date===date&&x.kind===kind&&String(x.key)===String(key)));
}
function dailyReviewStatus(kind,key,date=ymd()){
  const review=dailyReviewEntry(kind,key,date);
  // Actual confirmed completion always wins over an older review answer.
  // This lets a later ChatGPT update correct an earlier "No" without making
  // the dashboard and the daily-review count disagree.
  if(kind==="task"){
    const x=(state.tasks||[]).find(v=>String(v.id)===String(key)&&v.date===date);
    if(x?.done)return"yes";
  }else if(kind==="chore"){
    const x=(state.chores||[]).find(v=>String(v.id)===String(key)&&v.date===date);
    if(x?.done)return"yes";
  }else if(kind==="care"){
    if(selfCareDone(key,date))return"yes";
  }
  // Standalone daily routine reviews are explicit answers, not inferred
  // checkbox state. They remain attached to the day on which they happened.
  if(kind==="routine")return review?.status||"unknown";
  // An explicit uncheck after an earlier "Yes" is a correction, not a
  // completed habit. Leave it unknown until the user confirms what happened.
  if(review?.status==="yes")return"unknown";
  return review?.status||"unknown";
}

/* Choose one visible daily chore when an imported confirmation overlaps a
   generated chore. Never delete a stored record or erase completed history. */
function displayChoresForDate(date=ymd()){
  const rows=(state.chores||[]).filter(x=>x.date===date),out=[],indices=new Map();
  const norm=x=>String(x||"").trim().toLocaleLowerCase().replace(/\s+/g," ");
  const dedupEligible=x=>!!(x.generated||x.cloudEntryId||x.source==="chatgpt");
  for(const row of rows){
    const key=norm(row.child)+"|"+norm(row.chore);
    const pos=indices.get(key);
    if(pos===undefined){indices.set(key,out.length);out.push(row);continue}
    const previous=out[pos];
    if(!dedupEligible(row)&&!dedupEligible(previous)){
      // Explicitly entered identical chores may be separate occurrences.
      out.push(row);continue;
    }
    if((row.done&&!previous.done)||
      (row.done===previous.done&&!!row.generated&&!previous.generated))out[pos]=row;
  }
  return out;
}
function dailyReviewExpected(date=ymd()){
  const rows=[];
  for(const t of (state.tasks||[]).filter(x=>x.date===date)){
    if(String(t.title||"").trim().toLowerCase()==="ups shift"&&typeof isUsualWorkday==="function"&&!isUsualWorkday(date)&&!(typeof workShiftHasActual==="function"&&workShiftHasActual(workForDate(date))))continue;
    // Daily kid basics are already tracked as concrete per-child chore rows below.
    // Skip broad duplicate task titles so review asks "Leo ¬∑ Read 20 min", etc.,
    // instead of vague catch-alls like "Everyone reading".
    if(typeof itineraryIsBroadFamilyRoutineTask==="function"&&itineraryIsBroadFamilyRoutineTask(t))continue;
    const taskDetail=[String(t.notes||"").trim(),t.category].filter(Boolean).join(" ¬∑ "),
          taskLabel=t.child?`${t.child} ¬∑ ${t.title||"Task"}`:(t.title||"Task");
    rows.push({kind:"task",key:t.id,label:taskLabel,group:"Tasks",detail:taskDetail,status:dailyReviewStatus("task",t.id,date)});
  }
  for(const c of displayChoresForDate(date)){
    const child=String(c.child||"").trim(),chore=String(c.chore||"Chore").trim(),
          label=child?`${child} ¬∑ ${chore}`:chore,
          group=c.generated==="daily-basics"?"Kids daily routine":c.generated==="rotation"?"Kids rotating chore":"Chores + routines";
    rows.push({kind:"chore",key:c.id,label,group,detail:String(c.notes||"").trim(),status:dailyReviewStatus("chore",c.id,date)});
  }
  // Record today's named care routines independently of yesterday's tasks.
  // A missed hair/shower routine is reviewable as "No" on that date; it never
  // becomes an unfinished task on the next date.
  const dailyRoutines=typeof itinerarySuggestedBlocks==="function"?itinerarySuggestedBlocks(date):[];
  const trackedRoutineKeys=new Set();
  for(const routine of dailyRoutines){
    const key=String(routine.templateKey||"");
    if(!(key==="dolly-hair"||/^kid-shower-/.test(key))||trackedRoutineKeys.has(key))continue;
    trackedRoutineKeys.add(key);
    rows.push({kind:"routine",key,label:String(routine.title||key),group:"Daily family care",
      detail:String(routine.detail||"Only for this date"),
      status:dailyReviewStatus("routine",key,date)});
  }
  for(const h of selfCareHabits()){
    const copy=SELF_CARE_REVIEW_COPY[h.key]||null;
    if(copy?.review===false)continue;
    rows.push({
      kind:"care",
      key:h.key,
      label:copy?.label||h.label,
      group:"Self care",
      detail:copy?.detail||h.group||"",
      status:dailyReviewStatus("care",h.key,date)
    });
  }
  return rows;
}
function dailyReviewSummary(date=ymd()){
  const rows=dailyReviewExpected(date),counts={yes:0,no:0,na:0,unknown:0,total:rows.length};

async function applyDailyReview(kind,key,date,status,openReviewAfter=true){

  if(!item)return;

    else if(t)t.done=false;

      const ok=await sharingUpsertTask(t);

    const c=(state.chores||[]).find(x=>String(x.id)===String(key));
    if(c&&status==="yes")c.done=true;
    else if(c)c.done=false;

  const segments=raw.split(/\\s*[¬∑‚Ä¢;\\n]\\s*/).map(x=>x.trim()).filter(x=>x.length>2&&x.length<110);
  return segments.length>=2&&segments.length<=12?segments:[];

async function dailyReviewStepAnswer(key,date,index,status){

  if(!item||!["yes","no","unknown"].includes(status))return;
  const steps=dailyReviewSteps(item);

  if(!state.settings.reviewSteps)state.settings.reviewSteps={};
  const id=date+"|"+key,record=state.settings.reviewSteps[id]||{};
  record[index]=status;state.settings.reviewSteps[id]=record;
  const values=steps.map((_,i)=>record[i]||"unknown");

  else {
    const task=(state.tasks||[]).find(x=>String(x.id)===String(key));

function projectUrgency(p){

  const days=Math.ceil((new Date(due+"T12:00:00")-new Date(ymd()+"T12:00:00"))/86400000);
  return days<0?-10:days<=7?0:days<=30?10:30;
}

function tireLogTimestamp(x){
  const date=String(x?.date||""),rawTime=String(x?.time||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return NaN;
  const time=/^\d{2}:\d{2}$/.test(rawTime)?rawTime:"12:00";
  return new Date(date+"T"+time+":00").getTime();
}
function tirePressureStats(){
  const rows=[...(state.tireLogs||[])].map(x=>({...x,_ts:tireLogTimestamp(x)}))
    .filter(x=>Number.isFinite(x._ts)&&Number.isFinite(Number(x.psi))&&Number(x.psi)>0)
    .sort((a,b)=>a._ts-b._ts);
  const losses=[];let lastFill=null;
  for(const row of rows){
    const event=String(row.event||"reading").toLowerCase();
    if(event==="fill"){lastFill=row;continue}
    if(!lastFill)continue;
    const hours=(row._ts-lastFill._ts)/3600000,loss=Number(lastFill.psi)-Number(row.psi);
    if(hours>=1&&loss>0)losses.push({from:lastFill,to:row,hours,loss,perDay:loss/(hours/24)});
    lastFill=null;
  }
  const recent=losses.slice(-4),avgPerDay=recent.length?recent.reduce((n,x)=>n+x.perDay,0)/recent.length:null;
  return{rows,latest:rows[rows.length-1]||null,latestFill:[...rows].reverse().find(x=>String(x.event||"").toLowerCase()==="fill")||null,losses,recent,avgPerDay,samples:recent.length};
}
function latestVehicleService(vehicleId,pattern){
  return [...(state.vehicleServices||[])].filter(x=>(!vehicleId||!x.vehicleId||x.vehicleId===vehicleId)&&pattern.test(String(x.type||"")))
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||Number(b.mileage||0)-Number(a.mileage||0))[0]||null;
}
function vehicleMaintenanceSnapshot(v=primaryVehicle()){
  if(!v)return{oil:null,rotation:null};
  const currentMiles=Number(v.mileage||0),
        oilLast=latestVehicleService(v.id,/oil/i),
        rotationLast=latestVehicleService(v.id,/rotation/i),
        build=(key,label,last,dueMiles,dueDate,interval)=>{
          const miles=Number(dueMiles||0)||null,date=String(dueDate||""),every=Number(interval||0)||null,
                mileageDue=!!(miles&&currentMiles&&currentMiles>=miles),
                dateDue=!!(date&&date<=ymd()),
                due=mileageDue||dateDue,
                milesRemaining=miles&&currentMiles?miles-currentMiles:null;
          return{key,label,last,dueMiles:miles,dueDate:date,interval:every,due,mileageDue,dateDue,milesRemaining,currentMiles};
        };
  return{
    oil:build("oil","Oil change",oilLast,v.oilDueMiles,v.oilDueDate,v.oilIntervalMiles),
    rotation:build("rotation","Tire rotation",rotationLast,v.rotationDueMiles,v.rotationDueDate,v.rotationIntervalMiles)
  };
}
function vehicleMaintenanceText(x){
  if(!x)return{main:"not set",detail:""};
  let main="not set";
  if(x.due)main="DUE";
  else if(x.dueMiles)main=Number(x.dueMiles).toLocaleString()+" mi";
  else if(x.dueDate)main=dl(x.dueDate);
  else if(x.interval)main="log a service to calculate";
  const detail=[
    x.last?(x.last.mileage?"Last "+Number(x.last.mileage).toLocaleString()+" mi":x.last.date?"Last "+dl(x.last.date):""):"",
    x.interval?"every "+Number(x.interval).toLocaleString()+" mi":"",
    !x.due&&x.milesRemaining!==null&&x.milesRemaining>0?Number(x.milesRemaining).toLocaleString()+" mi remaining":""
  ].filter(Boolean).join(" ¬∑ ");
  return{main,detail};
}
function recalculateVehicleMaintenance(v=primaryVehicle()){
  if(!v)return;
  const oil=latestVehicleService(v.id,/oil/i),rotation=latestVehicleService(v.id,/rotation/i),
        oi=Number(v.oilIntervalMiles||0),ri=Number(v.rotationIntervalMiles||0);
  if(oil?.mileage&&oi>0)v.oilDueMiles=Number(oil.mileage)+oi;
  if(rotation?.mileage&&ri>0)v.rotationDueMiles=Number(rotation.mileage)+ri;
}
function ensureVehicleMaintenanceTasks(date=ymd()){

      state.tasks.push(task);

  }
}

function vehicleFuelStats(vehicleId=""){
  const fills=(state.vehicleServices||[]).filter(x=>(!vehicleId||!x.vehicleId||x.vehicleId===vehicleId)&&isFuelService(x)&&Number(x.mileage)>0&&Number(x.gallons)>0)
    .sort((a,b)=>Number(a.mileage)-Number(b.mileage)||String(a.date||"").localeCompare(String(b.date||"")));
  const byId=new Map(),mpgs=[];
  for(let i=0;i<fills.length;i++){
    const x=fills[i],prev=fills[i-1],pricePerGallon=Number(x.cost)>0?Number(x.cost)/Number(x.gallons):null;
    let miles=null,mpg=null;
    if(prev&&x.fullTank===true&&prev.fullTank===true){
      const diff=Number(x.mileage)-Number(prev.mileage);
      if(diff>0&&diff<2000){miles=diff;mpg=diff/Number(x.gallons);mpgs.push(mpg)}
    }
    byId.set(x.id,{pricePerGallon,miles,mpg});
  }
  const latest=fills[fills.length-1]||null,avgMpg=mpgs.length?mpgs.slice(-5).reduce((a,b)=>a+b,0)/mpgs.slice(-5).length:null;
  return{fills,latest,byId,avgMpg,mpgs};
}

function daysSinceDate(date){
  if(!date)return null;
  const d=new Date(date+"T12:00:00");if(Number.isNaN(d.getTime()))return null;

}
