    else if(r.status==="Transfer needed")note=`${transferInstruction(r)} by ${dl(b.due)}. After reserving that transfer and bills due through this date, ${money(Math.max(0,r.globalProjectedAfter)/100)} of additional transferable capacity is projected to remain.`;
    else note=`${r.projectedIncome>0?"+"+money(r.projectedIncome/100)+" expected into this account before the due date · ":""}${money(-r.projectedAfter/100)} projected short by ${dl(b.due)} after earlier bills.`;
  }else if(r.status==="Balance unavailable")note="Readiness needs a recorded checking or savings balance. Credit balances track debt, not available cash.";
  else if(r.status==="Check bill")note="Correct the amount or due date before relying on this projection.";
  else if(pendingPayment)note=`Bank payment pending${b.paidDate?" since "+dl(b.paidDate):""}${b.paidMerchant?" · "+b.paidMerchant:""}${Number.isFinite(Number(b.paidAmount))?" · "+money(b.paidAmount):""} · already reflected in available cash, so Daily Life is not reserving this bill again.`;
  else if(bankMatched)note=`Bank matched${b.paidDate?" "+dl(b.paidDate):""}${b.paidMerchant?" · "+b.paidMerchant:""}${Number.isFinite(Number(b.paidAmount))?" · "+money(b.paidAmount):""} · not reserved again.`;
  else if(paid)note="Paid manually · not reserved.";
  else note=b.paymentAccountKey?"The recorded account is missing or its key is not unique. Edit to choose an account.":"Choose the account that will pay this bill.";
  const repeat=BILL_REPEATS.find(([n])=>n===billRepeat(b))[1],desired=state.accounts.find(a=>a.key===b.desiredAccountKey),amountType=recordedBillAmountType(b),frequency=recordedBillFrequency(b);
  return `<div class="row bill-row"><div class="bill-info"><label class="task"><input type="checkbox" aria-label="Mark ${esc(b.name)} paid" ${paid?"checked":""} onchange="toggleBill(state.bills[${r.index}].id,this.checked)"><span class="${paid&&!pendingPayment?"done":""}">${b.due?dl(b.due):"No due date"} · ${esc(b.name)}</span></label>
  <details class="bill-details"><summary><span class="bill-status ${tone}">${esc(r.status)}</span><span>Payment details</span></summary><div class="small muted">Current payment: ${esc(r.account?.name||"Unassigned / unavailable account")} · Recorded setup: ${r.setup}</div>
  ${desired&&desired.key!==b.paymentAccountKey?`<div class="small muted">Desired payment account: ${esc(desired.name)}</div>`:""}
  <div class="small muted">${esc(amountType)} · ${esc(frequency)}</div>
  ${billRepeat(b)?`<div class="small muted">${repeat} · next occurrence is added when marked paid.</div>`:""}
  <div class="actions">${pendingPayment?`<span class="bill-status unknown">Bank payment pending</span>`:bankMatched?`<span class="bill-status covered">Bank matched</span>`:paid?`<span class="tag">Paid manually</span>`:`<span class="bill-status ${tone}">${r.status}</span>${r.setup==="Unknown"?`<span class="bill-status unknown">Setup unknown</span>`:""}`}</div><div class="small muted">${note}</div></details></div>
  <div class="bill-actions"><b>${money(b.amount)}</b><button class="btn" aria-label="Edit bill ${esc(b.name)}" onclick="openBill(${r.index})">${pendingPayment?"View bank payment":bankMatched?"View bank match":paid?"Edit paid bill":"Edit"}</button>
  ${paid&&!pendingPayment?`<button class="btn" aria-label="Next bill for ${esc(b.name)}" onclick="openNextBill(${r.index})">${nextBillIndex(b)>=0?"View next bill":"Create next bill"}</button>`:""}</div></div>`;
}
function upcomingBillsView(){
  const rows=billReadiness(),unpaid=rows.filter(r=>r.bill.status!=="paid"||r.bill.paymentPending),paid=rows.filter(r=>r.bill.status==="paid"&&!r.bill.paymentPending);

}
function openBill(index=-1,sourceIndex=-1){

  <div class="stack"><label>Bill name<input id="bn" required maxlength="200" value="${esc(b.name)}"></label><label>Amount<input id="ba" type="number" inputmode="decimal" min="0" max="999999999" step=".01" required value="${esc(b.amount??"")}"></label>
  <div><label for="bd">Due date</label><div class="bill-date-control"><input id="bd" type="date" required value="${esc(b.due)}"><button class="btn" type="button" onclick="pickBillDate()" aria-label="Choose bill due date">Choose date</button></div></div>
  <label>Current payment account<select id="billAccount"><option value="">Unassigned</option>${missing?`<option value="${esc(b.paymentAccountKey)}" selected>Previously assigned account (unavailable)</option>`:""}${accountOptions.map(a=>`<option value="${esc(a.key)}" ${a.key===b.paymentAccountKey?"selected":""}>${esc(a.name)} · ${esc(a.type)}${a.type==="credit"?" (readiness unavailable)":""}</option>`).join("")}</select></label>
  <label>Desired payment account (optional)<select id="billDesiredAccount"><option value="">No change planned</option>${desiredMissing?`<option value="${esc(b.desiredAccountKey)}" selected>Previously desired account (unavailable)</option>`:""}${accountOptions.map(a=>`<option value="${esc(a.key)}" ${a.key===b.desiredAccountKey?"selected":""}>${esc(a.name)} · ${esc(a.type)}</option>`).join("")}</select></label>
  <label>Payment setup<select id="billSetup">${BILL_SETUPS.map(setup=>`<option ${recordedBillSetup(b)===setup?"selected":""}>${setup}</option>`).join("")}</select></label>
  <label>Amount type<select id="billAmountType">${BILL_AMOUNT_TYPES.map(type=>`<option ${recordedBillAmountType(b)===type?"selected":""}>${type}</option>`).join("")}</select></label>
  <label>Bill frequency / status<select id="billFrequency" onchange="syncBillFrequencyRepeat()">${BILL_FREQUENCIES.map(type=>`<option ${recordedBillFrequency(b)===type?"selected":""}>${type}</option>`).join("")}</select></label>
  ${paid?`<input id="billRepeat" type="hidden" value="${billRepeat(b)}">`:`<label for="billRepeat">Repeat</label><select id="billRepeat" onchange="syncBillRepeatFrequency()">${BILL_REPEATS.map(([n,label])=>`<option value="${n}" ${billRepeat(b)===n?"selected":""}>${label}</option>`).join("")}</select><p class="muted small">When marked paid, a repeating bill creates one unpaid next occurrence with the same amount, account and setup. Short months use their last day, then return to the original day. Review variable bill amounts each cycle. Edits apply only to this occurrence and the next one it has not yet created.</p>`}</div>
  <p class="muted small">Accounts come from Money. Setup is your record only; this app does not schedule payments or verify autopay.</p>`,existing?"Save changes":"Add bill",async()=>{
    for(const id of ["bn","ba","bd"]){if(!$("#"+id).checkValidity()){$("#"+id).reportValidity();return}}
    const name=$("#bn").value.trim(),amount=Number($("#ba").value),due=$("#bd").value,paymentAccountKey=$("#billAccount").value,desiredAccountKey=$("#billDesiredAccount").value,paymentSetup=$("#billSetup").value,amountType=$("#billAmountType").value,frequency=$("#billFrequency").value,repeatMonths=Number($("#billRepeat").value);

async function undoBankBillMatch(id,ask=true){
  const x=state.bills.find(b=>b.id===id);if(!x||x.paidSource!=="bank")return false;

  const before=structuredClone(state.bills),reviewsBefore=structuredClone(state.settings.bankTransactionReviews||{}),
        transactionId=String(x.paidByBankTransactionId||"");
  if(!state.settings.bankTransactionReviews)state.settings.bankTransactionReviews={};
  if(transactionId)state.settings.bankTransactionReviews[transactionId]={action:"not_bill",reviewedAt:new Date().toISOString()};
  x.status="upcoming";x.paymentPending=false;
  delete x.paidByBankTransactionId;delete x.paidSource;delete x.paidDate;delete x.paidAmount;delete x.paidMerchant;
  try{
    await save();
    if(typeof cloudImportBankSpending==="function")await cloudImportBankSpending(false);
    closeModal();render();return true;
  }catch(error){
    state.bills=before;state.settings.bankTransactionReviews=reviewsBefore;render();

  }
}
async function toggleBill(id,paid){

  if(!paid){x.paymentPending=false;delete x.paidByBankTransactionId;delete x.paidSource;delete x.paidDate;delete x.paidAmount;delete x.paidMerchant}

async function registerAppWorker(){

    if(reg.waiting&&hadController)showAppUpdateNotice();
