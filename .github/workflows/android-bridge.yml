name: Build Daily Life Bridge APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-bridge.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle -p android-bridge :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-life-bridge-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
