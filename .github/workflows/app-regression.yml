name: Daily Life regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate main app scripts
        run: node --check life-orchestrator.js && node --check holiday-gifts.js && node --check schedule-photo-import.js
      - name: Run dependency-free app regression tests
        run: node --test tests/*.test.cjs
