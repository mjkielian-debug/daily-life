<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily Life botanical flower icon">
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="438" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8eb59a"/>
      <stop offset=".34" stop-color="#52765d"/>
      <stop offset=".72" stop-color="#355742"/>
      <stop offset="1" stop-color="#263f32"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".9">
      <stop offset="0" stop-color="#fff7ef" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#f8e6d8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f8e6d8" stop-opacity="0"/>
